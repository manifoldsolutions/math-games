<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yksikköympyrä</title>

<!-- ════════════════════════════════════════════════════════════════════
     GAME: Yksikköympyrä (unit circle equations)
     Self-contained. Suggested home: games/lukio/<course>/yksikkoympyra/index.html
     An equation about the angle α is shown above the unit circle. The player
     marks EVERY point on the circle where the equation holds; the task is
     solved the moment all solutions are marked and no wrong point is left.
     Aim: hover with the mouse, or drag with a finger (a ray follows).
     Place: click, or lift the finger. Placing on an existing point removes it.
     From level 3 there are also "Ei ratkaisuja" and "Jokainen piste" answers.
     A placed point counts if it is within TOL degrees of a solution.
     Levels 0–7, 6 tasks each. Level 0 shows the angle while aiming; levels
     1–6 have their own themes, level 7 mixes levels 3–6.
     Help: "Vihje", one step per press: memory triangle (where it helps),
     method hint, hint about the placed points, then the helper line. After
     the last step "Näytä ratkaisu" appears. From level 3 two buttons show
     the memory triangles (30°–60° and 45°) with their sin/cos/tan values.
     Scoring (like Yhtälövaaka), 3 lives. Each solved task gives
       (50 + 100·solutions/clicks + 50·(5 s + 2 s·clicks)/time − 30·hints) × level
     (level 0 counts as ×1; time points have no cap). A wrong "Ei ratkaisuja"
     / "Jokainen piste" counts as one hint (cost and hint step) and the task
     goes on; "Näytä ratkaisu" costs a life and gives no points. The third
     lost life is Game Over.
     Finishing level 7 gives 1000 + 500 per life left.
     Keys: ← / → turn the ray 15° (Shift: 1°), Space = place/remove,
           Enter = next, r = clear points
     ════════════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- shared site look: colours, fonts, header, buttons, dialogs -->
<link rel="stylesheet" href="../../../../assets/theme.css">
<!-- Chakra Petch has no Greek; IBM Plex Sans supplies α and π (the browser
     only downloads its Greek part, because the CSS is split by unicode-range) -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">

<style>
  /* Only what is specific to this game. Everything else comes from assets/theme.css. */
  :root{
    --math:"Chakra Petch", "IBM Plex Sans", system-ui, sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  @media (max-width:520px){ .game .title{ display:none; } }

  main{ flex:1; display:flex; flex-direction:column; align-items:center; padding:0 8px; }

  /* ── equation ── */
  .readout{
    font-family:var(--math); font-weight:500; font-size:clamp(26px,7.5vw,40px);
    min-height:2.1em; display:flex; align-items:center; justify-content:center;
    white-space:nowrap; margin-top:14px; padding:0 8px;
  }
  .al{ font-style:normal; color:var(--accent-ink); }
  .fn{ color:var(--ink); }
  .frac{
    display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center;
    font-size:.62em; line-height:1.08; margin:0 .08em;
  }
  .frac > span:first-child{ border-bottom:.075em solid currentColor; padding:0 .14em .04em; }
  .frac > span:last-child{ padding-top:.04em; }
  .rad{ border-top:.07em solid currentColor; padding:0 .04em; margin-left:-.02em; }
  sup{ font-size:.6em; line-height:0; }

  /* ── stage ── */
  .stage-wrap{ width:min(560px,100%); }
  #stage{
    display:block; width:100%; height:auto; margin:0 auto;
    max-height:calc(100dvh - 330px); min-height:250px;
    user-select:none; -webkit-user-select:none; touch-action:none; cursor:crosshair;
  }
  #stage:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; border-radius:var(--radius); }
  .grid{ stroke:var(--line); stroke-width:1.5; }
  .axis{ stroke:var(--muted); stroke-width:2.2; }
  .arrow{ fill:var(--muted); }
  .axlabel{ font-family:var(--ui); font-size:21px; fill:var(--muted); }
  .circle{ fill:none; stroke:var(--ink); stroke-width:3.5; }
  .tick{ stroke:var(--muted); stroke-width:2; }
  .tanline{ stroke:var(--accent); stroke-width:2; stroke-dasharray:6 7; opacity:.45; }

  .proj{ stroke:var(--muted); stroke-width:1.6; stroke-dasharray:5 6; }
  .cosseg{ stroke:var(--green); stroke-width:7; stroke-linecap:round; opacity:.85; }
  .sinseg{ stroke:var(--brown); stroke-width:7; stroke-linecap:round; opacity:.85; }
  .tanseg{ stroke:var(--accent); stroke-width:7; stroke-linecap:round; opacity:.7; }
  .tanext{ stroke:var(--accent); stroke-width:1.8; stroke-dasharray:4 6; opacity:.6; }
  .ray{ stroke:var(--accent); stroke-width:4; stroke-linecap:round; filter:var(--glow-cyan); }
  .ghost{ fill:var(--surface); stroke:var(--accent); stroke-width:3.5; }
  .origin{ fill:var(--ink); }
  /* level 0: the angle is shown while aiming, and next to placed points */
  .angarc{ fill:none; stroke:var(--magenta); stroke-width:3; }
  .anglabel{
    font-family:var(--math); font-weight:600; font-size:28px; fill:var(--magenta-ink);
    stroke:var(--bg); stroke-width:7; paint-order:stroke; stroke-linejoin:round;
  }
  .anglabel.small{ font-size:22px; fill:var(--accent-ink); }

  .pt{ fill:var(--accent); stroke:var(--surface); stroke-width:4; }
  .pt.ok{ fill:var(--green); }
  .pt.bad{ fill:var(--red); }
  .xmark{ stroke:var(--ink); stroke-width:3.5; stroke-linecap:round; }
  .miss{ fill:var(--brown-wash); stroke:var(--brown); stroke-width:4; stroke-dasharray:7 5; }
  .guide{ stroke:var(--brown-ink); stroke-width:2.6; stroke-dasharray:10 7; fill:none; }
  .guide.solid{ stroke-dasharray:none; }
  .guide.ring{ stroke:var(--green); stroke-width:10; opacity:.55; stroke-dasharray:none; }

  @media (prefers-reduced-motion: no-preference){
    .fadein{ animation:fadein .5s ease-out both; }
    .pop{ animation:pop .35s cubic-bezier(.3,1.6,.5,1) both; transform-box:fill-box; transform-origin:center; }
    .miss{ animation:pulse 1.4s ease-in-out .3s infinite; transform-box:fill-box; transform-origin:center; }
  }
  @keyframes fadein{ from{ opacity:0; } }
  @keyframes pop{ from{ transform:scale(.3); } }
  @keyframes pulse{ 50%{ transform:scale(1.18); } }

  .legend{
    display:flex; gap:20px; justify-content:center; align-items:center; flex-wrap:wrap;
    font-family:var(--math); font-size:16px; color:var(--muted); padding:2px 0 2px;
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ display:inline-block; width:18px; height:6px; border-radius:3px; }

  .hint{ padding:6px 16px; }
  .hint.tip{ color:var(--accent-ink); font-size:14px; line-height:1.55; }
  .hint .frac{ font-size:.8em; }
  .hint .trilink{ color:var(--accent-ink); text-decoration:underline; text-underline-offset:3px; }

  .tools{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:8px 0 0; }
  .chip{
    font-family:var(--ui); font-weight:500; font-size:14px; cursor:pointer;
    padding:7px 13px; border-radius:var(--radius); border:1px solid var(--line);
    background:var(--surface); color:var(--ink);
  }
  .chip:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .chip:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ── memory triangles ── */
  .sheet{ width:min(460px,94vw); max-height:92dvh; overflow:auto; padding:24px 22px 20px; }
  .sheet svg{ display:block; width:min(280px,80%); height:auto; margin:4px auto 0; overflow:visible; }
  .sheet .lead{ color:var(--muted); font-size:14px; line-height:1.5; margin:8px 0 4px; }
  .tri{ fill:none; stroke:var(--ink); stroke-width:3; stroke-linejoin:round; }
  .trihalf{ fill:var(--accent); fill-opacity:.14; }
  .trih{ stroke:var(--muted); stroke-width:2; stroke-dasharray:6 6; }
  .ra{ fill:none; stroke:var(--muted); stroke-width:2; }
  .tl{ font-family:var(--math); font-size:22px; fill:var(--ink); }
  .ta{ font-family:var(--math); font-size:18px; fill:var(--accent-ink); }
  .sheet .lead .frac{ font-size:.85em; }
  .vt{ border-collapse:collapse; margin:10px auto 16px; font-family:var(--math); font-size:18px; }
  .vt th{ font-family:var(--ui); font-weight:500; font-size:13px; color:var(--muted); }
  .vt th, .vt td{ padding:7px 10px; border-bottom:1px solid var(--line); text-align:center; }
  .vt .frac{ font-size:.75em; }

  /* ── feedback after checking ── */
  .fb{
    width:min(520px,100%); background:var(--surface); border-radius:var(--radius);
    border:1px solid var(--line); padding:14px 18px 16px; margin:4px 0 8px;
  }
  .fb h3{ font-family:var(--math); font-weight:600; font-size:22px; margin:0 0 4px; }
  .fb h3.ok{ color:var(--green-ink); }
  .fb h3.bad{ color:var(--red); }
  .fb p{ margin:6px 0; line-height:1.5; font-size:15px; }
  .fb .sols{ font-family:var(--math); font-size:18px; line-height:1.9; }
  .fb .row{ display:flex; justify-content:flex-end; margin-top:8px; }
  .fb .frac{ font-size:.72em; }
  .fb .score{
    display:grid; grid-template-columns:1fr auto; gap:4px 18px; max-width:320px;
    margin:10px 0 0; font-size:14px; color:var(--muted);
  }
  .fb .score:empty{ display:none; }
  .fb .score .v{ text-align:right; color:var(--ink); font-variant-numeric:tabular-nums; }
  .fb .score .tot{ border-top:1px solid var(--line); padding-top:5px; color:var(--ink); font-weight:600; }
  .fb .score .tot.v{ color:var(--brown-ink); }

  .statusrow{ width:min(560px,100%); }
  .btn.shake{ animation:mp-shake .5s ease; border-color:var(--red); }
  @media (prefers-reduced-motion: reduce){ .btn.shake{ animation:none; } }

  .subctrl{ padding-top:4px; }
</style>
</head>
<body class="game">

  <header>
    <a class="back" href="../../../../#/lukio/maa5">← Takaisin</a>
    <span class="title">Yksikköympyrä</span>
    <span class="hud"><span>Taso: <b id="level">0/7</b></span><span>Tehtävä: <b id="task">1/6</b></span><span>Pisteet: <b id="score">0</b></span></span>
  </header>

  <main>
    <div class="statusrow">
      <span class="lives" id="lives" aria-label="Elämät"></span>
      <span>Klikkaukset: <b id="clicks">0</b></span>
    </div>
    <div class="readout" id="readout" aria-live="polite"></div>

    <div class="stage-wrap">
      <svg id="stage" viewBox="-430 -430 860 860" tabindex="0"
           aria-label="Yksikköympyrä. Valitse kulmat nuolinäppäimillä ja välilyönnillä.">
        <g id="static"></g>
        <g id="guide"></g>
        <g id="aimLayer"></g>
        <g id="points"></g>
        <circle class="origin" r="6"/>
      </svg>
    </div>

    <div class="legend" id="legend">
      <span><i style="background:var(--green)"></i>cos <span class="al">α</span></span>
      <span><i style="background:var(--brown)"></i>sin <span class="al">α</span></span>
      <span id="legendTan" hidden><i style="background:var(--accent)"></i>tan <span class="al">α</span></span>
    </div>

    <div class="tools" id="tools">
      <button class="chip" id="hintBtn">💡 Vihje</button>
      <button class="chip" id="tri30">30°–60°-kolmio</button>
      <button class="chip" id="tri45">45°-kolmio</button>
    </div>

    <div class="hint" id="hint"></div>

    <div class="actions" id="actions">
      <button class="btn" id="none">Ei ratkaisuja</button>
      <button class="btn" id="all">Jokainen piste</button>
      <button class="btn" id="giveup" hidden>Näytä ratkaisu</button>
    </div>

    <div class="fb" id="fb" hidden aria-live="polite">
      <h3 id="fbTitle"></h3>
      <div id="fbText"></div>
      <div class="score" id="fbScore"></div>
      <div class="row"><button class="btn primary" id="next">Seuraava</button></div>
    </div>

    <div class="subctrl" id="subctrl">
      <button id="clear">↺ Tyhjennä pisteet</button>
    </div>
  </main>

  <div class="overlay" id="overlay">
    <div class="win" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
      <h2 id="ovTitle"></h2>
      <div class="result" id="ovResult"></div>
      <p id="ovMsg"></p>
      <div class="score" id="ovScore"></div>
      <div class="btns" id="ovBtns"></div>
    </div>
  </div>

  <div class="overlay" id="sheet">
    <div class="win sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
      <h2 id="shTitle"></h2>
      <div id="shBody"></div>
      <div class="btns"><button class="btn primary" id="shClose">Sulje</button></div>
    </div>
  </div>

<script src="../../../../assets/celebrate.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const R = 300;                 // circle radius in SVG units
const TOL = 5;                 // a point counts if it is this close (degrees) to a solution
const TOGGLE = 7;              // clicking this close to a placed point removes it
const TASKS = 6, MAX_LEVEL = 7;
const D2R = Math.PI/180;

/* scoring: one run = levels 0…MAX_LEVEL with 3 lives (same idea as Yhtälövaaka) */
const LIVES = 3;
const PTS_SOLVE = 50, PTS_CLICKS = 100, PTS_TIME = 50, HINT_COST = 30;
const TIME_BASE = 5, TIME_PER_CLICK = 2;         // reference time = 5 s + 2 s per click made
const BONUS_FINISH = 1000, BONUS_LIFE = 500;
const mult = () => Math.max(1, level);           // level 0 scores like level 1
const fmt = n => Math.round(n).toLocaleString("fi-FI");
const COURSE_URL = "../../../../#/lukio/maa5";

/* ── math typesetting ───────────────────────────────────────────────── */
const A   = `<span class="al">α</span>`;
const fr  = (n,d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const sq  = x => `√<span class="rad">${x}</span>`;
const fn  = s => `<span class="fn">${s}</span>`;
const inv = s => `<span class="fn">${s}<sup>−1</sup></span>`;
const eq  = (l,r) => `${l}<span class="eq">=</span>${r}`;
const SIN = `${fn("sin")}&thinsp;`, COS = `${fn("cos")}&thinsp;`, TAN = `${fn("tan")}&thinsp;`;
const SIN2 = `${fn("sin")}<sup>2</sup>&thinsp;`, COS2 = `${fn("cos")}<sup>2</sup>&thinsp;`;
const PM = "&thinsp;±&thinsp;";
const pi = (n,d) => d ? fr(n+"π", d) : n+"π";

/* a task: equation, solutions (degrees), what to draw when checking, how to print answers */
const P = (html, sols, guide, o={}) => ({html, sols, guide, unit:o.unit||"both", note:o.note||"", all:!!o.all, hint:o.hint||"", inv:o.inv||"", split:o.split||""});
const NONE = [];

/* levels 0–2: "split" breaks a hard angle into easy parts for the first hint;
   radians are split in radians, never converted to degrees */
const HALF = " ja π on tasan puoli kierrosta", FULL = " ja 2π on täysi kierros";
// degrees: built from what beginners know (45°, 90°, 180°, 360°), so three
// quarter turns are 3 · 90°, never 270°: 150° = 90° + 60°, 315° = 3 · 90° + 45°.
// Easy angles get no split.
function degSplit(d){
  const k = Math.floor(d/90), r = d - 90*k;
  const base = ["", "90°", "180°", "3 · 90°"][k] || "";
  if(!base) return "";
  if(r === 0) return k === 3 ? "270° = 3 · 90°" : "";
  return [30,45,60].includes(r) ? `${d}° = ${base} + ${r}°` : "";
}
const BANK = {
0: [ // angles in degrees, the angle is shown while aiming
  ...[30,90,45,120,180,270,210,135,300,60,330,225,150,240,315].map(d => P(eq(A,`${d}°`), [d], {t:"rays"}, {unit:"deg", split:degSplit(d)})),
],
1: [ // angles in degrees
  P(eq(A,"60°"), [60], {t:"rays"}, {unit:"deg"}),
  P(eq(A,"135°"), [135], {t:"rays"}, {unit:"deg", split:degSplit(135)}),
  P(eq(A,"−45°"), [315], {t:"rays"}, {unit:"deg", note:"Negatiivinen kulma kierretään myötäpäivään, joten −45° on sama piste kuin 315°."}),
  P(eq(A,"±30°"), [30,330], {t:"rays"}, {unit:"deg", note:"± tarkoittaa kahta kulmaa: 30° ja −30°. Kulma −30° on sama piste kuin 330°."}),
  P(eq(A,"90°"+PM+"45°"), [45,135], {t:"rays"}, {unit:"deg"}),
  P(eq(A,"180°"+PM+"60°"), [120,240], {t:"rays"}, {unit:"deg"}),
  P(eq(A,"390°"), [30], {t:"rays"}, {unit:"deg", split:"390° = 360° + 30°", note:"390° = 360° + 30°: täysi kierros ja vielä 30°."}),
  P(eq(A,"−270°"), [90], {t:"rays"}, {unit:"deg", split:"270° = 3 · 90°, ja miinus tarkoittaa myötäpäivään", note:"Kolme neljännestä myötäpäivään päätyy samaan pisteeseen kuin yksi neljännes vastapäivään."}),
  P(eq(A,"±150°"), [150,210], {t:"rays"}, {unit:"deg", split:degSplit(150)}),
  P(eq(A,"270°"+PM+"30°"), [240,300], {t:"rays"}, {unit:"deg", split:degSplit(270)}),
],
2: [ // angles in radians
  P(eq(A,pi("",3)), [60], {t:"rays"}, {unit:"rad", note:`${pi("",3)} on kuudesosa täydestä kierroksesta 2π.`}),
  P(eq(A,"−"+pi("",4)), [315], {t:"rays"}, {unit:"rad", note:`Kulma −${pi("",4)} kierretään myötäpäivään, joten se on sama piste kuin ${pi(7,4)}.`}),
  P(eq(A,pi(3,2)), [270], {t:"rays"}, {unit:"rad", split:`${pi(3,2)} = π + ${pi("",2)}${HALF}`}),
  P(eq(A,"2π"+PM+pi("",2)), [90,270], {t:"rays"}, {unit:"rad", note:`2π on täysi kierros, joten tämä on sama kuin ±${pi("",2)}.`}),
  P(eq(A,"π"+PM+pi("",6)), [150,210], {t:"rays"}, {unit:"rad"}),
  P(eq(A,"±"+pi(5,6)), [150,210], {t:"rays"}, {unit:"rad", split:`${pi(5,6)} = π − ${pi("",6)}${HALF}`}),
  P(eq(A,pi(7,6)), [210], {t:"rays"}, {unit:"rad", split:`${pi(7,6)} = π + ${pi("",6)}${HALF}`}),
  P(eq(A,"−"+pi(2,3)), [240], {t:"rays"}, {unit:"rad", split:`${pi(2,3)} = π − ${pi("",3)}${HALF}`}),
  P(eq(A,pi(5,4)), [225], {t:"rays"}, {unit:"rad", split:`${pi(5,4)} = π + ${pi("",4)}${HALF}`}),
  P(eq(A,pi("",2)+PM+pi("",3)), [30,150], {t:"rays"}, {unit:"rad"}),
  P(eq(A,pi(11,6)), [330], {t:"rays"}, {unit:"rad", split:`${pi(11,6)} = 2π − ${pi("",6)}${FULL}`}),
  P(eq(A,"3π"), [180], {t:"rays"}, {unit:"rad", split:`3π = 2π + π${FULL}`, note:"3π = 2π + π: täysi kierros ja vielä puolikas."}),
],
3: [ // sine and cosine values
  P(eq(SIN+A,fr(1,2)), [30,150], {t:"h", v:.5, vh:fr(1,2)}),
  P(eq(SIN+A,"−"+fr(1,2)), [210,330], {t:"h", v:-.5, vh:"−"+fr(1,2)}),
  P(eq(COS+A,fr(1,2)), [60,300], {t:"v", v:.5, vh:fr(1,2)}),
  P(eq(COS+A,"−"+fr(sq(2),2)), [135,225], {t:"v", v:-Math.SQRT1_2, vh:"−"+fr(sq(2),2)}),
  P(eq(SIN+A,fr(sq(3),2)), [60,120], {t:"h", v:Math.sqrt(3)/2, vh:fr(sq(3),2)}),
  P(eq(COS+A,"−"+fr(sq(3),2)), [150,210], {t:"v", v:-Math.sqrt(3)/2, vh:"−"+fr(sq(3),2)}),
  P(eq(SIN+A,"±1"), [90,270], {t:"hh", v:1}, {hint:`Etsi pisteet, joiden y-koordinaatti on 1 tai −1.`, note:`Pisteet, joiden y-koordinaatti on 1 tai −1, ovat ympyrän ylin ja alin piste.`}),
  P(eq(COS+A,"0"), [90,270], {t:"v", v:0, vh:"0"}),
  P(eq(SIN+A,"0"), [0,180], {t:"h", v:0, vh:"0"}),
  P(eq(COS+A,"−1"), [180], {t:"v", v:-1, vh:"−1"}, {note:"Pystysuora suora x = −1 vain sivuaa ympyrää, joten ratkaisuja on yksi."}),
  P(eq(SIN+A,"2"), NONE, {t:"none"}, {hint:"Mitä arvoja pisteen y-koordinaatti voi saada yksikköympyrällä?", note:`${SIN}${A} on pisteen y-koordinaatti, joten se on aina välillä −1 … 1.`}),
  P(eq(COS+A,"−"+fr(3,2)), NONE, {t:"v", v:-1.5}, {note:`${COS}${A} on pisteen x-koordinaatti, joten se on aina välillä −1 … 1. Suora x = −${fr(3,2)} ei osu ympyrään.`}),
  P(eq(SIN+A,"−"+fr(sq(2),2)), [225,315], {t:"h", v:-Math.SQRT1_2, vh:"−"+fr(sq(2),2)}),
],
4: [ // tangent, relations, squares
  P(eq(SIN+A,COS+A), [45,225], {t:"tan", v:1, vh:"1"}, {hint:"Etsi pisteet, joiden x- ja y-koordinaatti ovat yhtä suuret.", note:"Pisteet, joiden x- ja y-koordinaatti ovat samat, ovat suoralla y = x."}),
  P(eq(SIN+A,"−"+COS+A), [135,315], {t:"tan", v:-1, vh:"−1"}, {hint:"Etsi pisteet, joiden x- ja y-koordinaatti ovat toistensa vastalukuja.", note:"Pisteet, joiden koordinaatit ovat toistensa vastalukuja, ovat suoralla y = −x."}),
  P(eq(TAN+A,"1"), [45,225], {t:"tan", v:1, vh:"1"}),
  P(eq(TAN+A,"−"+sq(3)), [120,300], {t:"tan", v:-Math.sqrt(3), vh:"−"+sq(3)}),

const LEVEL_INTRO = {
  0:"Kulma α mitataan positiiviselta x-akselilta vastapäivään. Liikuta sädettä: näet kulman suuruuden. Merkitse ympyrälle kohta, jossa yhtälö on totta.",
  1:"Nyt kulmaa ei enää näytetä. Merkitse ympyrälle kaikki kohdat, joissa yhtälö on totta.",

  3:"cos α on pisteen x-koordinaatti ja sin α sen y-koordinaatti. Jos ratkaisuja ei ole, paina Ei ratkaisuja.",
  4:"tan α on säteen kulmakerroin. Pystysuoralla apuviivalla x = 1 se näkyy korkeutena.",
  5:"sin⁻¹, cos⁻¹ ja tan⁻¹ antavat aina vain yhden kulman. Ruudukon väli on ½.",

  7:"Sekoitus kaikesta. Onnea matkaan!",

/* ── helpers ────────────────────────────────────────────────────────── */
const norm = d => ((d % 360) + 360) % 360;
const angDist = (a,b) => { const x = Math.abs(norm(a) - norm(b)); return Math.min(x, 360 - x); };
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const gcd = (a,b) => b ? gcd(b, a % b) : a;
const pt = d => ({x: R*Math.cos(d*D2R), y: -R*Math.sin(d*D2R)});
const f1 = v => v.toFixed(1);

function degText(d){
  d = norm(d);
  const r = Math.round(d*10)/10;
  if(Math.abs(d - Math.round(d)) < 1e-6) return `${Math.round(d)}°`;
  if(Math.abs(d*2 - Math.round(d*2)) < 1e-6) return `${String(d).replace(".",",")}°`;
  return `≈&nbsp;${String(r).replace(".",",")}°`;
}
function radText(d){
  d = norm(d);
  if(Math.abs(d/15 - Math.round(d/15)) > 1e-6) return null;
  const k = Math.round(d/15); if(k === 0) return "0";
  const g = gcd(k,12), n = k/g, m = 12/g, num = n === 1 ? "π" : `${n}π`;
  return m === 1 ? num : fr(num, m);
}
function angleText(d, unit){
  const r = radText(d);
  if(unit === "deg" || !r) return degText(d);
  if(unit === "rad") return r;
  return r === "0" ? "0°" : `${degText(d)} eli ${r}`;
}

/* ── state ──────────────────────────────────────────────────────────── */
let level = 0, tasks = [], idx = 0, placed = [], aim = null, answered = false;
let score = 0, levelScore = 0, lives = LIVES;
let levelDone = false;          // last task solved: the level dialog is on its way
let clicks = 0, hintsUsed = 0, taskStart = 0, lastWin = null, gameOver = false;
const task = () => tasks[idx];
const showAngle = () => level === 0;
const tanOn = () => level >= 4;
const specialOn = () => level >= 3;

/* ── static drawing ─────────────────────────────────────────────────── */
function drawStatic(){
  let h = "";
  for(const g of [-300,-150,150,300]){
    h += `<line class="grid" x1="${g}" y1="-400" x2="${g}" y2="400"/><line class="grid" x1="-400" y1="${g}" x2="400" y2="${g}"/>`;
  }
  h += `<line class="axis" x1="-410" y1="0" x2="402" y2="0"/><line class="axis" x1="0" y1="410" x2="0" y2="-402"/>`;
  h += `<path class="arrow" d="M418,0 L398,-9 L398,9 Z"/><path class="arrow" d="M0,-418 L-9,-398 L9,-398 Z"/>`;
  h += `<text class="axlabel" x="402" y="-16" text-anchor="end">x</text><text class="axlabel" x="16" y="-398">y</text>`;
  h += `<text class="axlabel" x="${R+8}" y="26">1</text><text class="axlabel" x="${-R-8}" y="26" text-anchor="end">−1</text>`;
  h += `<text class="axlabel" x="10" y="${-R-10}">1</text><text class="axlabel" x="10" y="${R+26}">−1</text>`;
  if(tanOn()) h += `<line class="tanline" x1="${R}" y1="-410" x2="${R}" y2="410"/>`;
  h += `<circle class="circle" r="${R}"/>`;
  for(let d=0; d<360; d+=15){
    const len = d % 90 === 0 ? 16 : d % 45 === 0 || d % 30 === 0 ? 11 : 7;
    const c = Math.cos(d*D2R), s = -Math.sin(d*D2R);
    h += `<line class="tick" x1="${f1((R-len)*c)}" y1="${f1((R-len)*s)}" x2="${f1(R*c)}" y2="${f1(R*s)}"/>`;
  }
  $("static").innerHTML = h;
  $("legendTan").hidden = !tanOn();
}

/* ── aim ray, projections ───────────────────────────────────────────── */
function drawAim(){
  const layer = $("aimLayer");
  if(aim === null || answered){ layer.innerHTML = ""; return; }
  const c = Math.cos(aim*D2R), s = Math.sin(aim*D2R), px = R*c, py = -R*s;
  let h = "";
  h += `<line class="proj" x1="${f1(px)}" y1="${f1(py)}" x2="${f1(px)}" y2="0"/>`;
  h += `<line class="proj" x1="${f1(px)}" y1="${f1(py)}" x2="0" y2="${f1(py)}"/>`;
  h += `<line class="cosseg" x1="0" y1="0" x2="${f1(px)}" y2="0"/>`;
  h += `<line class="sinseg" x1="0" y1="0" x2="0" y2="${f1(py)}"/>`;
  if(tanOn() && Math.abs(c) > 1e-3){
    const t = s / c;
    if(Math.abs(t) <= 1.4){
      h += `<line class="tanext" x1="0" y1="0" x2="${R}" y2="${f1(-R*t)}"/>`;
      h += `<line class="tanseg" x1="${R}" y1="0" x2="${R}" y2="${f1(-R*t)}"/>`;
    }
  }
  if(showAngle() && aim > 0.5){
    const r = ARC_R, q = {x: r*c, y: -r*s};
    h += `<path class="angarc" d="M${r},0 A${r},${r} 0 ${aim > 180 ? 1 : 0} 0 ${f1(q.x)},${f1(q.y)}"/>`;
  }
  h += `<line class="ray" x1="0" y1="0" x2="${f1(px*1.2)}" y2="${f1(py*1.2)}"/>`;
  h += `<circle class="ghost" cx="${f1(px)}" cy="${f1(py)}" r="12"/>`;
  if(showAngle() && aim > 0.5) h += angleLabel(aim, ARC_R + 46, "", aim/2);   // beside the arc, halfway along it
  layer.innerHTML = h;
}

const ARC_R = 70;                 // radius of the angle arc (level 0)
/* the angle d in whole degrees, drawn at distance r in direction "at" */
function angleLabel(d, r, cls, at = d){
  const c = Math.cos(at*D2R), s = Math.sin(at*D2R);
  return `<text class="anglabel ${cls}" x="${f1(r*c)}" y="${f1(-r*s)}" text-anchor="middle" dominant-baseline="central">${Math.round(norm(d)) % 360}°</text>`;
}
function drawPoints(result){
  let h = "";
  placed.forEach((d, i) => {
    const p = pt(d);
    const cls = !result ? "" : result.bad.includes(d) ? " bad pop" : " ok pop";
    const delay = result ? ` style="animation-delay:${i*90}ms"` : "";      // a solved task lights up point by point
    h += `<circle class="pt${cls}"${delay} cx="${f1(p.x)}" cy="${f1(p.y)}" r="14"/>`;
    if(result && result.bad.includes(d))
      h += `<path class="xmark" d="M${f1(p.x-5)},${f1(p.y-5)} L${f1(p.x+5)},${f1(p.y+5)} M${f1(p.x+5)},${f1(p.y-5)} L${f1(p.x-5)},${f1(p.y+5)}"/>`;
    if(showAngle() && !result) h += angleLabel(d, R - 46, "small");
  });
  if(result) for(const d of result.missed){
    const p = pt(d);
    h += `<circle class="miss" cx="${f1(p.x)}" cy="${f1(p.y)}" r="17"/>`;
  }
  $("points").innerHTML = h;
}

/* ── guide geometry shown after checking ────────────────────────────── */
function drawGuide(p){
  const g = p.guide; let h = "";
  const hl = v => `<line class="guide" x1="-410" y1="${f1(-R*v)}" x2="410" y2="${f1(-R*v)}"/>`;
  const vl = v => `<line class="guide" x1="${f1(R*v)}" y1="-410" x2="${f1(R*v)}" y2="410"/>`;
  if(g.t === "h") h += hl(g.v);
  if(g.t === "v") h += vl(g.v);
  if(g.t === "hh") h += hl(g.v) + hl(-g.v);
  if(g.t === "vv") h += vl(g.v) + vl(-g.v);
  if(g.t === "axes") h += `<line class="guide solid" x1="-410" y1="0" x2="410" y2="0"/><line class="guide solid" x1="0" y1="-410" x2="0" y2="410"/>`;
  if(g.t === "all") h += `<circle class="guide ring" r="${R}"/>`;
  if(g.t === "tan" || g.t === "tanray"){
    const k = 420 / Math.max(1, Math.abs(g.v));
    const x0 = g.t === "tan" ? -k : 0;
    h += `<line class="guide" x1="${f1(x0)}" y1="${f1(g.v*x0*-1)}" x2="${f1(k)}" y2="${f1(-g.v*k)}"/>`;
    if(Math.abs(g.v) <= 1.4) h += `<line class="tanseg" x1="${R}" y1="0" x2="${R}" y2="${f1(-R*g.v)}"/>`;
  }
  if(g.t === "rays") for(const d of p.sols){
    const q = pt(d);
    h += `<line class="guide" x1="0" y1="0" x2="${f1(q.x)}" y2="${f1(q.y)}"/>`;
  }
  $("guide").innerHTML = `<g class="fadein">${h}</g>`;
}

/* ── task flow ──────────────────────────────────────────────────────── */
function newRun(){ level = 0; score = 0; lives = LIVES; gameOver = false; startLevel(); }
function startLevel(){
  const pool = level <= 6 ? BANK[level] : [3,4,5,6].flatMap(k => BANK[k]);
  tasks = shuffle(pool).slice(0, TASKS);
  idx = 0; levelScore = 0;
  $("overlay").classList.remove("show");
  drawStatic();
  showTask();
}
function showTask(){
  levelDone = false;
  placed = []; answered = false; aim = null;
  clicks = 0; hintsUsed = 0; hintStep = 0; lastWin = null; taskStart = performance.now();
  clearTimeout(hintTimer); clearTimeout(almostTimer);
  $("readout").innerHTML = task().html;
  $("guide").innerHTML = "";
  drawPoints(); drawAim();
  $("fb").hidden = true;
  $("actions").hidden = !specialOn(); $("subctrl").hidden = false; $("hint").hidden = false;
  $("none").hidden = $("all").hidden = !specialOn();
  $("giveup").hidden = true;
  $("tri30").hidden = $("tri45").hidden = !specialOn();
  $("hintBtn").hidden = false;
  setHint(LEVEL_INTRO[Math.min(level,7)]);
  updateHud();
}

/* life icons: a small unit circle with its radius; a lost one turns red and fades */
const LIFE_ICON = `<circle class="life-cup" cx="20" cy="11" r="9"/><line class="life-rim" x1="20" y1="11" x2="26.4" y2="4.6"/>`;
function updateHud(justLost){
  $("level").textContent = `${level}/${MAX_LEVEL}`;
  $("task").textContent = `${idx+1}/${TASKS}`;
  $("score").textContent = fmt(score);
  $("clicks").textContent = clicks;
  $("lives").innerHTML = Array.from({length:LIVES}, (_,i) =>
    `<svg viewBox="0 0 40 22" class="${i < lives ? "" : "lost"}${justLost && i === lives ? " just-lost" : ""}">${LIFE_ICON}</svg>`).join("");
  $("lives").setAttribute("aria-label", `Elämät: ${lives}/${LIVES}`);
}
let hintTimer = null, almostTimer = null;
function setHint(msg, warn=false){
  const el = $("hint"); el.textContent = msg; el.classList.toggle("warn", warn); el.classList.remove("tip");
}
function flashHint(msg){
  setHint(msg, true); clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { if(!answered) setHint(LEVEL_INTRO[Math.min(level,7)]); }, 2400);
}
function tipHint(html){
  clearTimeout(hintTimer);
  const el = $("hint"); el.innerHTML = html; el.classList.remove("warn"); el.classList.add("tip");
}

/* ── hints ───────────────────────────────────────────────────────────
   One step per press: memory triangle (only where it helps), method,
   the placed points, and finally the helper line. If the player already
   has part of the answer and nothing wrong, the hint goes straight to
   the placed points. After the last step "Näytä ratkaisu" appears. */
let hintStep = 0;
const near = (a,b) => angDist(a,b) < 1e-6;

/* which memory triangle helps: 30 (√3, ½), 45 (√2/2), or 0. Only where
   the solutions are special angles that the triangle shows directly. */
function triKind(p){
  if(!specialOn() || p.all || !p.sols || !p.sols.length) return 0;
  if(!["h","v","hh","vv","tan","tanray"].includes(p.guide.t)) return 0;
  const off = p.sols.filter(d => !near(d % 90, 0));            // angles not on an axis
  if(!off.length) return 0;
  if(off.every(d => near(d % 30, 0))) return 30;
  if(off.every(d => near(d % 45, 0))) return 45;
  return 0;
}
function hintSteps(p){
  const steps = [];
  if(triKind(p)) steps.push("tri");
  if(methodHint(p)) steps.push("method");
  steps.push("state");
  if(["h","v","hh","vv","tan","tanray","axes"].includes(p.guide.t)) steps.push("guide");
  return steps;
}
function triHint(p){
  const k = triKind(p);
  const name = k === 30 ? "tasasivuista muistikolmiota" : "tasakylkistä muistikolmiota";
  return `Tutki <a href="#" class="trilink" data-tri="${k}">${name}</a>!`;
}
function methodHint(p){
  const g = p.guide;
  const pm = g.t === "rays" && p.html.includes("±") ? " Merkki ± tarkoittaa kahta kulmaa." : "";
  if(p.hint) return p.hint + pm;
  if(p.split) return `Huomaa, että ${p.split}.` + pm;
  const range = p.inv === "sin" ? `${inv("sin")} antaa vain yhden kulman, väliltä −90° … 90°. `
              : p.inv === "cos" ? `${inv("cos")} antaa vain yhden kulman, väliltä 0° … 180°. ` : "";
  if(g.t === "h") return range + `${SIN}${A} on pisteen y-koordinaatti. Etsi ympyrältä pisteet, joiden y-koordinaatti on ${g.vh}.`;
  if(g.t === "v") return range + `${COS}${A} on pisteen x-koordinaatti. Etsi ympyrältä pisteet, joiden x-koordinaatti on ${g.vh}.`;
  if(g.t === "tan" || g.t === "tanray"){
    const pre = g.t === "tanray" ? `${inv("tan")} antaa vain yhden kulman, väliltä −90° … 90°, eli ympyrän oikealta puoliskolta. `
                                 : `${TAN}${A} on säteen kulmakerroin. `;
    return pre + (Math.abs(g.v) <= 1.4
      ? `Etsi säde, joka osuu pystysuoraan apuviivaan x = 1 korkeudella ${g.vh}.`
      : `Säde nousee ${g.vh} yksikköä, kun x kasvaa yhdellä. Käytä ruudukkoa tai muistikolmiota.`);
  }
  if(g.t === "rays"){
    if(level === 0) return "";        // the level intro already says how to read the angle
    if(p.unit === "rad") return `π on puoli kierrosta ja 2π täysi kierros. Esimerkiksi ${pi("",2)} on neljännes kierrosta ja ${pi("",6)} kolmasosa siitä.` + pm;
    return "Aloita positiiviselta x-akselilta. Positiivinen kulma kierretään vastapäivään, negatiivinen myötäpäivään. Neljännes kierrosta on 90°." + pm;
  }
  return "Mieti, missä kohdissa ympyrää yhtälö on totta.";
}

/* where solution b lies seen from solution a */
function relation(a, b, preferOpposite){
  const s = norm(a + b), d = norm(b - a);
  const opp = near(d, 180) ? "opp" : null;
  if(preferOpposite && opp) return opp;
  if(near(s, 0)) return "x";
  if(near(s, 180)) return "y";
  if(near(s, 90)) return "yx";
  if(near(s, 270)) return "y-x";
  return opp;
}
const REL_TEXT = {
  x:"peilikuva x-akselin suhteen", y:"peilikuva y-akselin suhteen",
  yx:"peilikuva suoran y = x suhteen", "y-x":"peilikuva suoran y = −x suhteen",
};
/* the reason sentence, only when it is what makes the two angles alike */
function reason(p, rel){
  const g = p.guide, rad = p.unit === "rad", h = rad ? "π" : "180°";
  if((g.t === "h" || g.t === "hh") && rel === "y") return ` Sini on sama kulmilla ${A} ja ${h} − ${A}.`;
  if((g.t === "v" || g.t === "vv") && rel === "x") return ` Kosini on sama kulmilla ${A} ja −${A}.`;
  if(g.t === "tan" && rel === "opp") return ` Tangentti on sama kulmilla ${A} ja ${A} + ${h}.`;
  return "";
}
function symHint(p){
  const n = p.sols.length;
  if(p.inv || p.guide.t === "tanray") return "";
  if(n === 2){
    const rel = relation(p.sols[0], p.sols[1], p.guide.t === "tan");
    if(!rel) return "";
    const where = rel === "opp" ? `origon toisella puolella, ${p.unit === "rad" ? "π" : "180°"} päässä siitä` : `sen ${REL_TEXT[rel]}`;
    return reason(p, rel) + ` Kun löydät yhden ratkaisun, toinen on ${where}.`;
  }
  if(p.guide.t === "rays" && n >= 3){
    const s = p.sols.map(norm).sort((a,b) => a-b), gap = 360/n;
    if(s.every((d,i) => Math.abs(norm(s[(i+1)%n] - d) - gap) < 1e-6)) return ` Ratkaisut ovat ympyrällä tasaisin välein.`;
    return ` Ratkaisut sijoittuvat ympyrälle symmetrisesti.`;
  }
  return "";
}
const isOk = (p, d) => p.sols.some(s => angDist(s,d) <= TOL);
const badPoints = p => placed.filter(d => !isOk(p, d));
const missingSols = p => p.sols.filter(s => !placed.some(d => angDist(s,d) <= TOL));
/* the player has part of the answer and nothing wrong */
const onTrack = p => !p.all && p.sols.length > 0 && placed.length > 0 && !badPoints(p).length && missingSols(p).length > 0;

function stateHint(p){
  if(p.all) return "Kokeile muutamaa kulmaa, vaikkapa 0°, 90° ja 30°. Onko yhtälö totta niillä kaikilla?";
  if(p.sols.length === 0) return "Voiko yhtälö olla totta millään kulmalla? Mieti, mitä arvoja vasen puoli voi saada.";
  const bad = badPoints(p), missing = missingSols(p), n = p.sols.length;
  if(bad.length) return bad.length === 1 ? "Yksi merkitsemistäsi pisteistä ei ole ratkaisu." : `${bad.length} merkitsemääsi pistettä ei ole ratkaisuja.`;
  if(placed.length === 0) return (n === 1 ? "Ratkaisuja on vain yksi." : `Ratkaisuja on ${n}.`) + symHint(p);
  if(n === 2 && missing.length === 1 && !p.inv && p.guide.t !== "tanray"){
    const found = p.sols.find(s => !missing.includes(s));
    const rel = relation(found, missing[0], p.guide.t === "tan");
    if(rel){
      const where = rel === "opp"
        ? `se on origon toisella puolella, ${p.unit === "rad" ? "π" : "180°"} päässä löytämästäsi pisteestä`
        : `se on löytämäsi pisteen ${REL_TEXT[rel]}`;
      return `Olet jo löytänyt yhden oikean ratkaisun. Toinen ratkaisu löytyy symmetrisesti: ${where}.` + reason(p, rel);
    }
  }
  return (missing.length === 1 ? "Hyvä alku! Yksi ratkaisu puuttuu vielä." : `Hyvä alku! Ratkaisuja puuttuu vielä ${missing.length}.`) + symHint(p);
}
/* the very first hint, when there are several solutions and at least one
   placed point is right: say what is right before anything else */
function progressHint(p){
  if(p.all || p.sols.length < 2) return "";
  const good = placed.filter(d => isOk(p, d)).length, bad = placed.length - good;
  if(!good) return "";
  if(!bad) return "Merkitsemäsi pisteet ovat oikein, mutta ratkaisuja on vielä lisää.";
  return good === 1 ? "Yksi merkitsemistäsi pisteistä on oikein."
                    : "Osa merkitsemistäsi pisteistä on oikein, mutta osa on väärin.";
}
function giveHint(){
  if(answered) return;
  const p = task(), steps = hintSteps(p);
  // this one does not use up a step: the next press continues as usual
  const first = hintsUsed === 0 ? progressHint(p) : "";
  hintsUsed++;
  if(first){ tipHint(first); return; }
  // progress first: with part of the answer found, skip ahead to the placed points
  if(onTrack(p)) hintStep = Math.max(hintStep, steps.indexOf("state"));
  const step = steps[Math.min(hintStep, steps.length - 1)];
  hintStep++;
  let msg;
  if(step === "tri") msg = triHint(p);
  else if(step === "method") msg = methodHint(p);
  else msg = stateHint(p);
  if(step === "guide"){ drawGuide(p); msg += " Apuviiva on nyt piirretty ympyrään."; }
  if(hintStep >= steps.length){ $("giveup").hidden = false; $("actions").hidden = false; }
  tipHint(msg);
}

/* ── memory triangles ── */
function showTriangle(kind){
  let svg, table, lead;
  if(kind === 30){
    $("shTitle").textContent = "Tasasivuinen muistikolmio";
    svg = `<svg viewBox="0 0 260 245">
      <path class="trihalf" d="M130,215 L240,215 L130,24.5 Z"/>
      <path class="tri" d="M20,215 L240,215 L130,24.5 Z"/>
      <line class="trih" x1="130" y1="24.5" x2="130" y2="215"/>
      <path class="ra" d="M130,201 L144,201 L144,215"/>
      <text class="tl" x="62" y="115" text-anchor="end">2</text>
      <text class="tl" x="198" y="115">2</text>
      <text class="tl" x="75" y="240" text-anchor="middle">1</text>
      <text class="tl" x="185" y="240" text-anchor="middle">1</text>
      <text class="tl" x="122" y="140" text-anchor="end">√3</text>
      <text class="ta" x="206" y="206" text-anchor="end">60°</text>
      <text class="ta" x="136" y="80">30°</text>
    </svg>`;
    lead = `Tasasivuinen kolmio puolitettuna. Yksikköympyrässä hypotenuusa on 1, joten kaikki sivut jaetaan kahdella: kateetit ovat ${fr(1,2)} ja ${fr(sq(3),2)}.`;
    table = `<tr><th>kulma</th><th>sin</th><th>cos</th><th>tan</th></tr>
      <tr><td>30° = ${pi("",6)}</td><td>${fr(1,2)}</td><td>${fr(sq(3),2)}</td><td>${fr(1,sq(3))} = ${fr(sq(3),3)}</td></tr>
      <tr><td>60° = ${pi("",3)}</td><td>${fr(sq(3),2)}</td><td>${fr(1,2)}</td><td>${sq(3)}</td></tr>`;
  } else {
    $("shTitle").textContent = "Tasakylkinen muistikolmio";
    svg = `<svg viewBox="0 0 250 235">
      <path class="trihalf" d="M40,200 L210,200 L40,30 Z"/>
      <path class="tri" d="M40,200 L210,200 L40,30 Z"/>
      <path class="ra" d="M40,186 L54,186 L54,200"/>
      <text class="tl" x="125" y="228" text-anchor="middle">1</text>
      <text class="tl" x="24" y="122" text-anchor="end">1</text>
      <text class="tl" x="136" y="106">√2</text>
      <text class="ta" x="172" y="192" text-anchor="end">45°</text>
      <text class="ta" x="48" y="82">45°</text>
    </svg>`;
    lead = `Tasakylkinen suorakulmainen kolmio. Yksikköympyrässä hypotenuusa on 1, joten sivut jaetaan luvulla ${sq(2)}: kateetit ovat ${fr(1,sq(2))} = ${fr(sq(2),2)}.`;
    table = `<tr><th>kulma</th><th>sin</th><th>cos</th><th>tan</th></tr>
      <tr><td>45° = ${pi("",4)}</td><td>${fr(sq(2),2)}</td><td>${fr(sq(2),2)}</td><td>1</td></tr>`;
  }
  $("shBody").innerHTML = svg + `<p class="lead">${lead}</p><table class="vt">${table}</table>`;
  $("sheet").classList.add("show"); $("shClose").focus();
}
function closeSheet(){ $("sheet").classList.remove("show"); }

function toggle(d){
  if(answered) return;
  d = norm(Math.round(d*2)/2);
  const i = placed.findIndex(q => angDist(q,d) < TOGGLE);
  if(i >= 0) placed.splice(i,1); else placed.push(d);
  clicks++; updateHud();
  drawPoints();
  checkPoints();
}

/* the task is solved the moment every solution is marked and nothing is wrong */
function checkPoints(){
  clearTimeout(almostTimer);
  const p = task();
  if(p.all || !p.sols.length) return;
  const bad = badPoints(p), missed = missingSols(p);
  if(!bad.length && !missed.length){ win(); return; }
  // all solutions are there, but so is something extra: say so after a moment
  if(!missed.length) almostTimer = setTimeout(() => {
    if(answered) return;
    tipHint(bad.length === 1 ? "Kaikki ratkaisut ovat mukana, mutta yksi piste on ylimääräinen."
                             : `Kaikki ratkaisut ovat mukana, mutta ${bad.length} pistettä on ylimääräisiä.`);
  }, 1000);
}

/* "Ei ratkaisuja" / "Jokainen piste": right wins; wrong counts as one hint
   (costs a hint and uses up one hint step), the task goes on */
function answer(mode){
  if(answered) return;
  const p = task();
  const ok = mode === "all" ? p.all : (!p.all && p.sols.length === 0);
  if(ok){ clicks++; placed = []; win(); return; }
  hintsUsed++; hintStep++;                        // only the hint counts, not the click
  if(hintStep >= hintSteps(p).length){ $("giveup").hidden = false; $("actions").hidden = false; }
  const b = $(mode); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
  clearTimeout(hintTimer);
  setHint((mode === "all" ? "Yhtälö ei ole totta jokaisella kulmalla." : "Ratkaisuja on olemassa.")
    + " Tämä lasketaan yhdeksi vihjeeksi.", true);
}

function win(){
  answered = true; clearTimeout(almostTimer);
  const p = task();
  const par = p.all || !p.sols.length ? 1 : p.sols.length;   // fewest possible clicks
  const c = Math.max(1, clicks), t = Math.max(0.5, (performance.now() - taskStart)/1000);
  const ref = TIME_BASE + TIME_PER_CLICK*c;
  const pc = Math.round(PTS_CLICKS*par/c), pt = Math.round(PTS_TIME*ref/t);   // time points have no cap
  const ph = HINT_COST*hintsUsed;
  const total = Math.max(0, PTS_SOLVE + pc + pt - ph) * mult();
  lastWin = {par, clicks:c, t, pc, pt, ph, total};
  score += total; levelScore += total;
  aim = null; drawAim(); drawGuide(p); drawPoints({bad:[], missed:[]});
  updateHud();
  showFeedback(p, "win");
  // the last task of a level: fireworks first, then the level dialog by itself
  if(idx === TASKS-1){
    levelDone = true; $("next").hidden = true;
    if(motion) burst();
    setTimeout(() => showOverlay(level < MAX_LEVEL ? "level" : "complete"), motion ? 1500 : 300);
  }
}

/* "Näytä ratkaisu" (or the last life lost): show the answer, no points */
function giveUp(){
  if(answered) return;
  lives--; updateHud(true);
  if(lives <= 0) gameOver = true;
  reveal(task(), gameOver ? "Game Over" : "Ratkaisu");
}
function reveal(p, head){
  answered = true; clearTimeout(almostTimer);
  const bad = p.all ? [] : badPoints(p), missed = p.all ? [] : missingSols(p);
  aim = null; drawAim(); drawGuide(p); drawPoints({bad, missed});
  showFeedback(p, "reveal", head);
}

function showFeedback(p, kind, head){
  const title = $("fbTitle");
  title.textContent = kind === "win" ? "Oikein! 🎉" : head;
  title.className = kind === "win" ? "ok" : "bad";

  let text = "";
  const g = p.guide;
  if(p.note) text += `<p>${p.note}</p>`;
  else if(g.t === "h") text += `<p>${SIN}${A} on pisteen y-koordinaatti. Vaakasuora suora y = ${g.vh} osoittaa oikeat kohdat.</p>`;
  else if(g.t === "v") text += `<p>${COS}${A} on pisteen x-koordinaatti. Pystysuora suora x = ${g.vh} osoittaa oikeat kohdat.</p>`;
  else if(g.t === "tan") text += `<p>${TAN}${A} on säteen kulmakerroin. Suora origosta pisteeseen (1, ${g.vh}) leikkaa ympyrän kahdesti.</p>`;
  if(p.all) text += `<p class="sols">Kaikki kulmat ovat ratkaisuja.</p>`;
  else if(p.sols.length === 0) text += `<p class="sols">Ei ratkaisuja.</p>`;
  else {
    const list = p.sols.slice().sort((a,b) => norm(a)-norm(b)).map(d => angleText(d, p.unit));
    text += `<p class="sols">${list.length === 1 ? "Ratkaisu" : "Ratkaisut"}: ${list.join(", ")}</p>`;
  }
  $("fbText").innerHTML = text;

  const row = (label, val, cls="") => `<span class="${cls}">${label}</span><span class="v ${cls}">${val}</span>`;
  const sec = t => t.toFixed(1).replace(".", ",") + " s";
  if(kind === "win"){
    const w = lastWin;
    $("fbScore").innerHTML =
      row("Ratkaisu", "+" + PTS_SOLVE) +
      row(w.clicks <= w.par ? `Klikkaukset ${w.clicks} (paras mahdollinen!)` : `Klikkaukset ${w.clicks} (minimi: ${w.par})`, "+" + w.pc) +
      row(`Aika ${sec(w.t)}`, "+" + w.pt) +
      (w.ph ? row(`Vihjeet ${hintsUsed} × ${HINT_COST}`, "−" + w.ph) : "") +
      (mult() > 1 ? row(`Taso ${level}`, "×" + mult()) : "") +
      row("Yhteensä", "+" + fmt(w.total), "tot");
  } else {
    $("fbScore").innerHTML = row("Tästä tehtävästä", "0 pistettä") + row("Elämiä jäljellä", `${lives}/${LIVES}`, "tot");
  }

  $("next").textContent = gameOver || idx === TASKS-1 ? "Katso tulos" : "Seuraava";
  $("next").hidden = false;
  $("fb").hidden = false;
  $("actions").hidden = true; $("subctrl").hidden = true;
  $("hint").hidden = true; $("hintBtn").hidden = true;
  $("tri30").hidden = $("tri45").hidden = true;
  $("next").focus({preventScroll:true});
  $("fb").scrollIntoView({block:"nearest", behavior:"smooth"});
}

function next(){
  if(!answered || levelDone) return;          // a finished level opens its dialog by itself
  if(gameOver){ showOverlay("gameover"); return; }
  if(idx < TASKS-1){ idx++; showTask(); return; }
  showOverlay(level < MAX_LEVEL ? "level" : "complete");
}

function showOverlay(kind){
  const btns = $("ovBtns"); btns.innerHTML = "";
  const btn = (label, fn, primary) => { const b = document.createElement("button");
    b.className = "btn" + (primary ? " primary" : ""); b.textContent = label; b.addEventListener("click", fn); btns.appendChild(b); return b; };
  const row = (label, val, cls="") => `<span class="${cls}">${label}</span><span class="v ${cls}">${val}</span>`;
  $("ovScore").innerHTML = "";
  let first;
  if(kind === "level"){
    $("ovTitle").textContent = `Taso ${level} läpäisty! 🎉`;
    $("ovResult").innerHTML = `<div class="bigscore">+${fmt(levelScore)}</div>`;
    $("ovMsg").textContent = level < 6 ? "Seuraavalla tasolla on uudenlaisia yhtälöitä."
                           : "Seuraavalla tasolla on sekoitus kaikista tasoista.";
    $("ovScore").innerHTML = row("Pisteet tältä tasolta", fmt(levelScore)) +
      row("Elämiä jäljellä", `${lives}/${LIVES}`) + row("Pisteet yhteensä", fmt(score), "tot");
    first = btn("Seuraava taso", () => { level++; startLevel(); }, true);
  } else if(kind === "complete"){
    const fromLevels = score, lifeBonus = BONUS_LIFE*lives;
    score += BONUS_FINISH + lifeBonus; updateHud();
    $("ovTitle").textContent = "Peli läpäisty! 🏆";
    $("ovResult").innerHTML = `<div class="bigscore">${fmt(score)} pistettä</div>`;
    $("ovMsg").textContent = `Olet päässyt kaikki tasot läpi, 0–${MAX_LEVEL}.`;
    $("ovScore").innerHTML = row("Pisteet tasoista", fmt(fromLevels)) +
      row("Läpäisybonus", "+" + fmt(BONUS_FINISH)) +
      row(`Elämät ${lives} × ${BONUS_LIFE}`, "+" + fmt(lifeBonus)) +
      row("Yhteensä", fmt(score), "tot");
    first = btn("Aloita alusta", newRun, true);
  } else {
    $("ovTitle").textContent = "Game Over";
    $("ovResult").innerHTML = `<div class="bigscore">${fmt(score)} pistettä</div>`;
    $("ovMsg").textContent = `Kolmas elämä meni. Pääsit tasolle ${level}/${MAX_LEVEL}.`;
    first = btn("Aloita alusta", newRun, true);
  }
  const a = document.createElement("a"); a.href = COURSE_URL; a.className = "btn"; a.textContent = "Palaa kurssiin"; btns.appendChild(a);
  $("overlay").classList.add("show"); first.focus();
}

/* ── celebration: streamers and confetti (assets/celebrate.js) bursting from the circle ── */
const motion = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(){
  const box = $("stage").getBoundingClientRect();
  celebrate({x: box.left + box.width/2, y: box.top + box.height/2});
}

/* ── input ──────────────────────────────────────────────────────────── */
const stage = $("stage");
function toSvg(e){
  const m = stage.getScreenCTM(); if(!m) return null;
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
  return p;
}
function angleAt(e){
  const p = toSvg(e); if(!p) return null;
  if(Math.hypot(p.x, p.y) < R*0.18) return null;          // too close to the centre to aim
  return norm(Math.atan2(-p.y, p.x) / D2R);
}
let down = false;
stage.addEventListener("pointerdown", e => {
  if(answered) return;
  down = true; stage.setPointerCapture(e.pointerId);
  const a = angleAt(e); if(a !== null){ aim = a; drawAim(); }
  e.preventDefault();
});
stage.addEventListener("pointermove", e => {
  if(answered) return;
  if(e.pointerType !== "mouse" && !down) return;
  const a = angleAt(e); if(a !== null){ aim = a; drawAim(); }
});
stage.addEventListener("pointerup", e => {
  if(!down) return; down = false;
  if(answered) return;
  const a = angleAt(e);
  if(a !== null){ aim = a; toggle(a); }
  if(e.pointerType !== "mouse") aim = null;
  drawAim();
});
stage.addEventListener("pointercancel", () => { down = false; });
stage.addEventListener("pointerleave", e => { if(e.pointerType === "mouse" && !down){ aim = null; drawAim(); } });

document.addEventListener("keydown", e => {
  if($("sheet").classList.contains("show")){ if(e.key === "Escape") closeSheet(); return; }
  if($("overlay").classList.contains("show")) return;
  const k = e.key;
  if(answered){
    if(k === "Enter" && document.activeElement !== $("next")){ e.preventDefault(); next(); }
    return;
  }
  if(k === "ArrowLeft" || k === "ArrowRight" || k === "ArrowUp" || k === "ArrowDown"){
    const step = e.shiftKey ? 1 : 15, dir = (k === "ArrowLeft" || k === "ArrowUp") ? 1 : -1;
    aim = norm((aim === null ? 0 : Math.round(aim / step) * step) + dir*step);
    drawAim(); e.preventDefault();
  } else if(k === " " && document.activeElement === stage){
    if(aim === null) aim = 0;
    toggle(aim); drawAim(); e.preventDefault();
  } else if(k.toLowerCase() === "r" && !e.ctrlKey && !e.metaKey){
    clearPoints();
  }
});
function clearPoints(){ if(!answered){ placed = []; drawPoints(); checkPoints(); } }
$("none").addEventListener("click", () => answer("none"));
$("all").addEventListener("click", () => answer("all"));
$("giveup").addEventListener("click", giveUp);
$("next").addEventListener("click", next);
$("hintBtn").addEventListener("click", giveHint);
$("tri30").addEventListener("click", () => showTriangle(30));
$("tri45").addEventListener("click", () => showTriangle(45));
$("shClose").addEventListener("click", closeSheet);
$("sheet").addEventListener("click", e => { if(e.target === $("sheet")) closeSheet(); });
$("clear").addEventListener("click", clearPoints);
// the memory-triangle name in a hint is a link that opens the card
$("hint").addEventListener("click", e => {
  const a = e.target.closest(".trilink"); if(!a) return;
  e.preventDefault(); showTriangle(+a.dataset.tri);
});

newRun();
</script>
</body>
</html>
