      prompt:`Nyt katkoviiva on kulma 2${A}. Montako kierrosta 2${A} kiertää, kun ${A} kiertää yhden?`,
      script:[["sweep",0,360,6000], ["wait",2000], ["loop"]],
      tiles:[1,2,4].map(n => ({html:`${n}`, cls:"c", ok:n === 2, show:n === 2 ? null : () => runScript(intro.step.script, ++intro.token),
        why:`Katso uudestaan: kun säde ${A} kiertää yhden kierroksen, katkoviiva 2${A} kiertää kaksi.`})),
      ok:`Oikein! 2${A} kiertää kaksi kierrosta, kun ${A} kiertää yhden. Siksi ratkaisuja on kaksi kertaa enemmän.` },
    // angle:true: the ray's own angle α is shown as it turns (Vadim)
    { kind:"ghost", inner:true, angle:true, task:IN(SIN+"2"+A, "1", [45,225], `2${A}`, [2,0], "2α"),
      prompt:`sin&nbsp;2${A} = 1, kun katkoviiva 2${A} osoittaa suoraan ylös. Missä säde ${A} silloin on?`,
      script:[["sweep",0,45,1600], ["wait",1000], ["sweep",45,225,4000], ["wait",1000], ["sweep",225,360,1600], ["wait",1200], ["loop"]],
      tiles:[ {html:"90°", why:`90° on katkoviivan 2${A} suunta. Katso, missä säde ${A} on, kun katkoviiva osoittaa ylös.`},
              {html:"45°", why:`Katso koko kierros: katkoviiva osoittaa ylös kahdesti.`},
              // right: the turn stops at 45°, the dashed ray up, both points marked
              {html:"45° ja 225°", ok:true, show:() => { intro.token++; hideHand(); intro.acc = aim = 45; drawAim();
                                                         placed = [45, 225]; drawPoints({bad:[], missed:[]}); }} ]
            .map(t => t.ok ? t : {...t, show:() => runScript(intro.step.script, ++intro.token)}),
      ok:`Oikein! Katkoviiva osoittaa ylös kahdesti: kun ${A} = 45° (2${A} = 90°) ja kun ${A} = 225° (2${A} = 450°).` },
    { kind:"place", inner:true, task:IN(COS+"2"+A, "−1", [90,270], `2${A}`, [2,0], "2α"),
      prompt:`Merkitse kaikki pisteet, joissa cos&nbsp;2${A} = −1. Katkoviiva näyttää kulman 2${A}, kun käännät sädettä.`,
      wrongAt:d => `Tässä 2${A} = ${Math.round(norm(2*d))}°. Käännä sädettä, kunnes katkoviiva 2${A} on kohdassa 180°.`,
      more:`Hyvä, yksi löytyi! Katkoviiva käy kohdassa 180° kahdesti, kun säde kiertää kierroksen.`,
      ok:`Oikein! 2${A} = 180° tai 540°, joten ${A} = 90° tai 270°.` },
    { kind:"ghost", inner:true, task:IN(SIN+fr(A,2), "1", [180], fr(A,2), [.5,0], "α/2"),
      prompt:`Nyt katkoviiva on kulma ${A}/2. Montako kierrosta ${A}/2 kiertää, kun ${A} kiertää yhden?`,
      script:[["sweep",0,360,6000], ["wait",2000], ["loop"]],
      tiles:["½","1","2"].map(n => ({html:n, cls:"c", ok:n === "½", show:n === "½" ? null : () => runScript(intro.step.script, ++intro.token),
        why:`Katso uudestaan: kun säde ${A} kiertää yhden kierroksen, katkoviiva ${A}/2 kiertää vain puolet.`})),
      ok:`Oikein! ${A}/2 kiertää vain puoli kierrosta, joten ratkaisuja voi olla vähemmän.` },
    { kind:"place", inner:true, task:IN(SIN+fr(A,2), "1", [180], fr(A,2), [.5,0], "α/2"),
      prompt:`Merkitse kaikki pisteet, joissa sin(${A}/2) = 1. Katkoviiva näyttää kulman ${A}/2.`,
      wrongAt:d => `Tässä ${A}/2 = ${Math.round(norm(d)/2)}°. Käännä sädettä, kunnes katkoviiva ${A}/2 osoittaa suoraan ylös.`,
      ok:`Oikein! ${A}/2 = 90°, joten ${A} = 180°. Muita ratkaisuja ei ole, koska ${A}/2 kiertää vain puoli kierrosta.` },
  ],
};
// the chapters' names in the Esittely button's menu
const INTRO_NAME = {kulmat:"Kulmat ja radiaanit", sincostan:"sin, cos ja tan", arc:"arcsin, arccos ja arctan",
                    sisakulma:`${A} − 30°, 2${A} ja ${A}/2`};
// the text of the "Valmista!" dialog after a chapter
const INTRO_DONE = {
  sisakulma:`Muista: ratkaise ensin funktion sisällä oleva kulma (${A} − 30°, 2${A}, ${A}/2 …) ja vasta sitten ${A}. Kun ${A} kiertää kierroksen, 2${A} kiertää kaksi ja ${A}/2 vain puoli.`,
  kulmat:"Olet nyt valmis pelaamaan! Merkitse ympyrälle kaikki kohdat, joissa yhtälö on totta.",
  sincostan:`Muista: cos ${A} on x-koordinaatti, sin ${A} y-koordinaatti ja tan ${A} säteen kulmakerroin. Jos ratkaisuja ei ole, paina Ei ratkaisuja.`,
  arc:`Muista: ${inv("sin")} antaa kulman väliltä ${IV.sin}, ${inv("cos")} väliltä ${IV.cos} ja ${inv("tan")} väliltä ${IV.tan}.`,
};

/* the Esittely button: a menu of the chapters up to this level, all alike,
   the latest last and focused (Vadim); the chosen one runs, then the same task goes on with its
   clicks, hints and time (the menu's and the intro's time don't count) */
function openIntroMenu(){
  const snap = {tasks, idx, clicks, hintsUsed, hintPress, t: performance.now() - taskStart};
  const resume = () => {
    tasks = snap.tasks; idx = snap.idx; drawStatic(); showTask();
    clicks = snap.clicks; hintsUsed = snap.hintsUsed; hintPress = snap.hintPress;
    taskStart = performance.now() - snap.t; updateHud(); afterHintPress();
  };
  const levels = Object.keys(INTRO_AT).map(Number).filter(l => l <= level);
  $("ovTitle").textContent = "Esittely";
  $("ovResult").innerHTML = `<p class="intro-q">Minkä esittelyn haluat katsoa?</p><div id="ovMenu"></div>`;   // the question above the list
  $("ovMsg").textContent = ""; $("ovScore").innerHTML = "";
  IntroKit.menu($("ovMenu"), levels.map((l, i) => ({ch:INTRO_AT[l], html:INTRO_NAME[INTRO_AT[l]],
      sub:`taso ${l} · ${INTRO_STEPS[INTRO_AT[l]].length} vaihetta`, latest:i === levels.length - 1})),
    it => startIntro([it.ch], resume, "Jatka peliä"));
  const btns = $("ovBtns"); btns.innerHTML = "";
  const close = document.createElement("button");
  close.className = "btn"; close.textContent = "Sulje";
  close.addEventListener("click", () => { $("overlay").classList.remove("show"); taskStart = performance.now() - snap.t; });
  btns.appendChild(close);
  $("overlay").classList.add("show");
  $("ovMenu").querySelector(".latest").focus();
}
function startIntro(chapters, then, doneLabel){
  intro = {chapters, steps:chapters.flatMap(c => INTRO_STEPS[c]), then, doneLabel, token:0, i:0, hand:null};
  document.body.classList.add("intro");
  ["introBar","introPrompt","introAnswers"].forEach(id => $(id).hidden = false);
  $("overlay").classList.remove("show");
  introStep(0);
}
function introStep(i){
  const st = intro.steps[i];
  Object.assign(intro, {i, step:st, done:false, labelFn:null, acc:0, demoOn:!!st.demo});
  const tok = ++intro.token;                     // stops the scripts of the step before
  $("introLayer").innerHTML = ""; intro.hand = null;
  tasks = [st.task]; idx = 0;
  placed = (st.given || []).slice(); answered = false; aim = null; down = false;
  hintGreen.clear(); hintPulse.clear(); hintFx = {...(st.arc && {arc:st.arc}), ...(st.inner && {inner:true})};
  clearTimeout(hintTimer); clearTimeout(almostTimer);
  drawStatic(); drawHintLayer();
  $("guide").innerHTML = ""; if(st.guide) drawGuide(st.task);
  drawPoints(); drawAim();
  $("legend").hidden = !st.legend;
  intro.lock = st.kind !== "place" || !!st.demo;  // can the player mark points? (not during a demo)
  $("introPrompt").innerHTML = nbText(st.prompt);
  say("");
  IntroKit.progress($("introProgress"), intro.steps.length, i);
  if(st.tiles) IntroKit.tiles($("introAnswers"), st.tiles, introAnswer);
  else $("introAnswers").innerHTML = "";
  if(st.kind === "ghost") runScript(st.script, tok).then(ok => {
    if(!ok || st.tiles) return;                  // with tiles the answer moves the step on
    intro.done = true; say(st.ok, "good"); showNext();
  });
  // a place step with a demo: the ghost hand plays it once, then the player's
  // turn, and only the task's sentence (st.after) is left on screen
  if(st.demo) runScript(st.demo, tok).then(ok => {
    if(!ok) return;
    intro.demoOn = false; intro.lock = false;
    $("introPrompt").innerHTML = nbText(st.after); say("");
  });
}
function say(html, cls = ""){
  const el = $("hint");
  el.innerHTML = nbText(html);
  el.classList.remove("warn", "tip"); el.classList.toggle("good", cls === "good");
}
function showNext(){
  const last = intro.i === intro.steps.length - 1;
  IntroKit.next($("introAnswers"), last, () => last ? finishIntro() : introStep(intro.i + 1));
}
// after every point the player marks or removes
function introCheck(){
  if(intro.done) return;
  const st = intro.step, p = task();
  const bad = badPoints(p), missed = missingSols(p);
  drawPoints({bad, missed:[]});                  // right points green, a wrong one red
  if(bad.length){
    const d = bad[bad.length - 1];
    return say((st.wrongAt && st.wrongAt(d)) || `Tämä piste on kulmassa ${angleText(d, p.unit)}. Kokeile uudestaan.`);
  }
  if(placed.length && (st.any || !missed.length)){
    intro.done = true; intro.lock = true; aim = null; drawAim();
    drawGuide(p); say(st.ok, "good"); showNext();
  } else say(placed.length ? (st.more || "Hyvä! Löydätkö loput?") : "");
}
function introAnswer(t, b){
  if(!intro || intro.done) return;
  if(t.show) t.show();                           // draw what the answer means
  if(!t.ok){ b.disabled = true; b.classList.add("wrong"); say(t.why); return; }
  intro.done = true; b.classList.add("right");
  $("introAnswers").querySelectorAll("button").forEach(x => x.disabled = true);
  say(intro.step.ok, "good"); showNext();
}
function finishIntro(){
  intro.token++;
  showOverlay("introDone"); if(motion) burst();
}
function exitIntro(){
  if(!intro) return;
  const then = intro.then;
  intro.token++;
  $("introLayer").innerHTML = "";
  $("overlay").classList.remove("show");        // the "Valmista!" dialog: resuming a task doesn't close it by itself
  intro = null;
  document.body.classList.remove("intro");
  ["introBar","introPrompt","introAnswers"].forEach(id => $(id).hidden = true);
  $("legend").hidden = false; $("hint").classList.remove("good");
  then();
}

/* ghost hand: scripts of ["say", html] ["wait", ms] ["sweep", from, to, ms],
   ["mark", angle] (a solution the turn has reached) and ["loop"] (from the
   start again while the step is not yet answered).
   A sweep turns the ray; its label counts the whole way, past 360° too.
   Every await checks the step's token, so restarting or leaving the step stops it. */
async function runScript(script, tok){
  for(let i = 0; i < script.length; i++){
    const [op, a, b, c] = script[i];
    if(op === "say"){ say(a); if(!await wait(1100, tok)) return false; }
    else if(op === "wait"){ if(!await wait(a, tok)) return false; }
    else if(op === "sweep"){ if(!await sweep(a, b, c, tok)) return false; }
    else if(op === "loop" && !intro.done) i = -1;    // again from the start until the step is answered
    else if(op === "mark"){ placed.push(a); drawPoints({bad:[], missed:[]}); }   // a solution the turn has reached
  }
  hideHand();
  return true;
}
function sweepLabel(){
  const a = intro.acc;
  if(task().unit !== "rad") return `${Math.round(a)}°`;
  if(a >= 358.5) return "2π";
  const k = Math.round(a/15);
  if(Math.abs(a - 15*k) > 1.5) return `≈ ${(a/180).toFixed(2).replace(".", ",")}π`;
  if(k === 0) return "0";
  const g = gcd(k, 12), n = k/g, m = 12/g, num = n === 1 ? "π" : `${n}π`;
  return m === 1 ? num : `${num}/${m}`;
}
function moveHand(h, a){
  const q = pt(a), k = (R + 18)/R;               // the fingertip just outside the circle, at the ray's end
  h.setAttribute("transform", `translate(${f1(q.x*k)},${f1(q.y*k + 6)}) rotate(-14) scale(1.9)`);
}
function hideHand(){
  const h = intro && intro.hand; if(!h) return;
  intro.hand = null; h.style.opacity = 0; setTimeout(() => h.remove(), 320);
}
function sweep(from, to, ms, tok){
  intro.labelFn = sweepLabel;
  let h = intro.hand;
  if(!h){
    h = intro.hand = document.createElementNS("http://www.w3.org/2000/svg", "g");
    h.setAttribute("class", "ghost-hand"); h.innerHTML = `<path d="${IntroKit.HAND_PATH}"/>`;
    $("introLayer").appendChild(h);
  }
  return tween(ms, e => {
    const a = from + (to - from)*IntroKit.ease(e);
    intro.acc = a; aim = norm(a); drawAim(); moveHand(h, a);
  }, tok);
}

/* ── input ──────────────────────────────────────────────────────────── */
const stage = $("stage");
function toSvg(e){
  const m = stage.getScreenCTM(); if(!m) return null;
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
  return p;
}
function angleAt(e){
  const p = toSvg(e); if(!p) return null;
  if(Math.hypot(p.x, p.y) < R*0.18) return null;          // too close to the centre to aim
  return norm(Math.atan2(-p.y, p.x) / D2R);
}
let down = false;
const locked = () => answered || (intro && intro.lock);
stage.addEventListener("pointerdown", e => {
  if(locked()) return;
  down = true; stage.setPointerCapture(e.pointerId);
  const a = angleAt(e); if(a !== null){ aim = a; drawAim(); }
  e.preventDefault();
});
stage.addEventListener("pointermove", e => {
  if(locked()) return;
  if(e.pointerType !== "mouse" && !down) return;
  const a = angleAt(e); if(a !== null){ aim = a; drawAim(); }
});
stage.addEventListener("pointerup", e => {
  if(!down) return; down = false;
  if(locked()) return;
  const a = angleAt(e);
  if(a !== null){ aim = a; toggle(a); }
  if(e.pointerType !== "mouse") aim = null;
  drawAim();
});
stage.addEventListener("pointercancel", () => { down = false; });
stage.addEventListener("pointerleave", e => { if(e.pointerType === "mouse" && !down){ aim = null; drawAim(); } });

document.addEventListener("keydown", e => {
  if($("sheet").classList.contains("show")){ if(e.key === "Escape") closeSheet(); return; }
  if($("overlay").classList.contains("show")) return;
  const k = e.key;
  if(answered){
    if(k === "Enter" && document.activeElement !== $("next")){ e.preventDefault(); next(); }
    return;
  }
  if(intro && intro.lock) return;
  if(k === "ArrowLeft" || k === "ArrowRight" || k === "ArrowUp" || k === "ArrowDown"){
    const step = e.shiftKey ? 1 : 15, dir = (k === "ArrowLeft" || k === "ArrowUp") ? 1 : -1;
    aim = norm((aim === null ? 0 : Math.round(aim / step) * step) + dir*step);
    drawAim(); e.preventDefault();
  } else if(k === " " && document.activeElement === stage){
    if(aim === null) aim = 0;
    toggle(aim); drawAim(); e.preventDefault();
  } else if(k.toLowerCase() === "r" && !e.ctrlKey && !e.metaKey){
    clearPoints();
  }
});
function clearPoints(){ if(!answered){ placed = []; hintGreen.clear(); hintPulse.clear(); drawPoints(); checkPoints(); } }
$("none").addEventListener("click", () => answer("none"));
$("all").addEventListener("click", () => answer("all"));
$("giveup").addEventListener("click", giveUp);
$("next").addEventListener("click", next);
$("hintBtn").addEventListener("click", giveHint);
$("tri30").addEventListener("click", () => showTriangle(30));
$("tri45").addEventListener("click", () => showTriangle(45));
$("shClose").addEventListener("click", closeSheet);
$("sheet").addEventListener("click", e => { if(e.target === $("sheet")) closeSheet(); });
$("clear").addEventListener("click", clearPoints);
/* testing (Vadim): typing "xyz", or the page opened with ?testi, shows a
   button that skips to the next level (its intro chapter first, if not seen).
   Students never see it. */
const TEST_CODE = "xyz"; let typed = "";
const showTestTools = () => { $("skipLevel").hidden = false; };
if(new URLSearchParams(location.search).has("testi")) showTestTools();
document.addEventListener("keydown", e => { typed = (typed + e.key.toLowerCase()).slice(-TEST_CODE.length); if(typed === TEST_CODE) showTestTools(); });
$("skipLevel").addEventListener("click", () => {
  if(intro || gameOver) return;
  if(level < MAX_LEVEL){ level++; enterLevel(); } else showOverlay("complete");
});
$("introRestart").addEventListener("click", () => introStep(intro.i));   // the step from the start
$("introSkip").addEventListener("click", exitIntro);
// replay the intro mid-task (the chapters up to this level); afterwards the
// same task starts over, its clicks, hints and time as they were
$("introBtn").addEventListener("click", () => {
  if(intro || answered || $("overlay").classList.contains("show")) return;
  openIntroMenu();
});
// the memory-triangle name in a hint is a link that opens the card
$("hint").addEventListener("click", e => {
  const a = e.target.closest(".trilink"); if(!a) return;
  e.preventDefault(); showTriangle(+a.dataset.tri);
});

newRun();
</script>
