<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yhtälövaaka</title>

<!-- ════════════════════════════════════════════════════════════════════
     GAME: Yhtälövaaka (balance-scale equations)
     Self-contained. Lives at  games/lukio/maa1-2/vaaka/index.html
     Box = x (unknown number of diamonds), diamond = 1,
     balloon = −1 (from level 3; it lifts its cup by one diamond's weight).
     A released balloon flies away. Balloons and diamonds do not cancel.
     From level 4, x may be negative: the box is full of balloons, so it
     lifts its cup, and a box taken out floats away instead of falling.
     Take (or add) an item in one cup, then do the SAME in the other cup
     before the scale tips over. The scale compares real weights. Goal: one box alone in a cup, only diamonds in the other. If the box ends up
     on the right, the scale turns itself around so the answer reads x = n.
     Grab an item and move it a little to take it out: it drops to the floor.
     Drop it into the other cup to move it there. Drag from the shelf to add.
     A plain click does nothing.
     Level 5: a cup may start with both diamonds and balloons (3x + 2 − 1 = 2x).
     Scoring: 10 levels, 3 lives. Each solved level gives
       (50 + 100·ideal/moves + 50·(3 s + 1 s·moves)/time) × level.
     A broken cup costs a life and 100 × level points; the third one is
     Game Over. Finishing gives 1000 + 500 per life left.
     Keys: A / S / D = left box / diamond / balloon,
           K / L / J = right box / diamond / balloon
           (Shift adds instead of removing),  r = restart (time and moves keep running)
     Puzzles are generated backwards from x = n by adding the same thing
     to both sides, so every state stays non-negative and solvable.
     Esittely: a guided intro on the same scale before level 1 and before
     level 3 (every time, or from the Esittely button); see the
     intro section in the script.
     ════════════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- shared site look: colours, fonts, header, lives, buttons, dialogs -->
<link rel="stylesheet" href="../../../../assets/theme.css">

<style>
  /* Only what is specific to this game. Everything else comes from assets/theme.css. */
  main{ flex:1; display:flex; flex-direction:column; align-items:center; }

  /* ── stage ── */
  .stage-wrap{ width:min(820px,100%); padding:8px 8px 0; }
  #stage{
    display:block; width:100%; height:auto;
    max-height:calc(100dvh - 370px); min-height:260px;
    user-select:none; -webkit-user-select:none; touch-action:none; cursor:default;
  }
  .floor{ stroke:var(--magenta); stroke-width:3; filter:var(--glow-magenta); }
  .stand{ fill:#15122e; stroke:var(--accent); stroke-width:2; }
  .pivot, .hook{ fill:var(--magenta); filter:var(--glow-magenta); }
  .beam{ fill:#0b0a18; stroke:var(--accent); stroke-width:3; }   /* stroke and glow are set from the tilt */
  .string{ stroke:var(--accent); stroke-width:1.4; opacity:.75; }
  .bowl{ fill:rgba(0,229,255,.06); stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; }
  .bowl-rim{ stroke:var(--accent); stroke-width:5; stroke-linecap:round; }
  #panL > .cup-scale, #panR > .cup-scale{ filter:var(--glow-cyan); }     /* one glow per cup */
  .target .bowl{ stroke:var(--magenta); fill:rgba(255,61,242,.12); }
  .target .bowl-rim{ stroke:var(--magenta); }
  .target > .cup-scale{ filter:var(--glow-magenta) !important; }
  .shelf{ stroke:var(--magenta); stroke-width:6; stroke-linecap:round; filter:var(--glow-magenta); }
  .shelf-label{ font-family:var(--ui); font-size:26px; fill:var(--muted); text-anchor:middle; }
  .supply{ cursor:grab; }
  .dragging{ cursor:grabbing; }
  .return-ring{ fill:none; stroke:var(--magenta); stroke-width:2.5; stroke-dasharray:7 6; opacity:.6; pointer-events:none; }
  .return-ring.on{ opacity:1; stroke-width:4; fill:rgba(255,61,242,.12); }
  .held{ filter:drop-shadow(0 0 10px rgba(0,229,255,.8)); pointer-events:none; }

  /* ── items ── */
  .item{ cursor:grab; }
  .box-body{ fill:var(--green-wash); stroke:var(--green); stroke-width:3.5; }
  .box-lid{ stroke:var(--green); stroke-width:3; opacity:.6; }
  .box-label{ font-family:var(--display); font-weight:700; font-size:54px; fill:var(--green-ink); text-anchor:middle; }
  .gem-body{ fill:var(--gold); stroke:#fff3a8; stroke-width:1.6; stroke-linejoin:round; }
  .gem-facet{ fill:none; stroke:#7a6510; stroke-width:1; opacity:.55; }
  .balloon-body{ fill:var(--magenta); stroke:#ffb8fb; stroke-width:1.6; }
  .balloon-knot{ fill:#ffb8fb; }
  .balloon-shine{ fill:#fff; opacity:.5; }
  .bstring{ fill:none; stroke:#ffb8fb; stroke-width:1.3; opacity:.7; }
  .item:hover .box-body{ fill:#0b3d26; }
  .item:hover .gem-body{ fill:#fff07a; }
  .open-lid{ fill:var(--green-wash); stroke:var(--green); stroke-width:3.5; }

  /* ── equation chain under the scale ──
     One row per balanced state, aligned at "=", with "| −1" on the right of
     the row it was done to. The newest three rows sit under the scale; older
     ones rise behind the (transparent) scale picture, faded. */
  .stage-wrap{ position:relative; z-index:1; }
  /* as wide as the drawn scale (set from the script), so its edges are the cups' outer edges */
  .eqzone{ position:relative; width:100%; max-width:100%; height:calc(3 * var(--row)); --row:clamp(32px,7.4vw,46px); margin-top:2px; }
  .chain{
    position:absolute; left:0; right:0; bottom:0; z-index:0; pointer-events:none;
    /* three columns: left sides | "=" | right sides with the steps.
       The two halves are always equally wide, so "=" stays in the exact middle,
       under the scale's post. In the right half the steps form one column,
       left-aligned so the bars line up and pushed out to the right edge; only a
       right side too long for its half pushes them further out. */
    display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:end;
    font-family:var(--math); font-weight:600; font-size:clamp(22px,5.4vw,34px); white-space:nowrap;
  }
  .chain .colL, .chain .colM, .chain .colR{ display:grid; grid-auto-rows:var(--row); align-items:center; }
  .chain .colL{ justify-items:end; }
  .chain .colM{ justify-items:center; }
  .chain .colR{ grid-template-columns:max-content minmax(.7em,1fr) max-content 6%; }
  .chain .colR .rhs{ grid-column:1; }
  .chain .colR .ann{ grid-column:3; }
  .chain.rise{ transition:transform .35s ease; }
  .chain span{ transition:opacity .35s ease; }
  /* ≠ drawn as the font's own "=" with a slash (Chakra Petch has no ≠ glyph) */
  .eq.ne{ position:relative; display:inline-block; }
  .eq.ne::after{
    content:""; position:absolute; left:50%; top:52%; width:.085em; height:.62em; border-radius:.04em;
    background:currentColor; transform:translate(-50%,-50%) rotate(32deg);
  }
  .chain .ann{ color:var(--muted); font-weight:500; }
  .chain .ann .bar{ color:var(--accent); opacity:.7; margin-right:.25em; }
  .chain .old{ opacity:.28; }
  .chain .gone{ opacity:0; }
  @media (prefers-reduced-motion: reduce){ .chain.rise, .chain span{ transition:none; } }

  .legend{
    display:flex; gap:22px; justify-content:center; align-items:center;
    font-family:var(--math); font-size:16px; color:var(--muted); padding:2px 0 4px;
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend svg{ width:20px; height:20px; overflow:visible; }

  /* ── "Näytä ratkaisu" in the win dialog: the player's chain beside a model one ── */
  .win{ max-height:calc(100dvh - 40px); overflow-y:auto; }
  .win:has(.solution[open]){ width:min(600px,96vw); }
  .solution{ margin-top:16px; border-top:1px solid var(--line); padding-top:10px; }
  .solution summary{
    list-style:none; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    font-family:var(--ui); font-size:13px; letter-spacing:.04em; color:var(--muted);
    padding:4px 6px; border-radius:var(--radius);
  }
  .solution summary::-webkit-details-marker{ display:none; }
  .solution summary::before{ content:"▸"; color:var(--accent); transition:transform .15s ease; }
  .solution[open] summary::before{ transform:rotate(90deg); }
  .solution summary:hover{ color:var(--accent-ink); }
  .solution summary:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  /* two equal halves, each chain centred in its half: the pair sits symmetrically around the middle */
  .cmp{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px; text-align:center; }
  .cmp > div{ min-width:0; }
  .cmp h3{ font-family:var(--ui); font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  .cmp .steps{ font-family:var(--ui); font-size:12px; color:var(--muted); margin-top:6px; }
  .mini{
    display:inline-grid; grid-template-columns:auto auto auto auto; align-items:baseline; max-width:100%; text-align:left;
    gap:4px 0; font-family:var(--math); font-weight:600; font-size:clamp(13px,3.6vw,17px); white-space:nowrap; overflow-x:auto;
  }
  .mini .lhs{ text-align:right; } .mini .rhs{ text-align:left; }
  .mini .ann{ padding-left:.6em; color:var(--muted); font-weight:500; }
  .mini .ann .bar{ color:var(--accent); opacity:.7; margin-right:.2em; }
  @media (max-width:380px){ .cmp{ grid-template-columns:1fr; } }

  /* ── Esittely (intro): the shared look is in theme.css; here only this game's part ── */
  .eqzone{ transition:opacity .35s ease; }
  .eqzone.veiled{ opacity:0; }
  body.intro .statusrow, body.intro .legend, body.intro .hud, body.intro #introBtn, body.intro #skipLevel, body:not(.intro) #introSkip{ display:none; }
  /* room for the question, the chain (3 rows), feedback and the answer tiles */
  body.intro #stage{ max-height:calc(100dvh - 372px - 3 * clamp(32px,7.4vw,46px)); min-height:170px; }

  /* ── what the box held, in the win dialog ── */
  .win .gems{ display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin:8px auto 0; max-width:260px; }
  .win .gems svg{ width:22px; height:24px; overflow:visible; }
</style>

<script>
"use strict";
const motion = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (lo,hi)=> lo + Math.floor(Math.random()*(hi-lo+1));
const $ = id => document.getElementById(id);
const setText = (id,v)=>{ const el=$(id); if(el) el.textContent=v; };
const SVGNS="http://www.w3.org/2000/svg";

/* ── geometry (SVG units) ───────────────────────────────────────────── */
const PIV = {x:550, y:300};      // beam pivot
const ARM = 304;                 // half beam length (0.8 × the original 380)
/* Cups are wider than originally (440 vs 340 units). Everything inside a cup —
   bowl, boxes, diamonds, balloons — is drawn in the original units and scaled
   by S, so items grow in the same proportion as the cup. */
const CUP_W_OLD = 340, CUP_W = 440;
const S = CUP_W / CUP_W_OLD;     // ≈ 1.29
// string length: hook → cup rim. Chosen so that at full tilt the cups stay
// clear of the post and the lower cup lands beside the stand's foot.
const HANG = 520;
const FLOOR = 1050;
const BOWL_DEPTH = 36*S;
const MAX_TILT = Math.asin((FLOOR - BOWL_DEPTH - HANG - PIV.y) / ARM);  // lower cup touches floor
const CAP = {b:6, d:24, p:8};    // (24 diamonds: they are big now and stack up)
document.querySelectorAll(".cup-scale").forEach(g=>g.setAttribute("transform",`scale(${S})`));    // what fits in one cup
let SUPPLY = {};                 // shelf pick areas, set by renderShelf()
const MAX_LEVEL = 10;             // difficulty stops growing here, so the game ends after level 10
const BALLOON_LEVEL = 3;
const balloonsOn = () => intro ? !!intro.step.balloons : level >= BALLOON_LEVEL;

/* ── shapes ─────────────────────────────────────────────────────────── */
const boxShape = label =>
  `<rect x="-51" y="-51" width="102" height="102" rx="12" class="box-body"/>` +
  `<line x1="-51" y1="-27" x2="51" y2="-27" class="box-lid"/>` +
  `<text y="33" class="box-label">${label}</text>`;
const GEM_SCALE = 1.65;           // diamonds on the scale: 1.65× their original size
const GEM_SCALE_SMALL = 1.1;      // diamonds inside the opened box and in the win card
const gemShape = (k=GEM_SCALE) => `<g transform="scale(${k})">` +
  `<polygon points="-6,-10 6,-10 10,-4 0,11 -10,-4" class="gem-body"/>` +
  `<polyline points="-10,-4 10,-4" class="gem-facet"/>` +
  `<polyline points="-3,-10 0,-4 3,-10" class="gem-facet"/></g>`;
/* an opened box with n diamonds inside (shown when the puzzle is solved) */
function openBoxShape(v){
  const n=Math.abs(v), neg=v<0;                     // negative x: the box holds balloons
  const cols = n<=4 ? 2 : 3, rows = Math.ceil(n/cols);
  let gems="";
  for(let i=0;i<n;i++){
    const r=Math.floor(i/cols), inRow=Math.min(cols,n-r*cols), j=i-r*cols;
    const x=(j-(inRow-1)/2)*28, y=8+(r-(rows-1)/2)*25;
    gems += neg
      ? `<g transform="translate(${x},${y-2}) scale(0.68)">${balloonShape(0,20,1)}</g>`
      : `<g transform="translate(${x},${y})">${gemShape(GEM_SCALE_SMALL)}</g>`;
  }
  return `<rect x="-51" y="-51" width="102" height="102" rx="12" class="box-body"/>` + gems +
         `<rect x="-55" y="-25" width="110" height="24" rx="8" class="open-lid" transform="rotate(-24 -55 -51) translate(-8 -44)"/>`;
}
/* balloon: (tx,ty) = where its string ends, relative to the balloon's centre */
const BALLOON_SCALE = 1.5;        // balloons on the scale: 1.5× their original size
function balloonShape(tx, ty, k=BALLOON_SCALE){
  const b=20*k;                    // bottom of the balloon, where the string starts
  return `<path d="M0,${b.toFixed(1)} Q${(tx*0.35-6).toFixed(1)},${(b+(ty-b)*0.5).toFixed(1)} ${tx.toFixed(1)},${ty.toFixed(1)}" class="bstring"/>` +
         `<g transform="scale(${k})">` +
         `<ellipse rx="14" ry="17" class="balloon-body"/>` +
         `<path d="M-3.5,21 L3.5,21 L0,16 Z" class="balloon-knot"/>` +
         `<ellipse cx="-5" cy="-7" rx="3.5" ry="5.5" class="balloon-shine"/></g>`;
}
const shapeOf = t => t==="b" ? boxShape("x") : t==="p" ? balloonShape(3,62) : gemShape();
const SHARD_L = "M-85,-18 L72,-18 L64,-5 L78,6 L70,18 L-25,18 Q-70,16 -85,-18 Z";
const SHARD_R = "M-90,-18 L90,-18 Q76,16 30,18 L-90,18 L-82,6 L-96,-5 Z";

/* The shelf is half the screen wide (box + diamonds), and three quarters wide
   once balloons join from level 3. Its items are drawn at cup scale and
   spread evenly along it. */
const SHELF_Y = 50;
function renderShelf(){
  if(intro && !intro.step.shelf){ $("shelf").innerHTML=""; SUPPLY={}; return; }   // most intro steps have no shelf
  const kinds = balloonsOn() ? ["b","d","p"] : ["b","d"];
  const W = balloonsOn() ? 1100*0.75 : 1100*0.5, x0 = 550 - W/2;
  let h=`<line class="shelf" x1="${x0}" y1="${SHELF_Y}" x2="${x0+W}" y2="${SHELF_Y}"/>`;
  SUPPLY={};
  kinds.forEach((t,i)=>{
    const cx = x0 + W*(i+0.5)/kinds.length;
    let inner;
    if(t==="b"){
      inner=`<g transform="translate(0,-54)">${boxShape("x")}</g>`;
      SUPPLY.b={x:cx, y:SHELF_Y-54*S, w:58*S, h:58*S};
    } else if(t==="d"){
      inner=[[-33,-18],[0,-18],[33,-18],[-16.5,-51],[16.5,-51],[0,-84]]
        .map(([x,y])=>`<g transform="translate(${x},${y})">${gemShape()}</g>`).join("");
      SUPPLY.d={x:cx, y:SHELF_Y-51*S, w:58*S, h:56*S};
    } else {
      inner=[[-24,-78],[24,-70],[0,-112]]
        .map(([x,y])=>`<g transform="translate(${x},${y})">${balloonShape(-x,-2-y)}</g>`).join("");
      SUPPLY.p={x:cx, y:SHELF_Y-90*S, w:52*S, h:56*S};
    }
    h+=`<g class="supply" transform="translate(${cx},${SHELF_Y}) scale(${S})">${inner}</g>`;
  });
  h+=`<text class="shelf-label" x="550" y="${SHELF_Y+32}">Lisää vetämällä</text>`;
  $("shelf").innerHTML=h;
}

/* item positions inside a cup.
   Boxes sit on the cup floor, 3 per row. Diamonds only rest on something solid:
   first one layer on top of the boxes (≈5 per box), then on the cup floor beside
   the boxes (hugging them), then on exposed tops of lower box rows, and only after
   that in further layers on top of the boxes. Each layer is full before the next. */
const GEM_W=33, GEM_H=35, CUP_HALF=162;   // slot size for the 1.65× diamonds
function layout(c){
  const out=[];
  const rows=[];                                   // box rows: {n, half-width, top y}
  for(let i=0;i<c.b;i++){
    const r=Math.floor(i/3), inRow=Math.min(3,c.b-r*3), j=i-r*3;
    out.push({t:"b", x:(j-(inRow-1)/2)*108, y:-(53+r*106)});
    rows[r]={half:(inRow*108-6)/2, top:-(104+r*106)};
  }

  // slots of one layer on a surface made of x-ranges; nearest to the centre first
  const layerSlots=(ranges,y)=>{
    const sl=[];
    for(const [a,b] of ranges){
      const n=Math.floor((b-a)/GEM_W); if(n<=0) continue;
      const x0=a+((b-a)-n*GEM_W)/2+GEM_W/2;
      for(let i=0;i<n;i++) sl.push({x:x0+i*GEM_W, y});
    }
    return sl.sort((p,q)=>Math.abs(p.x)-Math.abs(q.x));
  };
  // shelves: {ranges, y (surface), layers allowed}
  const shelves=[];
  if(!rows.length){
    shelves.push({ranges:[[-CUP_HALF,CUP_HALF]], y:0, layers:99});
  } else {
    const topRow=rows[rows.length-1];
    // the top layer may overhang the box edges a little (3 diamonds fit on one box)
    const top={ranges:[[-topRow.half-4,topRow.half+4]], y:topRow.top, layers:99};
    shelves.push({...top, layers:1});                                  // 1) first layer on top
    const h0=rows[0].half+3;
    shelves.push({ranges:[[-CUP_HALF,-h0],[h0,CUP_HALF]], y:0, layers:3}); // 2) floor beside boxes (≈ box height)
    for(let r=0;r<rows.length-1;r++){                                  // 3) exposed lower tops
      const a=rows[r].half, b=rows[r+1].half+3;
      if(a-b>=GEM_W) shelves.push({ranges:[[-a,-b],[b,a]], y:rows[r].top, layers:3});
    }
    shelves.push({...top, y:top.y-GEM_H, layers:99});                  // 4) more layers on top
  }

  let left=c.d;
  for(const sh of shelves){
    for(let k=0;k<sh.layers && left>0;k++){
      const sl=layerSlots(sh.ranges, sh.y-17-k*GEM_H);
      if(!sl.length) break;
      for(const p of sl){ if(!left) break; out.push({t:"d", x:p.x, y:p.y}); left--; }
    }
    if(!left) break;
  }

  // balloons float above everything else, their strings tied to the cup rim
  const top=out.reduce((m,it)=>Math.min(m, it.y-(it.t==="b"?51:18)), 0);
  // keep the highest row below the hook (only matters in very full cups)
  const rowsP=Math.ceil((c.p||0)/4), highest=top-58-(rowsP-1)*62;
  const shift=Math.max(0, (-HANG/S+28) - highest);
  for(let i=0;i<(c.p||0);i++){
    const r=Math.floor(i/4), inRow=Math.min(4,c.p-r*4), j=i-r*4;
    const x=(j-(inRow-1)/2)*46 + (r%2)*14, y=top-58-r*62+shift;
    out.push({t:"p", x, y, ax:Math.max(-150,Math.min(150,x*2.4))});
  }
  return out;
}

/* ── puzzle generator: start from x = n and add the same to both sides ─ */
const NEG_LEVEL = 4;             // from this level the answer may be negative
const MIX_LEVEL = 5;             // from this level a cup may start with diamonds AND balloons
// Level 5 was added between the old levels 4 and 5: it is as hard as level 4,
// but one cup always starts mixed (3x + 2 − 1 = 2x). Levels 6–10 are the old
// 5–9, and half of their puzzles have a mixed cup.
const difficulty = level => level <= MIX_LEVEL ? Math.min(level, MIX_LEVEL - 1) : level - 1;
function genPuzzle(level){
  const mixed = level === MIX_LEVEL || (level > MIX_LEVEL && Math.random() < .5);
  for(;;){
    const p = genPure(difficulty(level));
    if(mixed){
      // add z diamond–balloon pairs to one cup (it keeps its weight)
      const c = Math.random() < .5 ? p.L : p.R, z = rand(1, level >= 8 ? 3 : 2);
      c.d += z; c.p += z;
      if(c.d > CAP.d || c.p > CAP.p) continue;
    }
    p.par = parOf(p);
    return p;
  }
}
/* the fewest moves: every item that has to leave or join a cup is one move,
   except that one move carries an item straight from a cup that has to lose
   it to a cup that has to gain it. The end state is one box alone in a cup
   and |x| diamonds (or balloons when x < 0) in the other; it can be cheaper
   to keep the box in the cup that has fewer boxes (2x + 2 − 6 = x − 2: take
   out both boxes on the left), so both ends are counted and the cheaper one
   wins. (Checked offline against a full search of all move sequences.) */
function parOf(p){
  const pure = {b:0, d:Math.max(0, p.x), p:Math.max(0, -p.x)}, box = {b:1, d:0, p:0};
  const cost = (tL, tR) => {
    let n = 0;
    for(const t of ["b","d","p"]){
      const dL = tL[t] - (p.L[t] || 0), dR = tR[t] - (p.R[t] || 0);
      n += Math.abs(dL) + Math.abs(dR);
      if(dL * dR < 0) n -= Math.min(Math.abs(dL), Math.abs(dR));     // carried across
    }
    return n;
  };
  return Math.min(cost(box, pure), cost(pure, box));
}
function genPure(level){
  const kb = rand(level>=2 ? 1 : 0, Math.min(3, level));       // boxes added to both
  let x, k;                                                     // answer; constant added to both sides
  if(level>=NEG_LEVEL && Math.random()<0.4){
    // x = −2 … −(level+1): the box holds balloons. x = ±1 and 0 are never used.
    x = -rand(2, Math.min(8, level+1));
    do { k = rand(-4, 6); } while(k===0 || Math.abs(x+k)>8);
  } else {
    x = rand(2, Math.min(9, 3+level));
    if(level>=BALLOON_LEVEL && Math.random()<0.75) k = -rand(1, Math.min(6, level+2));  // negative ⇒ balloons
    else k = rand(1, Math.max(1, Math.min(18-x, 2+2*level)));
  }
  // a side's constant c is shown as c diamonds, or |c| balloons when c < 0
  const side = (b,c) => ({b, d:Math.max(0,c), p:Math.max(0,-c)});
  const p = { x, L:side(1+kb, k), R:side(kb, x+k) };
  if(Math.random()<.5) [p.L, p.R] = [p.R, p.L];               // box may end up on either side
  return p;
}
const fallTimeFor = level => Math.max(2.4, 6 - 0.45*(difficulty(level)-1));   // seconds to hit the floor

/* ── weights: the scale is honest — it compares real weights ────────── */
const weight = c => c.b*puzzle.x + c.d - (c.p||0);   // a balloon lifts by one diamond
function tiltSign(){                       // +1 = right cup down, −1 = left cup down
  const w = weight(cur.L) - weight(cur.R);
  return w<0 ? 1 : w>0 ? -1 : 0;
}

/* ── equation readout ───────────────────────────────────────────────── */
function sideHTML(c){
  const t=[];
  if(c.b) t.push(`<span class="xterm">${c.b===1?"":c.b}x</span>`);
  if(c.d) t.push(`<span class="cterm">${c.d}</span>`);
  let h=t.join(`<span class="op">+</span>`);
  if(c.p) h += (t.length ? `<span class="op">−</span>` : `<span class="pterm">−</span>`) + `<span class="pterm">${c.p}</span>`;
  return h || `<span class="cterm">0</span>`;
}
function eqHTML(){
  return `<span class="lhs">${sideHTML(cur.L)}</span>${relHTML()}<span class="rhs">${sideHTML(cur.R)}</span>`;
}

/* ── equation chain ─────────────────────────────────────────────────────
   chain = the balanced states so far, oldest first: {L, R, a}. `a` is what
   was done to both sides to get to the next row ({b: x's, c: constant}),
   null when the two sides changed differently ("weighing" — still an open
   question in CLAUDE.md, so for now such a row just has no annotation),
   undefined on the newest row. While a step is unfinished (the scale is
   tipped, or an item is in the hand) the newest row shows what has been done
   so far after each side, e.g. x + 2 ≠ 4 − 1, until the scale balances. */
let chain = [], shownRows = 0;
const copyState = () => ({L:{...cur.L}, R:{...cur.R}});
const sameSide = (a, b) => a.b===b.b && a.d===b.d && a.p===b.p;
const sameState = (a, b) => sameSide(a.L, b.L) && sameSide(a.R, b.R);
const val = c => ({b:c.b, c:c.d - c.p});
const kindOf = a => a && (a.b && !a.c ? "x" + Math.sign(a.b) : !a.b && a.c ? "c" + Math.sign(a.c) : "");
function resetChain(){ chain = [{...copyState(), a:undefined}]; shownRows = 0; }

// a balanced state that differs from the newest row becomes a new row
function commitChain(){
  const last = chain[chain.length - 1], vL0 = val(last.L), vR0 = val(last.R), vL = val(cur.L), vR = val(cur.R);
  const dL = {b:vL.b - vL0.b, c:vL.c - vL0.c}, dR = {b:vR.b - vR0.b, c:vR.c - vR0.c};
  let a = dL.b===dR.b && dL.c===dR.c ? dL : null;
  // −1, −1, −1 → | −3: a step of the same kind and sign as the one before it merges into it
  const prev = chain.length >= 2 ? chain[chain.length - 2] : null;
  if(a && prev && kindOf(prev.a) && kindOf(prev.a) === kindOf(a)){
    chain.pop(); a = {b:prev.a.b + a.b, c:prev.a.c + a.c}; chain[chain.length - 1].a = a;
  } else last.a = a;
  chain.push({...copyState(), a:undefined});
}
/* the model solution, from how the puzzle was built (see genPuzzle): first
   take the diamond–balloon pairs out of a mixed cup (a row without a step),
   then the constant k off both sides, then the kb extra boxes; the last row
   is x = n even when the box started on the right (the scale turns around) */
function modelChain(p){
  const side = (b, c) => ({b, d:Math.max(0, c), p:Math.max(0, -c)});
  const boxLeft = p.L.b > p.R.b, X = boxLeft ? p.L : p.R, O = boxLeft ? p.R : p.L;
  const kb = O.b, k = X.d - (X.p || 0), rest = O.d - (O.p || 0);   // rest = x + k
  const row = (bx, cx, bo, co, a) => boxLeft ? {L:side(bx, cx), R:side(bo, co), a} : {L:side(bo, co), R:side(bx, cx), a};
  const rows = [row(1 + kb, k, kb, rest, k ? {b:0, c:-k} : kb ? {b:-kb, c:0} : undefined)];
  if(k) rows.push(row(1 + kb, 0, kb, rest - k, kb ? {b:-kb, c:0} : undefined));
  if(kb) rows.push(row(1, 0, 0, rest - k));
  const last = rows[rows.length - 1];
  if(!boxLeft) [last.L, last.R] = [last.R, last.L];        // 2 = x is written x = 2, as in the player's chain
  const mix = c => c.d && c.p;
  if(mix(p.L) || mix(p.R)) rows.unshift({L:{p:0, ...p.L}, R:{p:0, ...p.R}});
  return rows;
}
function miniChain(rows){
  return `<div class="mini">` + rows.map(r => `<span class="lhs">${sideHTML(r.L)}</span><span class="eq">=</span>` +
    `<span class="rhs">${sideHTML(r.R)}</span><span class="ann">${annHTML(r.a)}</span>`).join("") + `</div>`;
}
const stepCount = rows => rows.filter(r => r.a && (r.a.b || r.a.c)).length;

// the scale was turned around: the newest row is written the other way round too
function flipChain(){ const r = chain[chain.length - 1]; [r.L, r.R] = [r.R, r.L]; }

function annHTML(a){
  if(!a || (!a.b && !a.c)) return "";
  const t = [];
  if(a.b) t.push(`${a.b < 0 ? "−" : "+"}${Math.abs(a.b) === 1 ? "" : Math.abs(a.b)}x`);
  if(a.c) t.push(`${a.c < 0 ? "−" : "+"}${Math.abs(a.c)}`);
  return `<span class="bar">|</span>` + t.map((x, i) => i ? x.replace(/^([−+])/, " $1 ") : x).join("");
}
// what has been put into or taken out of a cup since the newest row, written
// after that side: a diamond −1/+1, a balloon +1/−1 (taking a balloon out
// makes the cup heavier), a box −x/+x
function pendingHTML(was, now){
  const op = neg => `<span class="op">${neg ? "−" : "+"}</span>`, t = [];
  const db = now.b - was.b, dd = now.d - was.d, dp = now.p - was.p;
  if(db) t.push(op(db < 0) + `<span class="xterm">${Math.abs(db) === 1 ? "" : Math.abs(db)}x</span>`);
  if(dd) t.push(op(dd < 0) + `<span class="cterm">${Math.abs(dd)}</span>`);
  if(dp) t.push(op(dp > 0) + `<span class="pterm">${Math.abs(dp)}</span>`);
  return t.join("");
}
// "=" when the scale is level, otherwise a red "≠": with x unknown we can't say
// which side is bigger, even though the scale shows it
const relHTML = () => tiltSign() === 0 ? `<span class="eq">=</span>` : `<span class="eq off ne" role="img" aria-label="≠">=</span>`;

function renderChain(){
  const last = chain[chain.length - 1];
  if(status==="play" && !drag && tiltSign()===0 && !sameState(cur, last)) commitChain();
  const rows = chain.map(r => ({lhs:sideHTML(r.L), rel:`<span class="eq">=</span>`, rhs:sideHTML(r.R), ann:annHTML(r.a)}));
  const top = chain[chain.length - 1], open = rows[rows.length - 1];
  if(!sameState(cur, top)){                                     // an unfinished step
    open.lhs += pendingHTML(top.L, cur.L); open.rhs += pendingHTML(top.R, cur.R); open.rel = relHTML();
  }
  const el = $("chain"), n = rows.length;
  const o = i => i < n - 11 ? ' gone' : i < n - 3 ? ' old' : '';   // at most 8 faded rows above the newest three
  el.innerHTML =
    `<div class="colL">${rows.map((r, i) => `<span class="lhs${o(i)}">${r.lhs}</span>`).join("")}</div>` +
    `<div class="colM">${rows.map((r, i) => `<span class="rel${o(i)}">${r.rel}</span>`).join("")}</div>` +
    `<div class="colR">${rows.map((r, i) => `<span class="rhs${o(i)}">${r.rhs}</span><span class="ann${o(i)}">${r.ann}</span>`).join("")}</div>`;
  // a new row lifts the whole chain up by one row (a merge drops it by one)
  if(shownRows && n !== shownRows && motion){
    const h = parseFloat(getComputedStyle(el.firstElementChild).gridAutoRows) || 0;
    el.classList.remove("rise"); el.style.transform = `translateY(${(n - shownRows) * h}px)`;
    void el.offsetWidth; el.classList.add("rise"); el.style.transform = "";
  }
  shownRows = n;
}

// a level's first sentence in the hint, before the goal: what is new there.
// Only on the first two attempts at that level, after that just the goal.
const DRAG_TIP = "Vedä esine pois kupista (se putoaa lattialle) tai lisää hyllyltä — ja tee sama toiselle kupille.";
const INTRO = {1:DRAG_TIP, 2:DRAG_TIP,

  [NEG_LEVEL]:"Laatikossa voi nyt olla myös ilmapalloja."};

  let msg = (INTRO[level] && tries[level] <= 2 ? INTRO[level] + " " : "") + (level>=NEG_LEVEL
    ? "Tavoite: yksi laatikko yksin toisessa kupissa, toisessa pelkkiä timantteja tai pelkkiä palloja."
    : "Tavoite: yksi laatikko yksin toisessa kupissa, pelkkiä timantteja toisessa."), warn=false;

  else if(status==="winning") msg="Tasapainossa! Katsotaan, mitä laatikossa on…";

}
function flashHint(msg){ flash={msg, until:performance.now()+2000}; updateUI(); setTimeout(updateUI,2050); }

/* after every completed move: did we win, or lose the unknown? */
function checkEnd(){
  if(intro) return introCheck();
  if(status!=="play" || tiltSign()!==0) return;
  const {L,R}=cur;
  const alone = c => c.b===1 && c.d===0 && !c.p;     // just the box
  const gems  = c => c.b===0 && (!c.p || !c.d);      // only diamonds, or only balloons (x < 0)
  if(alone(L) && gems(R)){ status="winning"; settle=0; needFlip=false; startFireworks(); }
  else if(alone(R) && gems(L)){ status="winning"; settle=0; needFlip=true; startFireworks(); }   // x on the right
  // balanced with the same number of boxes on both sides ⇒ an identity (e.g. 0 = 0):
  // true for every x, so the box's contents can no longer be deduced
  else if(L.b===R.b){ status="identity"; settle=0; }
  updateUI();
}

/* ── positions ──────────────────────────────────────────────────────── */
function hookPos(side){
  const s = side==="L" ? -1 : 1;
  return {x:PIV.x + s*ARM*Math.cos(tilt), y:PIV.y + s*ARM*Math.sin(tilt)};
}
function cupPos(side){ const h=hookPos(side); return {x:h.x, y:h.y+HANG}; }
/* the cup an item would drop into. From the shelf (a normal solving move) the
   whole space the cup hangs in counts, hook to just below the bowl. From the
   other cup (never needed, usually an accident when dropping something off the
   scale) only the bowl itself counts: inside the rim, from 90 units above it
   (a little less than a box's height) to just below it. */
const DROP_SHELF = {dx:235, up:HANG, down:80};
const DROP_CUP   = {dx:170, up:90, down:40};
function cupAt(p, from){
  const a = from==="L" || from==="R" ? DROP_CUP : DROP_SHELF;
  for(const side of ["L","R"]){
    if(panEl[side].style.display==="none") continue;
    const c=cupPos(side);
    if(Math.abs(p.x-c.x)<=a.dx && p.y>=c.y-a.up && p.y<=c.y+a.down) return side;
  }
  return null;
}

/* ── dragging ───────────────────────────────────────────────────────── */
function svgPt(e){
  const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function pick(p){
  for(const t of balloonsOn() ? ["b","d","p"] : ["b","d"]){
    const s=SUPPLY[t];
    if(!s) continue;
    if(Math.abs(p.x-s.x)<=s.w && Math.abs(p.y-s.y)<=s.h) return {from:"S", t, x:p.x, y:p.y};
  }
  // generous touch radius: at least ~22 screen pixels around each diamond
  const tol=Math.max(20*S, 22/svg.getScreenCTM().a);
  let best=null;
  for(const side of ["L","R"]){
    if(panEl[side].style.display==="none") continue;
    const c=cupPos(side);
    for(const it of layout(cur[side])){
      const gx=c.x+it.x*S, gy=c.y+it.y*S;
      let d;
      if(it.t==="b") d = (Math.abs(p.x-gx)<=54*S && Math.abs(p.y-gy)<=54*S) ? 0 : Infinity;
      else { d=Math.hypot(p.x-gx,p.y-gy); if(d>(it.t==="p"?Math.max(30*S,tol):tol)) d=Infinity; }
      if(d<Infinity && (!best || d<best.d)) best={from:side, t:it.t, x:gx, y:gy, lx:it.x, ly:it.y, d};
    }
  }
  return best;
}

/* Touch screens: the moment a finger touches an item, a big copy of it
   appears centred on the fingertip, big enough to show around the finger, so
   the player sees what they are holding. The item
   still weighs on the cup — releasing without moving leaves it there.
   Moving the finger a few pixels takes it out for real.
   Mouse: a plain click does nothing; moving a few pixels takes the item out.
   A taken-out item released anywhere except the OTHER cup falls / flies away. */
const DRAG_START_PX = 6;
const TOUCH_GROW = {b:2, d:5, p:4};          // the held item's size on a touch screen (× its size in the cup)
let pending=null;

function heldOffset(t, touch){
  if(!touch) return null;
  return {grow:TOUCH_GROW[t], ox:0, oy:0};
}
function makeHeld(t){
  const g=document.createElementNS(SVGNS,"g");
  g.setAttribute("class","held"); g.innerHTML=shapeOf(t); dragLayer.appendChild(g);
  return g;
}
function placeHeld(g, x, y, grow){
  g.setAttribute("transform",`translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${(1.06*S*grow).toFixed(3)})`);
}
function endPreview(){
  if(!pending || !pending.g) return;
  pending.g.remove();
  if(pending.hit.from!=="S") renderPan(pending.hit.from);          // show the original again
}

svg.addEventListener("pointerdown",e=>{
  if(status!=="play" || drag || pending || (intro && intro.lock)) return;
  const p=svgPt(e), hit=pick(p);
  if(!hit) return;
  e.preventDefault();
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  const touch=e.pointerType!=="mouse";
  pending={hit, id:e.pointerId, cx:e.clientX, cy:e.clientY, p, touch};
  if(touch){                                   // show it big at the finger right away
    const o=heldOffset(hit.t, true);
    pending.g=makeHeld(hit.t); placeHeld(pending.g, p.x+o.ox, p.y+o.oy, o.grow);
    if(hit.from!=="S") renderPan(hit.from, false, hit);            // dim the original
  }
});
svg.addEventListener("pointermove",e=>{
  if(pending && e.pointerId===pending.id){
    if(Math.hypot(e.clientX-pending.cx, e.clientY-pending.cy) < DRAG_START_PX) return;
    if(status!=="play"){ endPreview(); pending=null; return; }
    const pd=pending; pending=null;
    beginDrag(pd.hit, pd.p, e.pointerId, pd.touch, pd.g);
  }
  if(drag && e.pointerId===drag.id) moveDrag(svgPt(e));
});
svg.addEventListener("pointerup",e=>{
  if(pending && e.pointerId===pending.id){ endPreview(); pending=null; return; }   // tap: stays in the cup
  if(drag && e.pointerId===drag.id) endDrag(svgPt(e));
});
svg.addEventListener("pointercancel",e=>{
  if(pending && e.pointerId===pending.id){ endPreview(); pending=null; }
  if(drag && e.pointerId===drag.id) endDrag(null);
});

// size of the "put back" ring around an item's old place (0.6 of the original
// size, so a short drag no longer snaps back so easily)
const HOME_K = 0.6;
function beginDrag(hit, p, id, touch, g){
  const snap=stateKey();                                // to tell later whether anything changed
  if(hit.from!=="S"){ cur[hit.from][hit.t]--; renderPan(hit.from); }   // now its weight comes off
  if(!g) g=makeHeld(hit.t);
  const o=heldOffset(hit.t, touch) || {grow:1, ox:hit.x-p.x, oy:hit.y-p.y};
  drag={snap, t:hit.t, from:hit.from, g, id, ox:o.ox, oy:o.oy, grow:o.grow, x:p.x+o.ox, y:p.y+o.oy,
        vx:0, vy:0, lt:performance.now()};
  if(hit.from!=="S"){
    // mark where it came from: bringing it back onto this ring puts it back
    const px=1/svg.getScreenCTM().a;
    const r = HOME_K * (hit.t==="b" ? 60*S : hit.t==="p" ? Math.max(30*S, 26*px) : Math.max(22*S, 24*px));
    drag.home={lx:hit.lx, ly:hit.ly, r};
    const ring=$("returnRing"); ring.setAttribute("r", r.toFixed(1)); ring.style.display="";
    updateReturnRing();
  }
  placeHeld(g, drag.x, drag.y, drag.grow);
  svg.classList.add("dragging");
  updateUI();
}

function moveDrag(p){
  const nx=p.x+drag.ox, ny=p.y+drag.oy, now=performance.now();
  const dt=Math.max(1,now-drag.lt)/1000;
  // smoothed hand velocity, so a released item keeps a little of its motion
  drag.vx=0.6*drag.vx+0.4*(nx-drag.x)/dt; drag.vy=0.6*drag.vy+0.4*(ny-drag.y)/dt;
  drag.x=nx; drag.y=ny; drag.lt=now;
  placeHeld(drag.g, nx, ny, drag.grow);
  const target=atHome() ? null : cupAt({x:nx, y:ny}, drag.from);   // where the item is, not the finger
  ["L","R"].forEach(s=>panEl[s].classList.toggle("target", s===target && s!==drag.from));
}

function dropToFloor(t, x, y, vx=0, vy=0){
  const cap=(v,m)=>Math.max(-m,Math.min(m,v));
  if(t==="b" && puzzle.x<0){                             // a box full of balloons floats away
    spawn(shapeOf("b"), x, y, {vx:cap(vx*0.2,60), vy:-30, gravity:-250, sway:true, r:51*S, scale:S});
    return;
  }
  if(t==="p"){                                           // a balloon flies up into the sky
    spawn(shapeOf("p"), x, y, {vx:cap(vx*0.2,80), vy:-60, gravity:-380, sway:true, r:26*S, scale:S});
    return;
  }
  spawn(shapeOf(t), x, y, {vx:cap(vx*0.3,180), vy:cap(Math.min(0,vy)*0.2,150), vr:cap(vx*0.2,120), r:(t==="b"?51:17)*S, scale:S});
}

/* the "put it back" ring rides along with its cup */
function homePos(){ const c=cupPos(drag.from); return {x:c.x+drag.home.lx*S, y:c.y+drag.home.ly*S}; }
function atHome(){
  if(!drag || !drag.home) return false;
  const h=homePos(); return Math.hypot(drag.x-h.x, drag.y-h.y) <= drag.home.r*1.1;
}
function updateReturnRing(){
  const ring=$("returnRing");
  if(!drag || !drag.home){ ring.style.display="none"; return; }
  const h=homePos();
  ring.setAttribute("cx",h.x.toFixed(1)); ring.setAttribute("cy",h.y.toFixed(1));
  ring.classList.toggle("on", atHome());
}

function endDrag(p){
  const {t, from, x, y, vx, vy, snap}=drag;
  const home=atHome();
  $("returnRing").style.display="none";
  const target = p && !home ? cupAt({x, y}, from) : null;
  drag.g.remove(); drag=null;
  svg.classList.remove("dragging");
  ["L","R"].forEach(s=>panEl[s].classList.remove("target"));

  if(home){ cur[from][t]++; renderPan(from); }             // put back where it was
  else if(target && target!==from){
    if(cur[target][t] >= CAP[t]){ flashHint("Kuppi on täynnä."); dropToFloor(t,x,y,vx,vy); }
    else { cur[target][t]++; renderPan(target); }
  } else {
    dropToFloor(t, x, y, vx, vy);            // out of the scale: falls to the floor
  }
  if(stateKey()!==snap) countMove();         // put back / dropped from the shelf = no move
  updateUI(); checkEnd();
}
function cancelDrag(){
  if(pending && pending.g) pending.g.remove();
  pending=null;
  $("returnRing").style.display="none";
  if(!drag) return;
  drag.g.remove(); drag=null; svg.classList.remove("dragging");
  ["L","R"].forEach(s=>panEl[s].classList.remove("target"));
}

/* keyboard fallback: remove one (Shift = add one) */
function nudge(side, t, add){
  if(status!=="play" || drag || (intro && intro.lock)) return;
  if(add){ if(cur[side][t]>=CAP[t]) return flashHint("Kuppi on täynnä."); cur[side][t]++; }
  else { if(!cur[side][t]) return; cur[side][t]--; }
  countMove(); renderPan(side); updateUI(); checkEnd();
}

/* ── particles (items dropped to the floor, crash debris) ────────────────────── */
function spawn(inner, x, y, o){
  const g=document.createElementNS(SVGNS,"g");
  g.innerHTML=inner; fxEl.appendChild(g);
  particles.push({g, x, y, rot:0, scale:o.scale||1, vx:o.vx||0, vy:o.vy||0, vr:o.vr||0, sway:!!o.sway, age:0,
    gravity:o.gravity??1600, r:o.r||10, life:o.life??Infinity, max:o.life??Infinity});
}
function stepParticles(dt){
  particles=particles.filter(p=>{
    p.vy+=p.gravity*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
    if(p.sway){ p.age+=dt; p.vx*=0.98; p.x+=Math.sin(p.age*3)*18*dt; p.rot=Math.sin(p.age*2.4)*8; p.vy=Math.max(p.vy,-420); }
    if(p.gravity<0 && p.y<-260){ p.g.remove(); return false; }          // gone into the sky
    if(p.gravity>0 && (p.x<20+p.r || p.x>1080-p.r)){      // stay on the visible floor
      p.x=Math.max(20+p.r, Math.min(1080-p.r, p.x)); p.vx*=-0.4;
    }
    if(p.gravity>0 && p.y+p.r>FLOOR){
      p.y=FLOOR-p.r; p.vy*=-0.3; p.vx*=0.7; p.vr*=0.5;
      if(Math.abs(p.vy)<50) p.vy=0;
      if(p.vy===0){                                   // resting: settle upright
        p.vx*=0.85; p.vr=0;
        const flat=Math.round(p.rot/360)*360;   // land upright
        p.rot+=(flat-p.rot)*Math.min(1,dt*10);
      }
    }
    p.life-=dt;
    if(p.life<=0){ p.g.remove(); return false; }
    const op = p.max===Infinity ? 1 : Math.max(0,p.life/p.max);
    p.g.setAttribute("transform",`translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${p.rot.toFixed(1)}) scale(${p.scale.toFixed(3)})`);
    p.g.setAttribute("opacity",op.toFixed(2));
    return true;
  });
}

/* ── crash, win, identity ───────────────────────────────────────────── */
function crash(side){
  status="crash";
  const c=cupPos(side), R=(a,b)=>a+Math.random()*(b-a), k=motion?1:0;
  if(drag){ dropToFloor(drag.t, drag.x, drag.y); cancelDrag(); }
  pending=null;
  layout(cur[side]).forEach(it=>{
    const gx=c.x+it.x*S, gy=c.y+it.y*S;
    if(it.t==="p" || (it.t==="b" && puzzle.x<0)){ dropToFloor(it.t, gx, gy, R(-150,150)); return; }
    spawn(shapeOf(it.t), gx, gy,
      {vx:R(-200,200)*k, vy:R(-380,-100)*k, vr:(it.t==="b"?R(-150,150):R(-420,420))*k, r:(it.t==="b"?51:17)*S, scale:S});
  });
  spawn(`<path class="bowl" d="${SHARD_L}"/>`, c.x-85*S, c.y+18*S, {vx:-170*k, vy:-180*k, vr:-120*k, r:18*S, scale:S});
  spawn(`<path class="bowl" d="${SHARD_R}"/>`, c.x+80*S, c.y+18*S, {vx: 180*k, vy:-200*k, vr: 130*k, r:18*S, scale:S});
  panEl[side].style.display="none";
  lives--; lastPenalty=Math.min(score, CRASH_PENALTY*level); score-=lastPenalty;
  updateHud(true); updateUI();
  setTimeout(()=>showOverlay(lives>0 ? "crash" : "gameover"), motion?1100:300);
}

function reveal(){
  status="won";
  const par = puzzle.par ?? moves, m = Math.max(1, moves), t = Math.max(0.5, elapsed);
  const ref = TIME_BASE + TIME_PER_MOVE*m;
  const pm = Math.round(PTS_MOVES*par/m), pt = Math.round(PTS_TIME*ref/t);   // time points have no cap
  lastWin = {par, moves:m, t, ref, pm, pt, total:(PTS_SOLVE+pm+pt)*level};
  score += lastWin.total; updateHud();
  renderPan("L", true); updateUI();
  setTimeout(()=>showOverlay("win"), motion ? 1950 : 200);
}
// fireworks begin the moment the winning move is made; the scale settles,
// turns around and the box opens while they are still in the air
function startFireworks(){ if(celebrated || !motion) return; celebrated=true; burst(); }

/* ── celebration: streamers and confetti (assets/celebrate.js), bursting
   at the height of the scale's beam */
function burst(){
  const bp=svg.createSVGPoint(); bp.x=PIV.x; bp.y=PIV.y;
  celebrate({y: bp.matrixTransform(svg.getScreenCTM()).y});   // beam height in screen pixels
}

function showOverlay(kind){

      row(`Aika ${sec(w.t)}`, "+"+w.pt) +
      row(`Taso ${level}`, "×"+level) +

    // "Näytä ratkaisu": the player's chain beside the model one (open by default)
    const mine = chain.map(r => ({...r})), model = modelChain(puzzle);
    const steps = (rows, extra = "") => { const n = stepCount(rows); return `<div class="steps">${n} ${n === 1 ? "vaihe" : "vaihetta"}${extra}</div>`; };
    $("ovCmp").innerHTML =

    $("ovSolution").open = true; $("ovSolution").hidden = false;

  } else if(kind==="complete"){

    $("ovTitle").textContent="Peli läpäisty! 🏆";
    $("ovResult").innerHTML=`<div class="bigscore">${fmt(score)} pistettä</div>`;
    $("ovMsg").textContent=`Olet päässyt pelin kaikki ${MAX_LEVEL} tasoa läpi.`;
    $("ovScore").innerHTML =
      row("Pisteet tasoista", fmt(fromLevels)) +
      row("Läpäisybonus", "+"+fmt(BONUS_FINISH)) +
      row(`Elämät ${lives} × ${BONUS_LIFE}`, "+"+fmt(lifeBonus)) +
      row("Yhteensä", fmt(score), "tot");
    first=btn("Aloita alusta",newRun,true);
    if(motion) burst();
  } else if(kind==="identity"){
    // balanced with equal box counts: either no boxes are left at all (x is gone),
    // or both cups still have boxes (a tautology such as 2x + 5 = 2x + 5)

    }

      : "Olet nyt valmis pelaamaan! Sinun täytyy olla nopea, koska pelissä vaakakuppi hajoaa, jos se osuu lattiaan.";
    first=btn(intro.doneLabel, exitIntro, true);
  } else if(kind==="gameover"){
    $("ovTitle").textContent="Game Over";
    $("ovResult").innerHTML=`<div class="bigscore">${fmt(score)} pistettä</div>`;
    $("ovMsg").textContent=`Kolmas kuppi hajosi. Pääsit tasolle ${level}/${MAX_LEVEL}.`;
    first=btn("Aloita alusta",newRun,true);
  } else {
    $("ovTitle").textContent="Kuppi hajosi!";
    $("ovResult").innerHTML="";
    $("ovMsg").textContent="Vaaka kallistui liikaa. Kun muutat yhtä kuppia, tee heti sama muutos myös toiseen.";
    $("ovScore").innerHTML =
      row("Menetit pisteitä", "−"+fmt(lastPenalty)) +
      row("Elämiä jäljellä", `${lives}/${LIVES}`, "tot");
    first=btn("Jatka",retryFresh,true);
  }
  link(); $("overlay").classList.add("show"); first.focus();
}

/* ── main loop: the scale tips while unbalanced, levels out when balanced ─ */
const SWING_W=6.5, SWING_Z=0.3;     // swing frequency (rad/s) and damping ratio: ≈2 s to settle
const BEAM_CALM=[0,229,255], BEAM_DANGER=[255,61,110];   // cyan → red as it tips
let last=performance.now();
function frame(now){
  const realDt=(now-last)/1000;
  const dt=Math.min(.05,realDt); last=now;
  if(status==="play" && !intro && $("overlay").classList.contains("show")===false)
    elapsed += Math.min(0.25, realDt);          // (ignores a pause if the tab was in the background)

  if(intro) introTilt(dt);                       // the intro's scale leans and waits, it never breaks
  else if(status==="play" || status==="winning" || status==="identity"){
    const s=tiltSign();
    if(s!==0){
      const toward=Math.max(0, tilt*s)/MAX_TILT;                      // 0 … 1 in the falling direction
      tiltV = s*(MAX_TILT/fallTimeFor(level))*(0.5+1.2*toward);    // speeds up as it falls
      tilt += tiltV*dt;
      if(Math.abs(tilt)>=MAX_TILT){ tilt=s*MAX_TILT; tiltV=0; crash(s>0?"R":"L"); }
    } else {
      // balanced: damped spring back to level. It keeps the momentum it had,
      // so it swings past level a little and settles in about 2 seconds.
      tiltV += (-SWING_W*SWING_W*tilt - 2*SWING_Z*SWING_W*tiltV)*dt;
      tilt  += tiltV*dt;
      tilt = Math.max(-MAX_TILT, Math.min(MAX_TILT, tilt));
      if(Math.abs(tilt)<1e-4 && Math.abs(tiltV)<1e-3){ tilt=0; tiltV=0; }
    }
    if((status==="winning" || status==="identity") && Math.abs(tilt)<0.01 && Math.abs(tiltV)<0.03){
      settle+=dt;
      if(settle>0.4){
        if(status==="winning"){
          if(needFlip){ status="flipping"; flipT=0; if(!motion) flipT=1; }
          else reveal();
        } else { status="over"; updateUI(); showOverlay("identity"); }
      }
    }
  }

  // turning the scale around: squeeze to zero width, swap the cups, open back up
  if(status==="flipping"){
    const before=flipT;
    flipT=Math.min(1, flipT+dt/0.9);
    if(before<0.5 && flipT>=0.5){ [cur.L, cur.R]=[cur.R, cur.L]; flipChain(); renderPan("L"); renderPan("R"); updateUI(); }
    const sx=Math.max(0.001, Math.abs(Math.cos(Math.PI*flipT)));
    $("rig").setAttribute("transform",`translate(${PIV.x} 0) scale(${sx.toFixed(3)} 1) translate(${-PIV.x} 0)`);
    if(flipT>=1){
      if(cur.R.b){ [cur.L, cur.R]=[cur.R, cur.L]; flipChain(); renderPan("L"); renderPan("R"); updateUI(); }   // (no-motion path)
      $("rig").removeAttribute("transform"); needFlip=false; reveal();
    }
  }

  beamEl.setAttribute("transform",`rotate(${(tilt*180/Math.PI).toFixed(2)} ${PIV.x} ${PIV.y})`);
  const k=Math.min(1,Math.abs(tilt)/MAX_TILT);
  const beamCol=`rgb(${BEAM_CALM.map((c,i)=>Math.round(c+(BEAM_DANGER[i]-c)*k)).join(",")})`;
  beamBar.style.stroke=beamCol;
  beamBar.style.filter=`drop-shadow(0 0 ${(5+7*k).toFixed(1)}px ${beamCol})`;
  let strings="";
  ["L","R"].forEach(side=>{
    if(panEl[side].style.display==="none") return;
    const h=hookPos(side), c=cupPos(side);
    panEl[side].setAttribute("transform",`translate(${c.x.toFixed(1)},${c.y.toFixed(1)})`);
    strings+=`<line class="string" x1="${h.x}" y1="${h.y}" x2="${c.x-168*S}" y2="${c.y}"/>`
            +`<line class="string" x1="${h.x}" y1="${h.y}" x2="${c.x+168*S}" y2="${c.y}"/>`;
  });
  stringsEl.innerHTML=strings;

  if(drag && drag.home) updateReturnRing();
  stepParticles(dt);
  requestAnimationFrame(frame);
}

/* ── Esittely (intro) ───────────────────────────────────────────────────
   A short guided demo on the real scale, not a game: no lives, points or
   clock, and the scale never breaks (it leans more the bigger the
   difference, and waits). Each step sets up the cups, asks one thing at the
   top and checks the answer. Kinds of steps:
     act   — the player does something on the scale; done() says when it's done
     ask   — answer tiles; a wrong number opens the box with that many
             diamonds, so the scale itself shows why it's wrong
     ghost — a ghost hand solves an equation while the player watches
   "basics" runs before level 1 and "balloons" before level 3, every time
   (nothing is remembered; "Ohita esittely" skips); the Esittely button
   replays them. */
const VIEW_FULL = "0 -145 1100 1215";            // the game's view, with the shelf
const VIEW_INTRO = "0 150 1100 920";             // without the shelf band, so the scale is bigger
const INTRO_TILT = 0.55*MAX_TILT;                // the most the scale leans in the intro
const nGems = n => n===1 ? "1 timantti" : `${n} timanttia`;
const nb = IntroKit.nb;               // equations in the texts don't break across lines
const box = (b=0, d=0, p=0) => ({b, d, p});
const isLevel = () => tiltSign()===0;
const aloneBox = c => c.b===1 && !c.d && !c.p;
const pureSide = c => !c.b && (!c.d || !c.p);
const solvedNow = () => isLevel() && ((aloneBox(cur.L) && pureSide(cur.R)) || (aloneBox(cur.R) && pureSide(cur.L)));
// pieces of the equations on the answer tiles
const TX = '<span class="xterm">x</span>', TPLUS = '<span class="op">+</span>', TEQ = '<span class="eq">=</span>';
const TC = n => `<span class="cterm">${n}</span>`;

const INTRO_STEPS = {
  basics: [
    { kind:"act", L:box(0,3), R:box(0,3),
      prompt:"Kummassakin kupissa on 3 timanttia, joten vaaka on tasapainossa: 3 = 3. Ota yksi timantti pois jommastakummasta kupista.",
      done:() => !isLevel(),
      ok:"Vaaka kallistui: kupit eivät enää paina yhtä paljon, eikä yhtälö enää päde." },
    { kind:"act", L:box(0,3), R:box(0,3),
      prompt:"Ota nyt yksi timantti pois kummastakin kupista.",
      tip:"Vaaka kallistui. Ota timantti myös toisesta kupista.",
      done:() => isLevel() && chain.length > 1,
      ok:"Vaaka pysyi tasapainossa! Kun kummastakin kupista otetaan sama määrä, yhtälö pätee edelleen. Pystyviivan perässä lukee, mitä kummallekin puolelle tehtiin." },
    { kind:"ask", x:3, L:box(1), R:box(0,3), chain:"after", reveal:true,
      prompt:"Laatikko ei itse paina mitään, mutta sen sisällä on timantteja. Montako timanttia laatikossa on?",
      tiles:[1,2,3,4],
      ok:"Oikein! Laatikon sisältöä merkitään kirjaimella x. Vaaka kertoo yhtälön x = 3." },
    { kind:"ask", x:3, L:box(2), R:box(0,6), chain:"after",
      prompt:"Kummassakin laatikossa on yhtä monta timanttia. Mikä yhtälö kuvaa vaakaa?",
      tiles:[
        {html:TX+TPLUS+TC(2)+TEQ+TC(6), why:"x + 2 tarkoittaisi yhtä laatikkoa ja kahta timanttia. Vasemmalla on kaksi laatikkoa."},
        {html:'<span class="xterm">2x</span>'+TEQ+TC(6), ok:true},
        {html:TX+TEQ+TC(6), why:"x = 6 tarkoittaisi, että vasemmalla on yksi laatikko. Niitä on kaksi."},
        {html:TC(2)+TEQ+'<span class="xterm">6x</span>', why:"Yhtälön vasen puoli kertoo vasemman kupin sisällön. 2 = 6x tarkoittaisi 2 timanttia vasemmalla ja 6 laatikkoa oikealla."} ],
      ok:"Oikein! Kaksi laatikkoa on x + x eli 2x, ja oikealla on 6 timanttia." },
    { kind:"ask", x:3, L:box(2), R:box(0,6), reveal:true,
      prompt:"Montako timanttia yhdessä laatikossa on?",
      tiles:[2,3,4,6],
      ok:"Oikein! 3 + 3 = 6, joten x = 3." },
    { kind:"ask", x:1, L:box(2), R:box(1,1), reveal:true, interactive:true,
      prompt:"Montako timanttia yhdessä laatikossa nyt on? Vinkki: voit ottaa laatikon pois kummastakin kupista.",
      tip:"Vaaka kallistui. Tee sama myös toiselle kupille.",
      tiles:[1,2,3,4],
      // answered right without solving it on the scale: the ghost hand shows how
      solveSay:"Oikein! Katso, mitä tapahtuu, kun laatikko otetaan pois kummastakin kupista.",
      solve:[["take","L","b"], ["take","R","b"], ["wait",900]],
      ok:"Laatikko jäi yksin: x = 1. Kun yhtälöä muuttaa samalla tavalla kummaltakin puolelta, vastauksen näkee suoraan." },
    { kind:"ghost", x:3, L:box(2,1), R:box(1,4),
      prompt:"Näin ratkaiset minkä tahansa yhtälön. Tavoite: yksi laatikko yksin toisessa kupissa.",
      script:[
        ["say","Ensin timantti pois kummastakin kupista."], ["take","L","d"], ["take","R","d"], ["wait",900],
        ["say","Sitten laatikko pois kummastakin kupista."], ["take","L","b"], ["take","R","b"], ["wait",1000],
        ["say","Laatikko on yksin. Avataan se…"], ["wait",600], ["reveal"], ["wait",400] ],
      ok:"x = 3. Juuri näin peli ratkaistaan: tee sama kummallekin kupille, kunnes laatikko on yksin." },
  ],
  balloons: [
    { kind:"act", L:box(0,1,1), R:box(), balloons:true,
      prompt:"Uusi esine: ilmapallo. Se nostaa kuppia yhden timantin verran, joten vaaka on tasapainossa: 1 − 1 = 0. Ota ilmapallo pois.",
      tip:"Kuppi nousi, koska siihen jäi vain ilmapallo. Paina ↺ Alusta ja ota ilmapallo.",
      done:() => cur.L.p===0 && cur.L.d===1,
      ok:"Kuppi painui alas! Ilmapallon poistaminen tekee kupista painavamman, ihan kuin siihen lisättäisiin timantti." },
    { kind:"act", L:box(0,3,1), R:box(0,3,1), balloons:true,
      prompt:"Ota nyt ilmapallo pois kummastakin kupista.",
      tip:"Vaaka kallistui. Ota ilmapallo myös toisesta kupista.",
      done:() => isLevel() && cur.L.p===0 && cur.R.p===0,
      ok:"Vaaka pysyi tasapainossa. Kumpikin puoli kasvoi yhdellä, joten merkintä on | +1." },
    { kind:"act", x:3, L:box(1,0,1), R:box(0,2), balloons:true, shelf:true, reveal:true,
      prompt:"Irrota ilmapallo vasemmasta kupista ja siirrä timantti hyllyltä oikeanpuolimmaiseen kuppiin tasapainon saavuttamiseksi.",
      tip:() => tiltSign()<0
        ? "Vasen kuppi painui. Tee oikeasta kupista yhtä paljon painavampi: lisää siihen timantti hyllyltä."
        : "Oikea kuppi painui. Tee vasemmasta kupista yhtä paljon painavampi.",
      done:solvedNow,
      ok:"Hyvä!" },
  ],
};

function startIntro(chapters, then, doneLabel){
  cancelDrag();
  intro = {chapters, steps:chapters.flatMap(c => INTRO_STEPS[c]), then, doneLabel, token:0, i:0, hand:null};
  document.body.classList.add("intro");
  ["introBar","introPrompt","introAnswers"].forEach(id => $(id).hidden = false);
  introStep(0);
}
function introStep(i){
  const st = intro.steps[i];
  Object.assign(intro, {i, step:st, done:false, busy:false, msg:"", cls:""});
  const tok = ++intro.token;                     // stops the scripts of the step before
  dragLayer.querySelectorAll(".ghost").forEach(n => n.remove()); intro.hand = null;
  svg.setAttribute("viewBox", st.shelf ? VIEW_FULL : VIEW_INTRO);
  startPuzzle({x:st.x ?? 1, L:{...st.L}, R:{...st.R}, par:0}, true);
  fitEqZone();
  intro.lock = !(st.kind==="act" || st.interactive);   // can the scale be touched?
  $("introPrompt").textContent = nb(st.prompt);
  $("eqzone").classList.toggle("veiled", st.chain==="after");
  IntroKit.progress($("introProgress"), intro.steps.length, i);
  renderTiles(st);
  if(st.kind==="ghost") runScript(st.script, tok).then(ok => {
    if(!ok) return;
    intro.done = true; say(st.ok, "good"); showNext(); if(motion) burst();
  });
}
// a number tile is a count of diamonds (yellow); the others are equations
function renderTiles(st){
  const list = (st.tiles || []).map(t => typeof t==="number" ? {n:t, ok:t===st.x, html:`${t}`, cls:"c"} : t);
  IntroKit.tiles($("introAnswers"), list, introAnswer);
}
function showNext(){
  const last = intro.i===intro.steps.length-1;
  IntroKit.next($("introAnswers"), last, () => last ? finishIntro() : introStep(intro.i+1));
}
function say(msg, cls=""){ intro.msg = nb(msg); intro.cls = cls; updateUI(); }
// the hint line in the intro: feedback, or what to do when the scale has tipped
function introHint(){
  const st = intro.step, hint = $("hint");
  let msg = intro.msg;
  const gone = chain[0].L.b + chain[0].R.b > 0 && !cur.L.b && !cur.R.b;
  if(!intro.done && gone) msg = "Laatikko lähti pois molemmista kupeista. Paina ↺ Alusta ja yritä uudestaan.";
  else if(!intro.done && !msg && st.tip && !isLevel() && !drag) msg = typeof st.tip==="function" ? st.tip() : st.tip;
  hint.textContent = msg || "";
  hint.classList.remove("warn"); hint.classList.toggle("good", intro.cls==="good" && msg===intro.msg);
}
// after every move the player makes
function introCheck(){
  const st = intro.step;
  if(intro.done) return;
  intro.msg = "";
  if(st.kind==="act" && st.done()){
    intro.done = true; intro.lock = true;
    if(st.reveal) revealBoxes();
    say(st.ok, "good"); showNext();
  } else updateUI();
}
async function introAnswer(tile, b){
  if(!intro || intro.busy || intro.done || drag) return;
  const st = intro.step, tok = intro.token;
  if(!tile.ok){
    b.disabled = true; b.classList.add("wrong");
    if(tile.n!=null) tryValue(tile.n, tok); else say(tile.why);
    return;
  }
  intro.done = true; intro.lock = true; intro.busy = true;
  b.classList.add("right");
  $("introAnswers").querySelectorAll("button").forEach(x => x.disabled = true);
  $("eqzone").classList.remove("veiled");
  if(st.solve && !solvedNow()){
    if(!sameState(cur, chain[0])) startPuzzle({x:st.x ?? 1, L:{...st.L}, R:{...st.R}, par:0}, true);   // tidy up first
    say(st.solveSay, "good");
    if(!await runScript(st.solve, tok)) return;
  }
  if(st.reveal) revealBoxes();
  intro.busy = false;
  say(st.ok, "good"); showNext();
}
// a wrong number: open the box(es) with that many diamonds and let the scale tip
async function tryValue(n, tok){
  intro.busy = true;
  const lock = intro.lock, real = puzzle.x;
  intro.lock = true; puzzle.x = n; revealBoxes();
  const wL = weight(cur.L), wR = weight(cur.R);
  say(`Jos laatikossa olisi ${nGems(n)}, vasemmassa kupissa olisi yhteensä ${nGems(wL)} ja oikeassa ${nGems(wR)}, joten vaaka kallistuisi. Kokeile toista vastausta.`);
  if(!await wait(2600, tok)) return;             // (the step was restarted meanwhile)
  puzzle.x = real; renderPan("L"); renderPan("R");
  intro.busy = false; intro.lock = lock;
}
function revealBoxes(){ ["L","R"].forEach(s => { if(cur[s].b) renderPan(s, true); }); }

function finishIntro(){
  intro.token++;
  showOverlay("introDone"); if(motion) burst();
}
function exitIntro(){
  const then = intro.then;
  intro.token++;
  dragLayer.querySelectorAll(".ghost").forEach(n => n.remove());
  intro = null;
  document.body.classList.remove("intro");
  ["introBar","introPrompt","introAnswers"].forEach(id => $(id).hidden = true);
  $("eqzone").classList.remove("veiled"); $("hint").classList.remove("good");
  svg.setAttribute("viewBox", VIEW_FULL);
  then();
  fitEqZone();
}

// the intro's scale: a spring towards a lean that grows with the difference
function introTilt(dt){
  const dw = weight(cur.L) - weight(cur.R);
  const target = dw===0 ? 0 : -Math.sign(dw) * INTRO_TILT * Math.min(1, 0.45 + 0.2*Math.abs(dw));
  tiltV += (-SWING_W*SWING_W*(tilt-target) - 2*SWING_Z*SWING_W*tiltV)*dt;
  tilt += tiltV*dt;
}

/* ghost hand: scripts of ["say", text] ["take", side, type] ["wait", ms] ["reveal"].
   Every await checks the step's token, so restarting or leaving the step stops it. */
const alive = tok => !!intro && intro.token===tok;
const {wait, tween} = IntroKit.timing(alive), ease = IntroKit.ease;
async function runScript(script, tok){
  for(const [op, a, b] of script){
    if(!alive(tok)) return false;
    if(op==="say"){ say(a); if(!await wait(1100, tok)) return false; }
    else if(op==="take"){ if(!await ghostTake(a, b, tok) || !await wait(250, tok)) return false; }
    else if(op==="wait"){ if(!await wait(a, tok)) return false; }
    else if(op==="reveal") revealBoxes();
  }
  hideHand();
  return alive(tok);
}
function moveHand(h, x, y){ h.x = x; h.y = y; h.g.setAttribute("transform", `translate(${x.toFixed(1)},${(y+8).toFixed(1)}) rotate(-14) scale(2.4)`); }
function hideHand(){
  const h = intro && intro.hand; if(!h) return;
  intro.hand = null; h.g.style.opacity = 0; setTimeout(() => h.g.remove(), 320);
}
// the hand takes the topmost item of type t out of a cup and lets it fall beside it
async function ghostTake(side, t, tok){
  const its = layout(cur[side]).filter(it => it.t===t);
  if(!its.length) return true;
  const it = its[its.length-1];
  const at = () => { const c = cupPos(side); return {x:c.x+it.x*S, y:c.y+it.y*S}; };
  let h = intro.hand;
  if(!h){
    const g = document.createElementNS(SVGNS, "g");
    g.setAttribute("class", "ghost ghost-hand"); g.innerHTML = `<path d="${IntroKit.HAND_PATH}"/>`;
    dragLayer.appendChild(g);
    h = intro.hand = {g}; moveHand(h, PIV.x, 1010);
  }
  const sx = h.x, sy = h.y;                       // glide to the item (its cup may be moving)
  if(!await tween(650, e => { const p = at(), k = ease(e); moveHand(h, sx+(p.x-sx)*k, sy+(p.y-sy)*k); }, tok)) return false;
  const p0 = at();
  cur[side][t]--; renderPan(side); updateUI();    // its weight comes off now, as when a player grabs it
  const g = makeHeld(t); g.classList.add("ghost"); dragLayer.appendChild(h.g);   // the hand on top
  const dir = side==="L" ? -1 : 1, x1 = Math.max(90, Math.min(1000, p0.x + dir*170)), y1 = p0.y - 260;
  let x = p0.x, y = p0.y;
  const ok = await tween(800, e => {
    const k = ease(e); x = p0.x+(x1-p0.x)*k; y = p0.y+(y1-p0.y)*k - Math.sin(Math.PI*k)*40;
    placeHeld(g, x, y, 1.15); moveHand(h, x, y);
  }, tok);
  g.remove();
  if(!ok) return false;
  dropToFloor(t, x, y, dir*120, 0); updateUI();
  return true;
}

/* ── other input ────────────────────────────────────────────────────── */
document.addEventListener("keydown",e=>{
  if($("overlay").classList.contains("show")) return;
  const k=e.key.toLowerCase();
  const map={a:["L","b"], s:["L","d"], d:["L","p"], k:["R","b"], l:["R","d"], j:["R","p"]};
  if(map[k] && (map[k][1]!=="p" || balloonsOn())) nudge(...map[k], e.shiftKey);
  else if(k==="r") intro ? introStep(intro.i) : restart();
});
$("restart").addEventListener("click",()=> intro ? introStep(intro.i) : restart());
/* testing (Vadim): typing "xyz", or the page opened with ?testi, shows a
   button that skips to the next level. Students never see it. */
const TEST_CODE="xyz"; let typed="";
const showTestTools=()=>{ $("skipLevel").hidden=false; };
if(new URLSearchParams(location.search).has("testi")) showTestTools();
document.addEventListener("keydown",e=>{ typed=(typed+e.key.toLowerCase()).slice(-TEST_CODE.length); if(typed===TEST_CODE) showTestTools(); });
$("skipLevel").addEventListener("click",()=>{
  if(intro || drag || status==="crash") return;
  if(level<MAX_LEVEL) nextLevel(); else showOverlay("complete");
});   // in the intro: the step from the start
$("introSkip").addEventListener("click",exitIntro);
// replay the intro mid-game; afterwards the same puzzle starts over, with its
// time and moves as they were (the intro's own time doesn't count)
$("introBtn").addEventListener("click",()=>{
  if(intro || status!=="play" || drag) return;
  const snap={level, score, lives, puzzle, moves, elapsed};
  startIntro(level>=BALLOON_LEVEL ? ["basics","balloons"] : ["basics"], ()=>{
    ({level, score, lives} = snap);
    startPuzzle(snap.puzzle, true); moves=snap.moves; elapsed=snap.elapsed; updateHud();
  }, "Jatka peliä");
});

fitEqZone();
newRun();                                              // the basics intro first
requestAnimationFrame(frame);
</script>
</body>
