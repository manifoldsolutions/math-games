<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yhtälösade</title>

<!-- ════════════════════════════════════════════════════════════════════
     GAME: Yhtälösade (equations fall, the player solves them in the air)
     Self-contained. Lives at  games/lukio/maa1-2/yhtalosade/index.html
     A Tetris-like well: brick walls and floor, equations falling (the next
     one comes when the previous is halfway down). Dragging an operation
     brick (+1 −1 +x −x, in the walls) onto one
     does that to both sides and uses one of the brick's count. A solved
     equation x = n turns into a bomb "n" that bounces like a ping-pong ball
     for a moment and then explodes: a positive one gives n back as counts
     (split at random between the bricks), a negative one clears trash around
     where it explodes (more for a bigger |n|), a zero one gives a new
     operation (+2, −2, +2x, −2x, a joker or ·(−1); new bricks come only this way,
     Vadim). An unsolved equation that lands stays as trash; trash up to the
     red line is Game Over.
     The equations get harder and come faster from the first to the last:
     bigger |x|, more operations needed. Near the end of a level, zero bombs
     bring the next level's bricks first. Level 2 keeps the counts, starts
     with an empty well and has :2 (some equations end with 2x = 2n) and ·2;
     near its end come contradictions (x + 3 = x + 5) for the ⚡. Level 3
     brings x² (x² + 2 = 11 → x² = 9 → √ → x = ±3, two bombs) and ±x²;
     ±2 and ±2x stay to the end. Every brick keeps its place on every level.
     Level 4 starts chapter 2 (Vadim): a fresh set of bricks (·2 :2 ·3 :3 ·4
     :4 ·x; ·(−1), √, the joker and ⚡ from zero bombs), the "metal" look, and
     only multiplying and dividing: 12/x = 3, x/4 = 4/x, 2x/3 = 4, and a
     quarter of the answers fractions (4x = 6 → x = 3/2). A positive fraction
     bomb fills a pie in the status row (a whole: +1 for every brick), a
     negative one shatters onto the tallest trash. Level 5 keeps
     them (not ·4 and :4) and adds ±1, ±x² and four bricks that rewrite a side: avaa,
     neliö, ab=0 (an equation splits in two) and 1/□. Level 6 keeps only
     ±1, :2, √, the joker and ⚡ and brings ∛, □², □³, 2^□ and log₂: x³ = −8,
     √x = 3, 2^(x + 1) = 8, log₂(x − 1) = 2. First draft, 6 levels: numbers
     are to be balanced (Vadim).
     ════════════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- shared site look: colours, fonts, header, buttons, dialogs -->
<link rel="stylesheet" href="../../../../assets/theme.css">
<!-- brackets (·(−1)): Chakra Petch's "(" looks like "[" -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600;700&display=swap" rel="stylesheet">

<style>
  /* Only what is specific to this game. Everything else comes from assets/theme.css. */
  body.game{ height:100dvh; overflow:hidden; }
  main{ flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; }
  .stage{ flex:1; min-height:0; width:100%; position:relative; padding:8px 16px 0; }

  /* the well: everything inside is positioned in px by layout() */
  #board{
    position:absolute; left:50%; top:8px; transform:translateX(-50%);
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #board > *{ position:absolute; }
  .wall, .floor{
    background:var(--surface-2); border:1px solid var(--line); border-radius:2px;
  }
  .dangerline{ height:0; border-top:2px dashed var(--red); opacity:.75; }
  /* chapter 2 (body.metal, theme.css; Vadim): walls and floor of iron bars, trash of rusty plates */
  .metal .wall, .metal .floor{
    border-radius:1px; border-color:var(--iron-dark);
    background:repeating-linear-gradient(90deg, var(--iron-dark) 0 2px, var(--iron) 2px 4px, var(--iron-hi) 4px 5px, var(--iron-shade) 5px 8px, var(--iron-dark) 8px 11px),
      linear-gradient(180deg, var(--iron-top), var(--iron-bottom));
    box-shadow:inset 0 2px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.7);
  }

  /* falling equation */
  .piece{
    display:flex; align-items:center; justify-content:center; white-space:nowrap;
    font-family:var(--math); font-weight:600;
    background:var(--surface); border:1px solid var(--accent); border-radius:var(--radius);
    box-shadow:0 0 10px rgba(0,229,255,.25);
    transition:width .15s ease, left .15s ease, box-shadow .12s ease;
  }
  .piece.target{ border-color:var(--magenta); box-shadow:0 0 16px rgba(255,61,242,.6); }
  .piece.hit{ animation:hit .35s ease; }
  @keyframes hit{ 50%{ transform:scale(1.06); } }
  .piece .eq{ margin:0 .25em; }
  .piece .op{ margin:0 .1em; }
  .mul{ display:inline-block; transform:scale(1.8); margin-right:.12em; }   /* the · of ·2 is tiny in Chakra Petch */
  .paren{ font-family:"IBM Plex Sans", sans-serif; }   /* Chakra Petch's "(" looks like "[" */
  /* level 5's bricks: a word (avaa, neliö, ab=0), and 1/□ with a drawn box */
  .opb .word{ font-family:var(--ui); font-size:.6em; font-weight:700; color:var(--ink); }
  .opb .box{ display:inline-block; width:.55em; height:.7em; border:.09em solid var(--ink); vertical-align:-.06em; margin-left:.04em; }
  /* level 6: 2 to a power (a real superscript), log with its 2 below */
  sup.ex{ font-size:.62em; vertical-align:.75em; line-height:0; margin-left:.03em; }
  .opb sup.ex .box{ width:.6em; height:.75em; }
  .fn{ color:var(--ink); }
  .fn sub{ font-size:.62em; vertical-align:-.3em; line-height:0; }
  /* a fraction (Vadim): the top over a bar over the bottom, the equation two rows tall */
  .frac{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.05; margin:0 .08em; }
  .frac .num{ padding:0 .12em .06em; border-bottom:.08em solid currentColor; }
  .frac .den{ padding-top:.06em; }
  /* solved: it glows in the colour of the bomb it becomes, with a burst of sparks */
  .piece.pos, .sparks.pos{ --fc:var(--gold); }
  .piece.neg, .sparks.neg{ --fc:var(--magenta); }
  .piece.zero, .sparks.zero{ --fc:var(--accent); }
  /* a contradiction blown up (Vadim: orange, the ⚡'s colour; red looked like "not allowed") */
  .piece.contra, .sparks.contra{ --fc:var(--orange); }
  .sparks.no{ --fc:var(--red); }   /* refused: √ of a negative number, the minus of x² = ±4 */
  .piece.zapped{ pointer-events:none; border-color:var(--orange); box-shadow:0 0 18px var(--orange);
                 animation:zapped .4s ease-out forwards; }   /* hit by the chain lightning */
  @keyframes zapped{ from{ filter:brightness(1.8); } to{ opacity:0; } }
  .piece.solved.pm{ border-color:var(--gold); box-shadow:-10px 0 18px var(--gold), 10px 0 18px var(--magenta); }   /* x = ±n */
  .root{ color:var(--ink); }
  .root.cb{ position:relative; margin-left:.12em; }   /* ∛ drawn as √ with a small 3: the font's ∛ is cramped */
  .root.cb i{ position:absolute; left:-.12em; top:.12em; font-style:normal; font-size:.45em; line-height:1; }
  .radicand{ display:inline-block; line-height:1.1; border-top:.08em solid var(--ink); padding:.06em .08em 0; margin-left:-.06em; }
  .zap{ display:inline-block; animation:zap .5s ease; }   /* √ bumps into a negative number */
  .zap *{ animation:zapc .5s ease; }
  @keyframes zap{ 35%{ transform:scale(1.5); } }
  @keyframes zapc{ 35%{ color:var(--red); text-shadow:0 0 10px var(--red); } }
  /* √ on x⁴ = 16 (Vadim): x² = ±4, then the minus of ± gets small red
     brackets and bursts away (x² ≥ 0), leaving x² = 4; timing in PM_T */
  .pmgo{ position:relative; display:inline-block; margin:0 .1em; }
  .pmgo .pm{ display:inline-block; animation:pmOut 1.4s forwards; }
  .pmgo .pm2{ position:absolute; left:50%; top:-.04em; transform:translateX(-50%);
              display:flex; flex-direction:column; align-items:center; line-height:.72; opacity:0; animation:pmIn 1.4s forwards; }
  .pmgo .pm2 i{ font-style:normal; font-size:.6em; color:var(--red); animation:pmBurst 1.4s forwards; }
  @keyframes pmOut{ 0%, 30%{ opacity:1; } 40%, 100%{ opacity:0; } }
  @keyframes pmIn{ 0%, 30%{ opacity:0; } 40%, 100%{ opacity:1; } }
  @keyframes pmBurst{ 0%, 68%{ opacity:1; transform:scale(1); } 82%, 100%{ opacity:0; transform:scale(2); } }
  .piece.solved{ border-color:var(--fc); box-shadow:0 0 18px var(--fc); }
  .piece.solved .txt{ text-shadow:0 0 8px var(--fc); }
  .sparks{ pointer-events:none; z-index:4; width:0; height:0; filter:drop-shadow(0 0 3px var(--fc)); }
  .sparks i{
    position:absolute; left:-2px; top:-2px; width:4px; height:4px; border-radius:50%;
    background:var(--fc); animation:spark .65s cubic-bezier(.2,.7,.4,1) both;
  }
  @keyframes spark{ to{ transform:translate(var(--dx), var(--dy)); opacity:0; } }

  /* the bomb a solved equation turns into: a ball in a ring of flames, in its
     own colour, the flames bigger for a bigger |n| (fireSize sets --f, --in) */
  .bomb{ z-index:3; pointer-events:none; }
  .bomb.pos{ --fc:var(--gold); }
  .bomb.neg{ --fc:var(--magenta); }
  .bomb.zero{ --fc:var(--accent); }
  .bomb .core{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:50%;
    font-family:var(--math); font-weight:700; background:var(--surface);
  }
  .bomb.pos .core{ border:2px solid var(--gold); color:var(--brown-ink); box-shadow:0 0 10px rgba(255,225,77,.6); }
  .bomb.neg .core{ border:2px solid var(--magenta); color:var(--magenta-ink); box-shadow:0 0 10px rgba(255,61,242,.65); }
  .bomb.zero .core{ border:2px solid var(--accent); color:var(--accent-ink); box-shadow:0 0 10px rgba(0,229,255,.6); }
  .bomb .fire{ position:absolute; left:50%; top:50%; width:var(--f); height:var(--f); transform:translate(-50%,-50%); }
  /* two layers of flame tongues turning opposite ways and flickering */
  .bomb .fire::before, .bomb .fire::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(closest-side, transparent calc(var(--in) - 8%), var(--fc) var(--in),
      color-mix(in srgb, var(--fc) 40%, transparent) calc(var(--in) + (100% - var(--in))*.45), transparent);
    -webkit-mask:repeating-conic-gradient(#000 0 10deg, #0000 18deg 26deg, #000 34deg 40deg);
            mask:repeating-conic-gradient(#000 0 10deg, #0000 18deg 26deg, #000 34deg 40deg);
    animation:spin 1.8s linear infinite, flicker .14s ease-in-out infinite alternate;
  }
  .bomb .fire::after{
    opacity:.7;
    -webkit-mask:repeating-conic-gradient(#000 0 7deg, #0000 13deg 20deg, #000 26deg 30deg);
            mask:repeating-conic-gradient(#000 0 7deg, #0000 13deg 20deg, #000 26deg 30deg);
    animation-duration:2.6s, .19s; animation-direction:reverse, alternate;
  }
  @keyframes spin{ to{ rotate:360deg; } }
  @keyframes flicker{ from{ scale:.93; } to{ scale:1.07; } }
  @media (prefers-reduced-motion: reduce){ .bomb .fire::before, .bomb .fire::after{ animation:none; } }

  /* a fraction bomb (Vadim): a pie around the ball, its lit slices the fraction, turning slowly */
  .bomb .pie{ position:absolute; left:calc(50% - var(--f)/2); top:calc(50% - var(--f)/2); width:var(--f); height:var(--f);
    overflow:visible; filter:drop-shadow(0 0 4px var(--fc)); animation:spin 7s linear infinite; }   /* no translate: it turns about its middle */
  .pie .lit, #pieSvg .lit{ fill:var(--fc); }
  .pie .off{ fill:color-mix(in srgb, var(--fc) 20%, transparent); }
  #pieSvg .off{ fill:color-mix(in srgb, var(--fc) 8%, transparent); }
  .bomb .core .frac{ font-size:.62em; line-height:1; }
  @media (prefers-reduced-motion: reduce){ .bomb .pie{ animation:none; } }
  /* the pie in the status row: positive fractions add up there, a whole bursts */
  #pieBox{ display:inline-flex; align-items:center; gap:6px; height:18px; --fc:var(--gold); }
  #pieBox[hidden]{ display:none; }
  #pieSvg{ width:22px; height:22px; overflow:visible; }
  #pieSvg .rim{ fill:none; stroke:var(--gold); stroke-width:4; }
  #pieText{ color:var(--brown-ink); font-family:var(--math); }
  #pieText .frac{ font-size:10px; line-height:1; }
  #pieBox.got #pieSvg{ animation:pieGot .45s ease; }
  #pieBox.burst #pieSvg{ animation:pieBurst .6s ease; }
  @keyframes pieGot{ 50%{ scale:1.35; } }
  @keyframes pieBurst{ 40%{ scale:1.9; filter:drop-shadow(0 0 10px var(--gold)); } }
  .note.piesum{ color:var(--brown-ink); }
  /* a negative fraction bomb's slices: the lit ones fly to the trash, the others fade */
  .shard{ pointer-events:none; z-index:5; background:var(--magenta); transform:translate(-50%,-50%) rotate(var(--a));
    clip-path:polygon(50% 0, 100% 100%, 0 100%);
    transition:left .35s cubic-bezier(.3,.1,.4,1), top .35s cubic-bezier(.3,.1,.4,1); }
  .shard.dud{ opacity:.35; }

  /* trash: single bricks, the equation's text faded on top while the block is whole */
  .trash{
    background:color-mix(in srgb, var(--muted) 22%, transparent);
    border:1px solid color-mix(in srgb, var(--muted) 45%, transparent); border-radius:2px;
    transition:top .3s ease-in, opacity .25s ease, transform .25s ease;
  }
  .trash.gone{ opacity:0; transform:scale(.3); }
  .metal .trash{
    border-color:var(--rust-edge);
    background:radial-gradient(circle at 26% 30%, var(--rust-hi) 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 72% 66%, var(--rust) 0 2.5px, transparent 4px),
      radial-gradient(circle at 18% 78%, var(--rust) 0 1.5px, transparent 3px),
      linear-gradient(155deg, var(--rust-plate-hi), var(--rust-plate));
  }
  .trashtext{
    display:flex; align-items:center; justify-content:center; white-space:nowrap; pointer-events:none;
    font-family:var(--math); font-weight:600; opacity:.35; filter:grayscale(1);
  }
  .trashtext .eq{ margin:0 .25em; }
  .trashtext .op{ margin:0 .1em; }

  /* operation bricks in the walls: label, count, battery bar */
  .opb{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:var(--surface); border:1px solid var(--accent); border-radius:var(--radius);
    box-shadow:0 0 8px rgba(0,229,255,.3); cursor:grab; font-family:var(--math); font-weight:700;
    transition:box-shadow .15s ease, opacity .15s ease;
  }
  .opb[hidden]{ display:none; }   /* not earned yet */
  .opb[data-op="*-1"] .lbl{ font-size:.82em; }   /* ·(−1) is wider than the others */
  .opb .cnt{ font-family:var(--ui); font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .opb .bat{ width:70%; height:5px; border:1px solid var(--line); border-radius:2px; overflow:hidden; }
  .opb .bat i{ display:block; height:100%; transition:width .25s ease, background-color .25s ease; }
  .opb.c3 .bat i{ background:var(--green); }   /* more than 2 */
  .opb.c2 .bat i{ background:var(--gold); }    /* 2 */
  .opb.c1 .bat i{ background:var(--red); }     /* 1 */
  .opb.c0{ border-color:var(--line); box-shadow:none; opacity:.5; cursor:default; }
  .opb.c0 .lbl{ filter:grayscale(1); }
  .opb.pulse{ animation:pulse .45s ease; }
  @keyframes pulse{ 50%{ box-shadow:0 0 18px rgba(57,255,158,.9); } }
  .lbl .xterm, .lbl .cterm, .lbl .pterm{ font-weight:700; }

  .ghost{ pointer-events:none; z-index:5; opacity:.92; transform:translate(-50%,-50%); }
  .ghost.touch{ transform:translate(-50%,-50%) scale(1.6); }
  /* a zero bomb's shot at the lowest equation */
  .shot{ pointer-events:none; z-index:5; transform:translate(-50%,-50%); border-radius:50%;
    background:var(--accent); box-shadow:0 0 12px 3px rgba(0,229,255,.7); }
  .note{
    pointer-events:none; z-index:4; font-family:var(--math); font-weight:600; white-space:nowrap;
    color:var(--accent-ink); animation:rise .9s ease-out forwards;
  }
  @keyframes rise{ to{ transform:translateY(-1.2em); opacity:0; } }
  .note.pts{ color:var(--ink); }   /* points */
  .ring{ pointer-events:none; border-radius:50%; border:3px solid; animation:boom .55s ease-out forwards; }
  .ring.pos{ border-color:var(--gold); }
  .ring.neg{ border-color:var(--magenta); }
  .ring.zero{ border-color:var(--accent); }
  .ring.contra{ border:6px solid var(--orange); }
  /* the contradiction's blowup: lightning, an orange flash over the well and a shake */
  .flash{ pointer-events:none; z-index:4; background:var(--orange); animation:flash .6s ease-out forwards; }
  .bolts{ pointer-events:none; z-index:5; overflow:visible; filter:drop-shadow(0 0 4px var(--orange));
          animation:bolts .3s linear forwards; }   /* one glow for all the bolts */
  .bolts polyline{ fill:none; stroke-linejoin:round; stroke-linecap:round; }
  .bolts .glow{ stroke:var(--orange); opacity:.75; }
  .bolts .core{ stroke:var(--orange-ink); }
  @keyframes bolts{ 0%, 30%{ opacity:1; } 40%{ opacity:.35; } 50%, 70%{ opacity:1; } 100%{ opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .bolts{ animation:none; } }
  @keyframes flash{ from{ opacity:.45; } to{ opacity:0; } }
  #board.shake{ animation:shake .45s ease; }
  @keyframes shake{
    20%{ transform:translateX(calc(-50% - 6px)); } 40%{ transform:translateX(calc(-50% + 5px)); }
    60%{ transform:translateX(calc(-50% - 3px)); } 80%{ transform:translateX(calc(-50% + 2px)); }
  }
  @media (prefers-reduced-motion: reduce){ #board.shake{ animation:none; } }
  .bolt{ width:.85em; height:1.3em; fill:var(--orange); vertical-align:-.25em; }
  @keyframes boom{ from{ transform:scale(.2); opacity:1; } to{ transform:scale(1); opacity:0; } }
  .fly{
    pointer-events:none; z-index:6; font-family:var(--math); font-weight:700; color:var(--brown-ink);
    text-shadow:0 0 8px rgba(255,225,77,.7); transform:translate(-50%,-50%);
    transition:left .7s cubic-bezier(.4,.1,.3,1), top .7s cubic-bezier(.4,.1,.3,1);
  }
  #pauseOv h2{ margin-bottom:24px; }
  .win .result{ margin-bottom:18px; }   /* no message under it (Vadim: no explanations for now) */
  /* the speed: a slider with three stops whose labels can be tapped too */
  .speedpick{ margin:4px 0 22px; }
  .speedpick input{ width:100%; margin:0; accent-color:var(--accent); cursor:pointer; }
  .speedlabels{ display:flex; justify-content:space-between; margin-top:6px; }
  .speedlabels button{
    background:none; border:none; padding:8px 4px; font:inherit; font-family:var(--ui); font-weight:600;
    color:var(--muted); cursor:pointer;
  }
  .speedlabels button.on{ color:var(--accent-ink); }
  .speedlabels button:focus-visible{ outline:2px solid var(--magenta); outline-offset:2px; }
  .speedmult{ color:var(--muted); font-family:var(--ui); font-size:14px; }
</style>
</head>
<body class="game">

  <header>
    <a class="back" href="../../../../#/lukio/maa1-2">← Takaisin</a>
    <span class="title">Yhtälösade</span>
    <span class="hud"><span>Taso: <b id="level">1/3</b></span><span>Pisteet: <b id="score">0</b></span></span>
  </header>

  <main>
    <div class="statusrow">
      <span>Yhtälö: <b id="eqNo">0/30</b></span>

      <span id="pieBox" hidden title="Murtolukupiirakka"><svg id="pieSvg" viewBox="-50 -50 100 100" aria-hidden="true"></svg><b id="pieText"></b></span>

    <div class="subctrl">

      <button id="restart">↺ Alusta</button>

        <button class="primary" id="again">Pelaa uudestaan</button>

  <div class="overlay" id="pauseOv">
    <div class="win" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
      <h2 id="pauseTitle">Peli on tauolla</h2>
      <div class="btns">
        <button class="primary" id="resume">Jatka peliä</button>
        <a href="../../../../#/lukio/maa1-2">Valikkoon</a>
      </div>

<script>
"use strict";
/* ── settings (first draft: to be balanced) ─────────────────────────────── */
const COLS = 9;                 // field columns between the walls
const WALL = 1.5;               // wall width in cells (the operation bricks sit in them)
const EQUATIONS = 30;           // equations per level
// Levels (Vadim): the next one goes on with the trash, the counts and the
// operations left by the previous one. Every level has LEVEL's settings
// unless it says otherwise (Vadim: the same for all levels for now). The fall
// comes from the speed the player chose (SPEEDS); gap: seconds from one
// equation to the next at the fall REF_FALL, [after the first, before the
// last], shrinking linearly (Vadim, `wantSpawn`; on a 19-row phone well that

  for(let x = 0; x <= COLS - w; x++)
    if(inAir().every(q => x + w <= q.x0 || x >= q.x0 + q.w)) ok.push(x);
  return ok.length ? pick(ok) : rnd(0, COLS - w);
}
// width in whole cells from the text (the font scales with the cell, so this stays put)
function measure(p){
  const el = p.el;
  el.style.fontSize = cell*.56 + "px";
  el.innerHTML = `<span class="txt">${eqHTML(p.L, p.R)}</span>`;
  let tw = el.firstChild.offsetWidth/cell + .7;
  if(tw > COLS){ el.style.fontSize = cell*.56*COLS/tw + "px"; tw = COLS; }
  p.w = Math.max(3, Math.min(COLS, Math.ceil(tw)));
}
// (only width and left are animated, so the fall itself is set straight every frame)
function drawPiece(p){
  const el = p.el;
  if(p.bomb == null) place(el, X(p.x0), Y(p.y - ht(p)), p.w*cell, ht(p)*cell);
  else{ const d = 2*BOMB_R*cell; place(el, X(p.bx) - d/2, Y(p.by) - d/2, d, d); }
}
function sizeBomb(p){
  const k = isFrac(p.bomb) ? PIE_SIZE : fireSize(p.bomb);
  p.el.style.fontSize = cell*.46 + "px";
  p.el.style.setProperty("--f", k*100 + "%");
  p.el.style.setProperty("--in", 100/k + "%");
}
function surface(c0, c1){
  let s = ROWS;
  for(const b of bricks) if(b.c >= c0 && b.c <= c1 && b.r < s) s = b.r;
  return s;
}

// operation key on equation p, dropped at x (cells from the left wall); the
// joker writes the answer straight away (x on the side that had more x)
function applyOp(key, p, x){
  if(!p || p.bomb != null || p.glow != null || over || paused || counts[key] <= 0) return false;
  const o = OPS[key];
  if(!p.avail) p.avail = {...counts};   // what the player had when they started on it
  counts[key]--; drawCount(key);
  p.ops++; p.steps += STEPS[key] || 1; p.used[key] = (p.used[key] || 0) + 1;
  if(o.joker) p.joker = true;
  // the ⚡ works only on a contradiction and the joker only on an equation
  // that has a solution; otherwise the brick is wasted (Vadim). √ always works
  // (Vadim), except on a negative number: x² = n² gives x = ±n, x⁴ = n⁴ gives
  // x² = n², anything else gets √ on both sides (x² + 1 = 2 → √(x² + 1) = √2)
  // and can't be solved any more: no brick squares.
  const r = o.sqrt ? rootOf(p) : null, bq = o.sqrt && r == null ? binRoot(p) : null;
  const rooted = o.sqrt && r == null && !bq && [sqrtSide(p.L), sqrtSide(p.R)];
  if(o.contra || o.joker && p.contra || rooted && !(rooted[0] && rooted[1])){
    if(o.contra && p.contra) contraNow(p, x);
    else if(o.sqrt) fizzle(p, rooted[0] ? 1 : 0);
    else{ p.el.classList.remove("hit"); p.el.offsetWidth; p.el.classList.add("hit"); }
    return true;
  }
  for(const s of [p.L, p.R]) delete s.pmGone;
  let split = null;   // the zero-product rule's second equation, [sides, answer]
  if(o.joker) split = jokerAnswer(p);
  else if(o.sqrt){ if(r != null) writeAnswer(p, r); else if(bq) [p.L, p.R] = bq; else{ [p.L, p.R] = rooted; dropMinus(p); } }
  else if(o.times){   // :2 of odd numbers gives fractions, and ±1 can't take them away (Vadim)
    p.L = timesSide(p.L, o.times); p.R = timesSide(p.R, o.times);
  }
  else if(o.open || o.sqr){   // avaa sulut, neliöksi (level 5): where no side changes the brick is wasted
    const A = o.open ? openSide(p.L) : squareSide(p.L), B = o.open ? openSide(p.R) : squareSide(p.R);
    if(!A && !B){ p.el.classList.remove("hit"); p.el.offsetWidth; p.el.classList.add("hit"); return true; }
    p.L = A || p.L; p.R = B || p.R;
  }
  else if(o.rec){   // 1/□ (level 5); 1/0 is refused like √ of a negative number
    const A = recSide(p.L), B = recSide(p.R);
    if(!A || !B){ fizzle(p, A ? 1 : 0); return true; }
    p.L = A; p.R = B;
  }
  else if(o.zp){   // ab = 0 (level 5): the first part stays, the second falls beside it
    const parts = zpParts(p);
    if(!parts){ p.el.classList.remove("hit"); p.el.offsetWidth; p.el.classList.add("hit"); return true; }
    const root = ([L, R]) => { const u = R.a ? R : L; return -u.b/u.a; };
    [p.L, p.R] = parts[0]; p.n = root(parts[0]); p.deg = 0; p.zp = null;
    p.make = {kb:0, kq:0, k:0, div:0, deg:0};   // what is left: a plain equation (toGo)
    if(parts[1]) split = [parts[1], root(parts[1])];
  }
  else if(o.cbrt){ p.L = cbrtSide(p.L); p.R = cbrtSide(p.R); }   // ∛ (level 6) always works
  else if(o.power){   // □², □³ (level 6); where a side can't be written that way the brick is wasted
    const A = powerSide(p.L, o.power), B = powerSide(p.R, o.power);
    if(!A || !B){ p.el.classList.remove("hit"); p.el.offsetWidth; p.el.classList.add("hit"); return true; }
    p.L = A; p.R = B;
  }
  else if(o.exp2){ p.L = exp2Side(p.L); p.R = exp2Side(p.R); }   // 2^□ always works
  else if(o.log2){   // log₂: a number ≤ 0 is refused like √ of a negative number
    const A = log2Side(p.L), B = log2Side(p.R);
    if(!A || !B){ fizzle(p, A ? 1 : 0); return true; }
    p.L = A; p.R = B;
  }
  else if(o.timesX){   // ·x (level 4); where a side can't take it the brick is wasted
    const A = timesX(p.L), B = timesX(p.R);
    if(!A || !B){ p.el.classList.remove("hit"); p.el.offsetWidth; p.el.classList.add("hit"); return true; }
    p.L = A; p.R = B;
  }
  else{
    const add = s => ({...s, q:(s.q || 0) + (o.q || 0), a:s.a + o.a, b:s.b + o.b});
    p.L = add(p.L); p.R = add(p.R);
  }
  const pm = pmAnswer(p);   // 4 = ±x: x = ±4
  if(pm != null){ const xs = {a:1, b:0}, ns = {...numSide(pm), pm:pm !== 0}; [p.L, p.R] = p.L.pa ? [xs, ns] : [ns, xs]; }
  const mid = redraw(p);
  note(`| ${OP_NOTE[key]}`, X(mid), Y(p.y - ht(p)));
  if(split) spawnChild(p, split[0], split[1]);
  const two = pnAnswers(p), v = two ? null : solvedValue(p.L, p.R);
  if(!p.contra && (two || v != null)) solvedNow(p, v, x, two);   // a contradiction never (√x = −3 → □² → x = 9 is false)
  return true;
}
// the joker's way (and a zero bomb's shot, and √ with its root r): x on the
// side that had the most x (x⁴ before x² before x), the answer on the other,
// ± for a square
function writeAnswer(p, r = p.n){
  const k = p.make && p.make.bin ? p.make.k : null;   // (x + k)² = n²: x = ±n − k
  const xs = {a:1, b:0}, ns = k != null ? {a:0, b:-k, ...(r && {pn:r})} : {...numSide(r), pm:p.deg > 0 && r !== 0};
  const w = s => 1e4*(s.p4 || 0) + 100*(s.q || 0) + s.a + 10*!!s.bin;
  [p.L, p.R] = w(p.L) > w(p.R) ? [xs, ns] : [ns, xs];
}
// (x + k)² = n² (Vadim): √ gives x + k = ±n, or x + k = 0 for n = 0; else null
function binRoot(p){
  const pure = s => s.bin && (s.bc ?? 1) === 1 && ![s.p4, s.q, s.a, s.b, s.pa, s.root, s.fd, s.pn].some(Boolean);
  const [U, V] = pure(p.L) ? [p.L, p.R] : [p.R, p.L];
  if(!pure(U) || !plain(V) || V.b < 0 || !Number.isInteger(Math.sqrt(V.b))) return null;
  const n = Math.sqrt(V.b), I = {...U.bin}, N = n ? {a:0, b:0, pn:n} : {a:0, b:0};
  return U === p.L ? [I, N] : [N, I];
}
// x = ±n + c (x + 1 = ±2 after −1: x = ±2 − 1): its two answers, else null
function pnAnswers(p){
  const pnOnly = s => s.pn && !s.a && !s.q && !s.p4 && !s.p3 && !s.m && !s.root && !s.pa && !s.fd && !s.bin && !s.rec && !s.fac && !s.ex && !s.lg && !s.cr;
  const [U, V] = pnOnly(p.L) ? [p.R, p.L] : [p.L, p.R];
  return pnOnly(V) && bare(U, "a") ? [V.b + V.pn, V.b - V.pn] : null;
}
// x² = c with c ≥ 0 a square (either way round): √c, else null
function rootOf(p){   // x² = ¼ → ½ too (Vadim)
  const [U, V] = bare(p.L, "q") ? [p.L, p.R] : [p.R, p.L], v = numVal(V);
  if(!bare(U, "q") || v == null || v < 0) return null;
  const [a, b] = ratio(v).map(Math.sqrt);
  return Number.isInteger(a) && Number.isInteger(b) ? a/b : null;
}
// one side exactly ±x and the other a number (4 = ±x): that number's size, else null
function pmAnswer(p){
  const pmx = s => s.pa === 1 && !s.pr && !s.p4 && !s.p3 && !s.q && !s.a && !s.b && !s.m && !s.root && !s.fd && !s.bin && !s.pn && !s.rec && !s.fac && !s.ex && !s.lg && !s.cr;
  const [U, V] = pmx(p.L) ? [p.L, p.R] : [p.R, p.L];
  const v = pmx(U) ? numVal(V) : null;   // ½ = ±x too
  return v != null ? Math.abs(v) : null;
}
// √ of one side: a number's root (a whole one if it is a square), √(x⁴) = x²,
// √(k·x²) = ±√k·x (Vadim: 64 = 4x² → 8 = ±2x, then :2), else √( … ); null
// for a negative number, or a side with ±x (it may be negative)
function sqrtSide(s){
  if(s.pa || s.pn || s.f && s.f.pa) return null;
  if(numVal(s) != null){   // ¼ → ½ (Vadim); a negative one is refused
    const v = numVal(s), [a, b] = ratio(v).map(u => Math.sqrt(Math.abs(u)));
    return v < 0 ? null : Number.isInteger(a) && Number.isInteger(b) ? numSide(a/b) : {a:0, b:0, root:s};
  }
  if(s.fd){   // x² or x⁴ alone over a square (Vadim): x²/4 → ±x/2, x⁴/4 → x²/2, then ·2; any other fraction gets √ around it
    const f = s.f, d = Math.sqrt(s.fd);
    if(f.p4 > 0 && !f.q && !f.a && !f.b && !f.root && !s.p4 && !s.q && !s.a && !s.b && !s.root && Number.isInteger(d) && Number.isInteger(Math.sqrt(f.p4)*1024))
      return {a:0, b:0, f:{q:Math.sqrt(f.p4)}, fd:d};   // x⁴/4 → x²/2 (no ±: x² ≥ 0)
    if(!(f.q > 0 && !f.p4 && !f.a && !f.b && !f.root && !s.p4 && !s.q && !s.a && !s.b && !s.root && Number.isInteger(d))) return {a:0, b:0, root:s};
    const r = Math.sqrt(f.q);
    return {a:0, b:0, f:Number.isInteger(r*1024) ? {pa:r} : {pa:1, pr:f.q}, fd:d};
  }
  if(s.q > 0 && !s.p4 && !s.a && !s.b && !s.root){
    const r = Math.sqrt(s.q);   // 4 → 2; 2 → √2 (pr), which no brick takes away
    return Number.isInteger(r*1024) ? {a:0, b:0, pa:r} : {a:0, b:0, pa:1, pr:s.q};
  }
  if(s.root && s.rc < 0 && !s.p4 && !s.q && !s.a && s.b <= 0) return null;   // −√2 − 1: negative too
  if(plain(s)){
    if(s.b < 0) return null;
    const r = Math.sqrt(s.b);
    return Number.isInteger(r) ? {a:0, b:r} : {a:0, b:0, root:{a:0, b:s.b}};
  }
  if(s.p4 > 0 && !s.q && !s.a && !s.b && !s.root){   // √(k·x⁴) = √k·x², no ± (x² ≥ 0): x⁴ → x², 4x⁴ → 2x²
    const r = Math.sqrt(s.p4);
    if(Number.isInteger(r*1024)) return {q:r, a:0, b:0};
  }
  return {a:0, b:0, root:s};
}
// After √ on x⁴ = 16 (Vadim): x² = ±4 at first, then the minus of ± gets
// small red brackets and bursts away, because x² ≥ 0: x² = 4 (PM_T). The
// equation keeps working meanwhile; any operation on it ends the show.
function dropMinus(p){
  const [U, V] = bare(p.L, "q") ? [p.L, p.R] : [p.R, p.L];
  if(!bare(U, "q") || !plain(V) || V.b <= 0) return;
  V.pmGone = true;
  const on = () => V.pmGone && pieces.includes(p) && p.bomb == null && (p.L === V || p.R === V);
  setTimeout(() => {
    const m = on() && p.el.querySelector(".pmgo i");
    if(!m) return;
    const r = m.getBoundingClientRect(), b = board.getBoundingClientRect();
    sparks(r.left - b.left + r.width/2, r.top - b.top + r.height/2, "no");
  }, PM_T[0]*1000);
  setTimeout(() => { if(on()){ delete V.pmGone; redraw(p, false); } }, PM_T[1]*1000);
}
// √ on a negative number, or on ±x (Vadim): the root bumps into that side (i),
// it flashes red, and the root bursts in red sparks there; the brick is wasted
function fizzle(p, i){
  const side = p.el.querySelectorAll(".side")[i];
  const r = side.getBoundingClientRect(), b = board.getBoundingClientRect();
  side.classList.remove("zap"); side.offsetWidth; side.classList.add("zap");
  sparks(r.left - b.left + r.width/2, r.top - b.top + r.height/2, "no");
}
// after a change: new width, the same middle (in whole columns), a bump
// unless quiet; the middle
function redraw(p, bump = true){
  const mid = p.x0 + p.w/2;
  measure(p);
  p.x0 = Math.max(0, Math.min(COLS - p.w, Math.round(mid - p.w/2)));
  drawPiece(p);
  if(bump){ p.el.classList.remove("hit"); p.el.offsetWidth; p.el.classList.add("hit"); }
  return mid;
}
/* A zero bomb may also shoot down the lowest equation in the air (Vadim): with
   the level's chance `shoot`, growing from its first equation to its last. A
   cyan shot flies to it (one not already aimed at by a shot) and solves it as
   a joker would: 100 points, no perfect bonus, and its own bomb. A
   contradiction blows up instead, as with the ⚡ (a cascade, Vadim). */
function shootLowest(x, y, from){
  const aimed = new Set(flights.filter(f => f.shot).map(f => f.p));
  const list = inAir().filter(q => !aimed.has(q));
  if(!list.length) return;
  const p = list.reduce((a, b) => b.y > a.y ? b : a);
  const g = document.createElement("div"); g.className = "shot";
  g.style.width = g.style.height = cell*.45 + "px";
  board.appendChild(g); place(g, x, y);
  launch({g, p, x:from, shot:true}, {x, y});
}
function shotDown(p, from){
  if(!pieces.includes(p) || p.bomb != null || p.glow != null || over) return;
  if(p.contra){ contraNow(p, from); return; }   // the blowup, as with the ⚡
  p.joker = true;
  const split = jokerAnswer(p); redraw(p);
  if(split) spawnChild(p, split[0], split[1]);
  const two = pnAnswers(p);
  solvedNow(p, two ? null : solvedValue(p.L, p.R), from, two);
}
const sign = v => v > 0 ? "pos" : v < 0 ? "neg" : "zero";
// Solved: it locks, glows in its bomb's colour with a burst of sparks for GLOW
// seconds (still falling, the fall never slows) and then turns into the bomb.
// Without a joker (Vadim): in the fewest throws there could be it is perfect
// (PERFECT points), else with no more steps than needed it is neat (NEAT).
function solvedNow(p, v, from, two = null){
  p.glow = 0; p.answer = v; p.two = two; p.from = from; p.pm = !!two || !!(p.L.pm || p.R.pm);
  p.el.classList.remove("target");
  p.el.classList.add("solved", p.pm ? "pm" : sign(v));
  const x = X(p.x0 + p.w/2), y = Y(p.y - ht(p)/2);
  if(p.pm){ sparks(x, y, "pos"); sparks(x, y, "neg"); }
  else sparks(x, y, sign(v));
  if(p.child){ points("split", POINTS, `+${pt(POINTS)}`, x, Y(p.y) + cell*.9); return; }   // a zero-product rule's second part
  solved++; $("solved").textContent = solved;
  const perfect = !p.joker && p.ops <= fewestThrows(p), neat = !p.joker && !perfect && p.steps <= p.par;
  points("solve", POINTS, null, 0, 0);
  if(perfect){ pts.perfects++; points("perfect", PERFECT, null, 0, 0); }
  if(neat){ pts.neats++; points("neat", NEAT, null, 0, 0); }
  note(perfect ? `Täydellinen! +${pt(POINTS + PERFECT)}` : neat ? `Siisti! +${pt(POINTS + NEAT)}` : `+${pt(POINTS)}`, x, Y(p.y) + cell*.9, "pts");
}
// The fewest throws that solve p's equation as it came (Vadim): ±2 and ±2x
// do two steps in one, if the player had them when they started on it (or
// used them on it: a brick may come meanwhile). Built from how it was made,
// not by a search of moves: each kind (x, number, x²) is taken off in parts
// before, between and after the halvings (Vadim: 2x + 2 = 4 → :2 → −1 is
// two throws; 4x + 6 = 46 → :2, −1, :2, −1), the cheapest split counts.
// Checked offline against a search of all throws.
function fewestThrows(p){
  if(p.fewest != null){   // levels 4–6: from the recipe; without ·4 (or :4) 4x = 12 takes :2 twice
    const f = p.make && p.make.four;
    return f && !((p.avail || {})[f] > 0) && !p.used[f] ? p.fewest + 1 : p.fewest;
  }
  const a = {...p.avail}, e = p.make;
  for(const [key, n] of Object.entries(p.used)) a[key] = Math.max(a[key] || 0, n);
  return split(-e.kb, e.div, a, "+x", "-x", "+2x", "-2x") + split(-e.k, e.div, a, "+1", "-1", "+2", "-2")
       + split(-(e.kq || 0), e.div, a, "+x2", "-x2") + e.div + (e.mul || 0) + e.deg/2;
}
// v taken off in d + 1 parts around d halvings, v = r0 + 2·r1 + 4·r2 …
// (before a halving what is left must be even): the fewest bricks for the
// cheapest split, the parts sharing the bricks
function split(v, d, a, one, minus, two, minusTwo){
  let best = Infinity;
  d = +d || 0;   // halvings, a number (a flag in old saves of p.make)
  const go = (rest, i, parts) => {
    if(i === d){ best = Math.min(best, throws([...parts, rest], a, one, minus, two, minusTwo)); return; }
    for(let r = rest - 4; r <= rest + 4; r++) if((rest - r) % 2 === 0) go((rest - r)/2, i + 1, [...parts, r]);
  };
  go(v, 0, []);
  return best;
}
// the fewest bricks of size 1 (one, minus) and 2 (two, minusTwo) that make
// each of the amounts vs, at most a[key] of each in all
function throws(vs, a, one, minus, two, minusTwo){
  let best = Infinity;
  const go = (i, U, M, P, N, n) => {   // twos, minus twos, ones, minus ones so far; n bricks
    if(n >= best) return;
    if(i === vs.length){ best = n; return; }
    for(let u = 0; u <= 2 && U + u <= (a[two] || 0); u++) for(let m = 0; m <= 2 && M + m <= (a[minusTwo] || 0); m++){
      const r = vs[i] - 2*(u - m), q = Math.max(r, 0), s = Math.max(-r, 0);
      if(P + q <= (a[one] || 0) && N + s <= (a[minus] || 0)) go(i + 1, U + u, M + m, P + q, N + s, n + u + m + q + s);
    }
  };
  go(0, 0, 0, 0, 0, 0);
  return best;
}
/* A contradiction blown up with the ⚡ (Vadim), in orange: lightning strikes
   it from the top of the well, and it glows with crackling sparks for GLOW
   seconds (it counts as solved, 100 points: "no solution" is its solution),
   then blows up at once (blowUp): lightning jumps from it to every equation
   still falling unsolved, and they go, without becoming bombs, for 100 points
   each. Glowing ones, bombs and the trash stay; bricks flying to the ones
   that went come back. An orange flash over the well, a big ring and a
   shake. */
function contraNow(p, from){
  p.glow = 0; p.blast = true; p.from = from;
  p.el.classList.remove("target");
  p.el.classList.add("solved", "contra");
  const x = X(p.x0 + p.w/2), y = Y(p.y - ht(p)/2);
  bolts([[x + (Math.random() - .5)*cell*2, 0, x, y]], 250);
  sparks(x, y, "contra");
  setTimeout(() => { if(pieces.includes(p)) sparks(X(p.x0 + p.w/2), Y(p.y - ht(p)/2), "contra"); }, GLOW*500);
  solved++; $("solved").textContent = solved;
  points("solve", POINTS, null, 0, 0);
  note(`+${pt(POINTS)}`, x, Y(p.y) + cell*.9, "pts");
}
function blowUp(p){
  const x = X(p.x0 + p.w/2), y = Y(p.y - ht(p)/2);
  p.el.remove(); pieces.splice(pieces.indexOf(p), 1);
  const hit = inAir();
  bolts(hit.map(q => [x, y, X(q.x0 + q.w/2), Y(q.y - ht(q)/2)]), 350);
  for(const q of hit){
    const ghost = q.el.cloneNode(true);   // the equation flashes and fades where it was hit
    ghost.classList.remove("target"); ghost.classList.add("zapped");
    board.appendChild(ghost); setTimeout(() => ghost.remove(), 400);
    sparks(X(q.x0 + q.w/2), Y(q.y - ht(q)/2), "contra");
    q.el.remove(); pieces.splice(pieces.indexOf(q), 1);
  }
  pts.destroyed += hit.length;
  if(hit.length) points("blast", POINTS*hit.length, `+${pt(POINTS*hit.length)}`, x, y);
  ring("contra", x, y, COLS*cell*.8);
  if(reduced()) return;   // no flash, no shake
  const fl = document.createElement("div"); fl.className = "flash";
  board.appendChild(fl); place(fl, X(0), 0, COLS*cell, ROWS*cell);
  setTimeout(() => fl.remove(), 600);

/* ── a bomb bounces like a ping-pong ball ───────────────────────────────────

const REST = .8;                // rows/s: a slower touch doesn't bounce, the ball rolls

  const R = BOMB_R;

  const h = dt/steps;

    const qx = Math.max(x0, Math.min(x1, p.bx)), qy = Math.max(y0, Math.min(y1, p.by));
    const dx = p.bx - qx, dy = p.by - qy, d = Math.hypot(dx, dy);
    if(d >= R) return;

    p.bx += p.vx*h; p.by += p.vy*h;

    if(p.bx > COLS - R){ p.bx = COLS - R; if(p.vx > 0) p.vx = -p.vx*BOUNCE; }

  if(p.touched != null) p.touched += dt;

/* ── landing ────────────────────────────────────────────────────────────── */

function addBrick(r, c, block){

function fly(key, html, a, x, y){
  const el = document.createElement("div"); el.className = "fly"; el.innerHTML = html;
  el.style.fontSize = cell*.6 + "px";
  board.appendChild(el); place(el, x, y);
  const t = opCenter(key);
  requestAnimationFrame(() => requestAnimationFrame(() => place(el, t.x, t.y)));
  const game = gameNo; busy++;
  setTimeout(() => {
    el.remove();
    if(game !== gameNo) return;
    busy--;
    const fit = Math.min(a, capOf(key) - counts[key]);
    if(fit < a) points("spare", SPARE_POINTS*(a - fit), null, 0, 0);
    counts[key] += fit; own(key); drawCount(key);
    const b = opEls[key];
    b.classList.remove("pulse"); b.offsetWidth; b.classList.add("pulse");

/* ── dragging an operation onto the piece ───────────────────────────────── */
function boardXY(e){
  const r = board.getBoundingClientRect();
  return {x:e.clientX - r.left, y:e.clientY - r.top};
}
/* Where a swipe that pulls an equation down starts (and a double tap): every
   falling equation has a rectangle, AREA of the interior width (between the
   walls) wide and AREA_TALL times that tall, centred on the interior across
   and on the equation up and down. When the equation is nearer a wall than
   AREA_EDGE of the width, the rectangle moves so that its edge is the
   equation's edge. A point goes to the equation nearest to it (distance to
   the equation), if it is in that equation's rectangle (Vadim). Cells, x from
   the left wall, y rows from the top; the rectangle stays inside the
   interior. (Operations used to land by the same rule.) */
const inAir = () => pieces.filter(p => p.bomb == null && p.glow == null);   // equations that take operations
function dropArea(p){
  const s = AREA*COLS, e = AREA_EDGE*COLS, x1 = p.x0 + p.w;
  let l = (COLS - s)/2, r = l + s;
  if(p.w > s){ l = p.x0; r = x1; }
  else if(p.x0 < e){ l = p.x0; r = l + s; }
  else if(x1 > COLS - e){ r = x1; l = r - s; }
  const m = p.y - ht(p)/2, h = AREA_TALL*(r - l);
  return {l, r, t:Math.max(0, m - h/2), b:Math.min(ROWS, m + h/2)};
}
function targetAt(pt){
  const x = pt.x/cell - WALL, y = pt.y/cell;
  let best = null, bd = Infinity;
  for(const p of inAir()){
    const dx = Math.max(p.x0 - x, 0, x - p.x0 - p.w), dy = Math.max(p.y - ht(p) - y, 0, y - p.y);
    const d = Math.hypot(dx, dy);
    if(d < bd){ best = p; bd = d; }
  }
  if(!best) return null;
  const a = dropArea(best);
  return x >= a.l && x <= a.r && y >= a.t && y <= a.b ? best : null;
}
/* Throwing (Vadim), the same for every brick, by the direction of the swipe.
   The held brick is centred on the finger, so its middle is the finger; the
   game keeps where the finger was (drag.trail, cells, ms). A flick is its
   move over the last FLICK_T s: at least FLICK_MIN cells and FLICK cells/s.
   Let go with a flick, the brick goes along it: to the equation the line
   from that point passes through (boxes MISS bigger all round; the first
   one along the line), else to the one with the smallest angle off the line
   up to AIM_MAX. Let go without one (dragged slowly, or stopped first), it
   lands on the equation it is on. Anything else (a tap, put back, a flick
   away from every equation) flies back to its slot. The player may first
   drag the brick anywhere and then flick it. */
function flick(now){
  const tr = drag.trail, end = tr[tr.length - 1];
  const base = tr.find(q => now - q.t <= FLICK_T*1000);
  if(!base || base === end) return null;
  const dx = end.x - base.x, dy = end.y - base.y, d = Math.hypot(dx, dy);
  if(d < FLICK_MIN || d/Math.max(.016, (now - base.t)/1000) < FLICK) return null;
  return {x:dx/d, y:dy/d};
}
const box = p => ({l:p.x0 - MISS, r:p.x0 + p.w + MISS, t:p.y - ht(p) - MISS, b:p.y + MISS});
const inside = (o, b) => o.x >= b.l && o.x <= b.r && o.y >= b.t && o.y <= b.b;
// where the line from o along the unit vector d enters box b (0 inside), or null
function enters(o, d, b){
  let t0 = 0, t1 = Infinity;
  for(const [oo, dd, lo, hi] of [[o.x, d.x, b.l, b.r], [o.y, d.y, b.t, b.b]]){
    if(Math.abs(dd) < 1e-9){ if(oo < lo || oo > hi) return null; continue; }
    const a = (lo - oo)/dd, c = (hi - oo)/dd;
    t0 = Math.max(t0, Math.min(a, c)); t1 = Math.min(t1, Math.max(a, c));
    if(t0 > t1) return null;
  }
  return t0;
}
function aim(now){
  if(!drag.trail.length) return null;   // no position yet (it must never break the frame loop)
  const o = drag.trail[drag.trail.length - 1], d = flick(now), list = inAir();
  if(!d) return list.find(p => inside(o, box(p))) || null;
  let hit = null, ht = Infinity, near = null, na = AIM_MAX*Math.PI/180;
  for(const p of list){
    const b = box(p), t = enters(o, d, b);
    if(t != null){ if(t < ht){ hit = p; ht = t; } continue; }
    for(const [x, y] of [[b.l, b.t], [b.r, b.t], [b.l, b.b], [b.r, b.b]]){
      const a = Math.acos(Math.max(-1, Math.min(1, ((x - o.x)*d.x + (y - o.y)*d.y)/Math.hypot(x - o.x, y - o.y))));
      if(a < na){ near = p; na = a; }
    }
  }
  return hit || near;
}
// the magenta frame on the equation a release would hit and on those bricks
// are flying to, also while the finger stands still and the equation moves
function showTarget(){
  const t = new Set(flights.map(f => f.p));
  if(drag) t.add(aim(performance.now()));
  for(const p of inAir()) p.el.classList.toggle("target", t.has(p));
}
/* A thrown brick flies to its equation's middle in a moment (FLY_SPEED, at
   least FLY_MIN and at most FLY_MAX seconds), following it as it falls, and
   the operation is done when it arrives (the count goes down then). One not
   thrown, or whose equation was solved or landed meanwhile, flies back to its
   slot unused. A zero bomb's shot (shot) flies the same way, in SHOT_T, and
   just goes out if its equation is gone. */
let flights = [];
const flyingTo = key => flights.filter(f => f.key === key && f.p).length;
const pieceMiddle = p => ({x:X(p.x0 + p.w/2), y:Y(p.y - ht(p)/2)});
function launch(f, from){
  const to = f.p ? pieceMiddle(f.p) : opCenter(f.key);
  f.from = from; f.t = 0;
  f.dur = f.shot ? SHOT_T : Math.min(FLY_MAX, Math.max(FLY_MIN, Math.hypot(to.x - from.x, to.y - from.y)/cell/FLY_SPEED));
  if(!flights.includes(f)) flights.push(f);
}
function stepFlights(dt){
  for(const f of [...flights]){
    f.t += dt;
    const to = f.p ? pieceMiddle(f.p) : opCenter(f.key), e = Math.min(1, f.t/f.dur), k = 1 - (1 - e)**2;
    place(f.g, f.from.x + (to.x - f.from.x)*k, f.from.y + (to.y - f.from.y)*k);
    if(e < 1) continue;
    const p = f.p;
    if(f.shot) shotDown(p, f.x);
    else if(p && pieces.includes(p) && applyOp(f.key, p, f.x)) p.el.classList.remove("target");
    else if(p){ f.p = null; launch(f, to); continue; }
    f.g.remove(); flights.splice(flights.indexOf(f), 1);
  }
}
function startDrag(e, key){
  if(over || paused || counts[key] - flyingTo(key) <= 0 || drag) return;
  e.preventDefault();
  const src = opEls[key];
  const g = document.createElement("div");
  g.className = "opb ghost" + (e.pointerType === "touch" ? " touch" : "");
  g.innerHTML = `<span class="lbl">${OPS[key].html}</span>`;
  g.style.fontSize = src.style.fontSize;
  board.appendChild(g);
  g.style.width = src.offsetWidth + "px"; g.style.height = src.offsetWidth + "px";
  drag = {key, g, id:e.pointerId, trail:[]};
  // Some setups refuse the capture (a friend's Windows Chrome: the drag
  // stuck for good); the page-wide listeners carry the drag without it
  try{ src.setPointerCapture(e.pointerId); }catch(err){}
  moveDrag(e);
  window.addEventListener("pointermove", moveDrag);
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
}
function moveDrag(e){
  if(!drag || e.pointerId !== drag.id) return;
  const pt = boardXY(e), now = performance.now();
  place(drag.g, pt.x, pt.y);
  drag.trail.push({x:pt.x/cell - WALL, y:pt.y/cell, t:now});
  while(now - drag.trail[0].t > 500) drag.trail.shift();
  showTarget();
}
function endDrag(e){
  if(!drag || e.pointerId !== drag.id) return;
  window.removeEventListener("pointermove", moveDrag);
  window.removeEventListener("pointerup", endDrag);
  window.removeEventListener("pointercancel", endDrag);
  const pt = boardXY(e), now = performance.now();
  drag.trail.push({x:pt.x/cell - WALL, y:pt.y/cell, t:now});
  const t = e.type === "pointerup" ? aim(now) : null;
  drag.g.classList.remove("touch");   // no finger over it any more
  launch({g:drag.g, key:drag.key, p:t, x:pt.x/cell - WALL}, pt);
  drag = null;
  showTarget();
}

/* ── pulling an equation down ───────────────────────────────────────────────
   For an equation that can't be solved with what is left. A swipe that starts
   in an equation's area (targetAt) pulls it: it moves down with the finger,
   never up, and if it was pulled PULL cells or more it drops fast (DROP) when
   let go; less, and it just goes on falling.
   A double click or tap in its area, or ↓ / space (the lowest equation),
   drops it at once; only a real tap (short, hardly moved) counts as the
   first half of a double tap. */
let pull = null, lastTap = null;
function dropFast(p){ if(p && p.bomb == null && !paused) p.fast = true; }
// A press with the pointer of a drag or pull still open: its release was lost
// (it must never stay stuck); the brick flies back first, the pull just ends
document.addEventListener("pointerdown", e => {
  if(drag && e.pointerId === drag.id) endDrag({pointerId:drag.id, type:"pointercancel", clientX:e.clientX, clientY:e.clientY});
  if(pull && e.pointerId === pull.id) pull = null;
}, true);
board.addEventListener("pointerdown", e => {
  if(over || paused || drag || pull || e.target.closest(".opb")) return;
  const pt = boardXY(e), p = targetAt(pt);
  if(!p) return;
  e.preventDefault();
  const now = performance.now();
  if(lastTap && lastTap.p === p && now - lastTap.t < 300){ lastTap = null; dropFast(p); return; }
  lastTap = null;
  pull = {p, id:e.pointerId, x0:pt.x, y0:pt.y, t0:now, done:0, moved:0};
  try{ board.setPointerCapture(e.pointerId); }catch(err){}   // may be refused (see startDrag)
});
board.addEventListener("pointermove", e => {
  if(!pull || paused || e.pointerId !== pull.id) return;
  const pt = boardXY(e), p = pull.p, d = (pt.y - pull.y0)/cell;
  pull.moved = Math.max(pull.moved, Math.hypot(pt.x - pull.x0, pt.y - pull.y0)/cell);
  if(d <= pull.done || !pieces.includes(p) || p.bomb != null) return;
  p.y = Math.min(p.y + d - pull.done, surface(p.x0, p.x0 + p.w - 1));   // lands in the next frame
  pull.done = d; drawPiece(p);
});
function endPull(e){
  if(!pull || e.pointerId !== pull.id) return;
  const now = performance.now();
  if(e.type === "pointerup" && pull.done >= PULL) dropFast(pull.p);
  if(e.type === "pointerup" && pull.moved < .3 && now - pull.t0 < 300) lastTap = {p:pull.p, t:now};
  pull = null;
}
board.addEventListener("pointerup", endPull);
board.addEventListener("pointercancel", endPull);
document.addEventListener("keydown", e => {
  if(e.key !== "ArrowDown" && e.key !== " ") return;
  if(over || paused || e.target.closest("button, a")) return;   // space on a button presses the button
  const list = inAir();
  if(!list.length) return;
  e.preventDefault();
  dropFast(list.reduce((a, b) => b.y > a.y ? b : a));
});

/* ── the loop ───────────────────────────────────────────────────────────── */
let last = 0;
function frame(t){
  const dt = Math.min(.1, (t - last)/1000); last = t;
  if(!over && !paused){
    for(const p of [...pieces]){
      if(over) break;
      if(!pieces.includes(p)) continue;   // gone in a contradiction's blowup
      if(p.bomb != null){ stepBomb(p, dt); continue; }
      p.y += (p.fast ? DROP : ramp(speed.fall))*dt;
      const s = surface(p.x0, p.x0 + p.w - 1);
      if(p.glow != null){   // solved and glowing: it rests on the trash if it gets there
        p.y = Math.min(p.y, s); drawPiece(p);
        if((p.glow += dt) >= GLOW){ if(p.blast) blowUp(p); else toBombs(p); }
      }
      else if(p.y >= s){ p.y = s; drawPiece(p); land(p); }
      else drawPiece(p);
    }
    if(wantSpawn(dt)) spawn();
    if(!over && eqNo >= EQUATIONS && !pieces.length && !busy) finish();
  }
  if(!paused) stepFlights(dt);
  showTarget();
  requestAnimationFrame(frame);
}

/* ── start and end ──────────────────────────────────────────────────────── */
function newGame(){
  $("overlay").classList.remove("show"); $("pauseOv").classList.remove("show"); paused = false;
  for(const el of board.querySelectorAll(".piece, .bomb, .trash, .trashtext, .fly, .ring, .note, .ghost, .shot, .sparks, .flash, .bolts")) el.remove();
  counts = {...START}; pieces = []; bricks = []; blocks = {n:0}; nextBrickId = 0; gameNo++;
  score = 0; recent = []; drag = null; pull = null; lastTap = null; busy = 0; flights = [];
  pts = {solve:0, perfect:0, perfects:0, neat:0, neats:0, neg:0, clear:0, cleared:0, spare:0, left:0, blast:0, destroyed:0, dropped:0, split:0};
  owned = new Set(BASE); promised = new Set(BASE); pie = 0; pieComing = 0; drawPie();
  for(const key of Object.keys(OPS)){ opEls[key].hidden = !owned.has(key); drawCount(key); }
  $("score").textContent = 0; $("trashCount").textContent = 0;
  level = 0; startLevel();
  chooseRows(); layout();
}
// the next level: the counts and the operations stay as they are, and the trash
// too unless the level is fresh (it was paid for in the dialog, showLevel)
function startLevel(){
  $("overlay").classList.remove("show");
  level++; eqNo = 0; solved = 0; over = false; since = 0; contras = 0;
  if(lv().fresh){
    for(const b of bricks) b.el.remove();
    bricks = []; blocks = {n:0}; drawTrashText(); drawTrashCount();
  }
  if(lv().start){   // a new chapter (Vadim): every brick goes (its uses were paid as points, showLevel), the chapter's own come
    for(const key of [...owned]){ counts[key] = 0; owned.delete(key); opEls[key].hidden = true; drawCount(key); }
    promised = new Set(Object.keys(lv().start));
    for(const [key, n] of Object.entries(lv().start)){ counts[key] = n; own(key); drawCount(key); }
  }
  if(lv().keep){   // a new set (Vadim, level 6): the others go (their uses were paid as points, showLevel)
    for(const key of [...owned]) if(!lv().keep.includes(key)){ counts[key] = 0; owned.delete(key); opEls[key].hidden = true; drawCount(key); }
    promised = new Set(owned);
  }
  for(const key of lv().drop || []) if(owned.has(key)){ counts[key] = 0; owned.delete(key); promised.delete(key); opEls[key].hidden = true; drawCount(key); }   // level 5: ·4 and :4 (paid as points, showLevel)
  for(const [key, n] of Object.entries(lv().add || {})){ counts[key] += n; promised.add(key); own(key); drawCount(key); }   // the others stay
  document.body.classList.toggle("metal", lv().chapter === 2);   // chapter 2's look (theme.css)
  layout();
  start = {score, pts:{...pts}};
  $("level").textContent = `${level}/${LEVELS.length}`;
  $("eqNo").textContent = `0/${EQUATIONS}`; $("solved").textContent = 0;
}
function gameOver(){
  over = true;
  showResult("Peli päättyi");
}
function finish(){
  over = true;
  if(level < LEVELS.length) showLevel();
  else showResult("Valmis!");
  celebrate();
}
const row = (label, v, cls = "") => `<span class="${cls}">${label}</span><span class="v ${cls}">${v}</span>`;
// points by kind, since the counts in `from` (none: the whole game)
function scoreRows(from){
  const d = k => pts[k] - (from ? from[k] : 0);
  return row("Ratkaistut yhtälöt", `${d("solve")/POINTS} × ${POINTS}`) +
    (d("split") ? row("Nollasäännön osat", `${d("split")/POINTS} × ${POINTS}`) : "") +
    row("Täydelliset ratkaisut", `${d("perfects")} × ${PERFECT}`) +
    row("Siistit ratkaisut", `${d("neats")} × ${NEAT}`) +
    row("Miinuspommit", num(d("neg"))) +
    row("Siivottu roska", `${d("cleared")} × ${CLEAR_POINTS}`) +
    (d("destroyed") ? row("Räjäytetyt yhtälöt", `${d("destroyed")} × ${POINTS}`) : "") +
    (d("spare") ? row("Täysi varasto", d("spare")) : "") +
    (d("dropped") ? row("Poistuneet operaatiot", `${d("dropped")/SPARE_POINTS} × ${SPARE_POINTS}`) : "");
}
// the speed slider (start and end dialogs): it sets `speed` at once
const multText = m => "×" + String(m).replace(".", ",");
function setSpeed(i){
  speed = SPEEDS[i]; $("speedRange").value = i;

}
$("speedRange").addEventListener("input", e => setSpeed(+e.target.value));
for(const b of document.querySelectorAll(".speedlabels button")) b.addEventListener("click", () => setSpeed(+b.dataset.s));
setSpeed(SPEEDS.indexOf(speed));
const speedRow = () => row(`Nopeus: ${speed.name}`, multText(speed.mult));
function showDialog(button, then, pick = false){
  $("speedPick").hidden = !pick;

  $("overlay").classList.add("show");

}
let onAgain = newGame;
// When the page opens (Vadim): the game waits for a tap on Aloita. Chrome lets

function showStart(){

  $("ovResult").textContent = `${EQUATIONS} yhtälöä`;

}
// a level done: its own points. The trash left goes on to the next level and
// is no loss yet, unless the next level starts with an empty well: then it
// costs now, as at the end of the game.
function showLevel(){
  const next = LEVELS[level], fresh = next.fresh, left = fresh ? bricks.length : 0;
  if(left){ pts.left += left; score -= CLEAR_POINTS*left*speed.mult; $("score").textContent = num(score); }
  // a new chapter takes every brick away: their uses become points (Vadim)
  const goes = next.start ? [...owned] : next.keep ? [...owned].filter(key => !next.keep.includes(key)) : (next.drop || []).filter(key => owned.has(key));
  const dropped = goes.reduce((n, key) => n + counts[key], 0);

// the end of the game: trash left costs as much as clearing it would have given (Vadim)

$("restart").addEventListener("click", newGame);
$("again").addEventListener("click", () => onAgain());
window.addEventListener("resize", () => { if(counts) layout(); });
/* Pause (Vadim). Android's back gesture (a swipe in from the screen's left or
   right edge) can't be switched off by a page, and it comes by accident when a
   brick is dragged from a wall. So while the page is open it keeps one extra
   step in the browser's history: a back takes only that step away, and if the
   game is running it pauses ("Peli on tauolla"). "Jatka peliä" puts the step
   back; a second back in the pause leaves the page, as a back does in the
   other dialogs. The step is added in a touch or key handler: Chrome skips
   history steps a page adds without one. The same pause also comes from the
   "Tauko" button under the well and from P or Esc (Vadim: for PCs), and P or
   Esc goes on again. */
const arm = () => { if(!(history.state && history.state.play)) history.pushState({play:true}, ""); };
document.addEventListener("pointerup", arm);
document.addEventListener("keydown", arm);
function pause(){

}

});
$("resume").addEventListener("click", resume);
$("pause").addEventListener("click", pause);
document.addEventListener("keydown", e => {
  if(e.key !== "Escape" && e.key.toLowerCase() !== "p" || e.repeat) return;
  if(paused) resume(); else pause();
});

/* testing (Vadim): typing "xyz", or the page opened with ?testi, shows a
   button that ends the level now (what is in the air goes away; the trash
   and the counts go on, every brick of the level +3). Students never see it. */
const TEST_CODE = "xyz"; let typed = "";
const showTestTools = () => { $("skipLevel").hidden = false; };
if(new URLSearchParams(location.search).has("testi")) showTestTools();
document.addEventListener("keydown", e => { typed = (typed + e.key.toLowerCase()).slice(-TEST_CODE.length); if(typed === TEST_CODE) showTestTools(); });
$("skipLevel").addEventListener("click", () => {
  if(over) return;
  // +3 for every brick the player could have by the end of this level (Vadim):
  // the basic ones, its gifts, the next level's first ones, ⚡
  const G = lv().gifts || GIFTS;
  const base = LEVELS.slice(0, level).reduce((b, l) => l.start ? Object.keys(l.start) : l.keep ? l.keep
    : [...b, ...Object.keys(l.add || {})].filter(key => !(l.drop || []).includes(key)), BASE);   // the chapter's own
  const all = [...base, ...Object.keys(G).filter(j => (GIFT_FROM[j] || 1) <= level),
               ...firstGroups(EQUATIONS, true).flat(), ...(lv().contra ? ["N"] : [])];
  for(const key of new Set(all)){
    counts[key] = Math.min(capOf(key), counts[key] + 3); promised.add(key); own(key); drawCount(key);
  }
  for(const p of pieces) p.el.remove();
  pieces = []; eqNo = EQUATIONS;   // the loop ends the level once the rewards on their way have arrived
});

makeOpBricks();
document.fonts.ready.then(() => { newGame(); showStart(); requestAnimationFrame(t => { last = t; frame(t); }); });
</script>
