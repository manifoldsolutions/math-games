<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifold Solutions — learning games</title>

<!-- ════════════════════════════════════════════════════════════════════
     HOW TO ADD GAMES
     ────────────────────────────────────────────────────────────────────
     Structure is three levels:  Category → Course → Games
     Everything you edit lives in the CATALOG array in the <script> block
     near the bottom of this file.

       Category  (e.g. "Lukio math")
         Course  (e.g. "MAA 1–2")
           Game  → points at a folder via its `game` path

     To add a game:
       1. Put the game in its own folder, e.g.  games/lukio/maa1-2/game1/
          with the game's own index.html inside it.
       2. Add a game entry in the right course whose `game` is that path.
     Set `game: null` to show a game as "Coming soon" (not clickable).
     Titles and blurbs can be given in both languages: { fi: "…", en: "…" }
     (see the comment above CATALOG for the language switch).

     IDs (the `id:` fields) become part of the URL, so keep them short and
     url-safe: lowercase letters, numbers and hyphens, no spaces.
     Paths are relative to this file, so keep this file at the repo root.
     ════════════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- shared site look (the games use the same file) -->
<link rel="stylesheet" href="assets/theme.css">

<style>
  /* Main-page layout only. Colours and fonts come from assets/theme.css. */
  :root{ --maxw:1040px; }

  body{ line-height:1.5; min-height:100vh; display:flex; flex-direction:column; }

  .wrap{
    width:100%;
    max-width:var(--maxw);
    margin-inline:auto;
    padding-inline:clamp(20px, 5vw, 44px);
  }

  /* ── Hero ──────────────────────────────────────────────── */
  .hero{
    position:relative;
    overflow:hidden;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(8,7,15,.85), rgba(8,7,15,.35));
  }
  .hero::after{                       /* neon horizon line under the hero */
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:linear-gradient(90deg, transparent, var(--magenta) 20%, var(--accent) 60%, transparent);
    box-shadow:0 0 12px rgba(255,61,242,.6);
  }
  .hero .wrap{
    position:relative;
    z-index:1;
    padding-block:clamp(40px, 9vw, 84px) clamp(32px, 7vw, 60px);
  }
  .mark{
    font-family:var(--ui);
    font-weight:600;
    letter-spacing:.04em;
    font-size:15px;
    color:var(--accent-ink);
    display:inline-flex;
    align-items:center;
    gap:9px;
  }
  .mark svg{ display:block; filter:var(--glow-cyan); }

  /* FI | EN switch, top right of the hero */
  .langsw{
    position:absolute; top:clamp(28px, 6vw, 60px); right:clamp(20px, 5vw, 44px);
    display:inline-flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    background:rgba(8,7,15,.7);
  }
  .langsw button{
    font:600 13px var(--ui); letter-spacing:.08em; color:var(--muted); background:transparent;
    border:0; padding:6px 12px; cursor:pointer;
  }
  .langsw button:hover{ color:var(--accent-ink); }
  .langsw button[aria-pressed="true"]{ background:rgba(0,229,255,.16); color:var(--accent-ink); }
  .langsw button:focus-visible{ outline:2px solid var(--magenta); outline-offset:-2px; }
  .hero h1{
    font-family:var(--display);
    font-weight:800;
    letter-spacing:.02em;
    font-size:clamp(28px, 7vw, 60px);
    line-height:1.08;
    margin:22px 0 0;
    max-width:16ch;
    text-shadow:0 0 18px rgba(0,229,255,.35);
  }
  .hero p{
    color:var(--muted);
    font-size:clamp(15px, 2.2vw, 18px);
    margin:16px 0 0;
    max-width:52ch;
  }
  .hero p:empty{ display:none; }

  /* neon manifold mesh behind the hero: draws itself in once on load */
  .mesh{
    position:absolute; inset:0; z-index:0;
    width:100%; height:100%;
    pointer-events:none;
    mask-image:linear-gradient(100deg, transparent 8%, #000 45%, #000 85%, transparent);
    -webkit-mask-image:linear-gradient(100deg, transparent 8%, #000 45%, #000 85%, transparent);
  }
  .mesh path{ fill:none; stroke-width:1.2; vector-effect:non-scaling-stroke; }
  .mesh .h path{ stroke:var(--accent);  opacity:.55; }
  .mesh .v path{ stroke:var(--magenta); opacity:.45; }
  .mesh .h{ filter:var(--glow-cyan); }
  .mesh .v{ filter:var(--glow-magenta); }
  .mesh path{ stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 1.6s cubic-bezier(.3,.6,.2,1) forwards; }
  .mesh .v path{ animation-delay:.35s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @media (max-width:600px){ .mesh{ opacity:.6; } }   /* the heading covers the mesh on phones */

  /* ── Breadcrumb ────────────────────────────────────────── */
  .crumb{
    font-family:var(--ui);
    font-size:14px;
    font-weight:500;
    letter-spacing:.03em;
    color:var(--muted);
    padding-block:24px 4px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .crumb a{ text-decoration:none; color:var(--muted); border-radius:var(--radius); }
  .crumb a:hover{ color:var(--accent-ink); }
  .crumb a:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .crumb .sep{ color:var(--magenta); opacity:.7; }
  .crumb .here{ color:var(--ink); }

  /* ── Content ───────────────────────────────────────────── */
  main{ flex:1; padding-bottom:64px; }
  .lead{ margin:6px 0 26px; }
  .lead h2{
    font-family:var(--display);
    font-weight:700;
    letter-spacing:.04em;
    font-size:clamp(20px, 3.2vw, 28px);
    color:var(--accent-ink);
    text-shadow:var(--glow-text);
    margin:0;
  }
  .lead p{ color:var(--muted); margin:8px 0 0; max-width:56ch; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:16px;
  }

  /* cards: dark panels with HUD corner brackets that light up on hover */
  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:10px;
    text-decoration:none;
    background:rgba(18,15,36,.82);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 22px 20px;
    min-height:150px;
    transition:border-color .16s ease, transform .16s ease, box-shadow .16s ease, background .16s ease;
  }
  .card::before, .card::after{
    content:""; position:absolute; width:14px; height:14px; pointer-events:none;
    border-color:var(--accent); border-style:solid; opacity:.55;
    transition:opacity .16s ease, width .16s ease, height .16s ease;
  }
  .card::before{ top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .card::after{ bottom:-1px; right:-1px; border-width:0 2px 2px 0; border-color:var(--magenta); }
  .card .glyph{ color:var(--accent); filter:var(--glow-cyan); align-self:flex-start; }
  /* "In Finnish" / "In English" on a category in one language only */
  .card .tag{
    position:absolute; top:20px; right:20px;
    font-family:var(--ui); font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    color:var(--magenta-ink); border:1px solid rgba(255,61,242,.55); border-radius:var(--radius); padding:2px 7px;
  }
  .card .glyph.txt{ font-family:var(--ui); font-weight:700; font-size:19px; line-height:26px; height:26px; letter-spacing:.02em; white-space:nowrap; }
  .card .title{
    font-family:var(--ui);
    font-weight:700;
    font-size:21px;
    letter-spacing:.01em;
    margin-top:2px;
    color:var(--ink);
  }
  .card .blurb{ color:var(--muted); font-size:14.5px; }
  .card .meta{
    margin-top:auto;
    padding-top:12px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--accent-ink);
    display:flex;
    align-items:center;
    gap:6px;
  }
  a.card:hover{
    border-color:rgba(0,229,255,.6);
    background:rgba(26,22,54,.92);
    transform:translateY(-2px);
    box-shadow:0 0 22px rgba(0,229,255,.22), inset 0 0 18px rgba(0,229,255,.06);
  }
  a.card:hover::before, a.card:hover::after{ opacity:1; width:22px; height:22px; }
  a.card:focus-visible{ outline:2px solid var(--magenta); outline-offset:3px; }

  /* disabled "coming soon" card */
  .card.soon{ opacity:.55; cursor:default; border-style:dashed; }
  .card.soon::before, .card.soon::after{ display:none; }
  .card.soon .meta{ color:var(--muted); }

  /* empty state — a category with no courses, or a course with no games */
  .empty{
    border:1px dashed rgba(255,61,242,.45);
    border-radius:var(--radius);
    padding:44px 24px;
    text-align:center;
    color:var(--muted);
    font-family:var(--ui);
    font-weight:500;
    letter-spacing:.04em;
    font-size:16px;
    background:rgba(18,15,36,.5);
  }

  footer{
    border-top:1px solid var(--line);
    color:var(--muted);
    font-size:13px;
    background:rgba(8,7,15,.6);
  }
  footer .wrap{ padding-block:20px; }

  .view{ animation:rise .28s ease both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    .view{ animation:none; }
    a.card:hover{ transform:none; }
    .mesh path{ animation:none; stroke-dashoffset:0; }
  }
  .card .title, .card .blurb, .lead h2{ white-space:pre-line; }
</style>
</head>
<body>

  <header class="hero">
    <svg class="mesh" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <!-- a warped grid — a nod to "manifold" -->
      <g class="h">
        <path d="M0,40 C160,10 320,70 480,35 C620,6 720,52 800,28"/>
        <path d="M0,90 C160,62 320,120 480,84 C620,56 720,102 800,78"/>
        <path d="M0,140 C160,114 320,170 480,134 C620,108 720,152 800,130"/>
        <path d="M0,190 C160,166 320,220 480,186 C620,160 720,204 800,182"/>
        <path d="M0,240 C160,218 320,270 480,238 C620,212 720,256 800,236"/>
        <path d="M0,290 C160,270 320,320 480,288 C620,264 720,306 800,288"/>
      </g>
      <g class="v">
        <path d="M60,0 C40,90 96,150 60,300"/>
        <path d="M150,0 C128,92 184,150 150,300"/>
        <path d="M240,0 C220,90 276,152 240,300"/>
        <path d="M330,0 C310,92 366,150 330,300"/>
        <path d="M420,0 C400,92 456,150 420,300"/>
        <path d="M510,0 C490,90 546,152 510,300"/>
        <path d="M600,0 C580,92 636,150 600,300"/>
        <path d="M690,0 C670,90 726,152 690,300"/>
        <path d="M780,0 C760,92 816,150 780,300"/>
      </g>
    </svg>
    <div class="wrap">
      <span class="mark">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M2,12 C5,4 8,4 9,9 C10,14 13,14 16,6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        manifoldsolutions.fi
      </span>
      <div class="langsw" id="langsw" role="group" aria-label="Kieli / Language">
        <button type="button" data-lang="fi">FI</button><button type="button" data-lang="en">EN</button>
      </div>
      <h1 id="heroTitle">Math games by<br>Vadim Weinstein.</h1>
      <p></p>
    </div>
  </header>

  <nav class="wrap crumb" id="crumb" aria-label="Breadcrumb"></nav>

  <main class="wrap">
    <div id="app"></div>
  </main>

  <footer><div class="wrap" id="footText">Built and hosted on GitHub Pages.</div></footer>

<script>
/* ══════════════════════════════════════════════════════════════════════
   EDIT ME — your categories, courses, and games live here.
   Three levels:  category → courses[] → games[]
   Each game's `game` is a path to a folder containing that game's own
   index.html. Use `game: null` for a game that isn't ready yet.
   Keep every `id` short and url-safe (lowercase, digits, hyphens).
   `icon` (optional, on any level) picks the card's glyph: a name from
   GLYPHS below (e.g. "scale") or a short text such as "f(x)". A course
   without one shows its category's glyph, a game its course's.
   Languages: the page has a FI/EN switch. A `title` or `blurb` is either
   one string (same in both) or { fi: "…", en: "…" }. A category whose
   content is in one language only gets `lang: "fi"` or `lang: "en"`; its
   card then carries a small "In Finnish" / "In English" tag in the other
   language. `kind: "tool"` marks something that isn't a game (the card
   says "Avaa / Explore" instead of "Pelaa / Play"). A category whose
   sections aren't school courses gets `sub: "topics"` ("1 aihe / 1 topic"
   instead of "1 kurssi / 1 course").
   ══════════════════════════════════════════════════════════════════════ */
const CATALOG = [
  {
    id: "lukio",
    title: "Lukiomatikkaa",
    blurb: { fi: "Lukion matematiikka.", en: "Finnish upper-secondary maths." },
    lang: "fi",
    icon: "lyre",
    courses: [
      {
        id: "maa1-2",
        title: "MAA 1–2",
        blurb: "Funktiot ja yhtälöt",
        icon: "f(x)",
        games: [
          { id: "game0", title: "Yhtälövaaka", icon: "scale", game: "games/lukio/maa1-2/yhtalovaaka/" },
          { id: "game1", title: "Yhtälön ratkaisu 1", icon: "boxedx", game: "games/lukio/maa1-2/yhtalo1/" },
          { id: "game2", title: "Yhtälön ratkaisu 2", icon: "boxedx", game: "games/lukio/maa1-2/yhtalo2/" },
        ],
      },
      {
        id: "maa3",
        title: "MAA 3",
        blurb: "Geometria",
        icon: "geometry",
        games: [],
      },
      {
        id: "maa5",
        title: "MAA 5",
        blurb: "Trigonometria",
        icon: "sin x",
        games: [
          { id: "1-ympyra1", title: "Yksikköympyrä", icon: "unitcircle", game: "games/lukio/maa5/yksikkoympyra/" },
        ],
      },
    ],
  },
  {
    id: "ib",
    title: "IB math",
    blurb: { fi: "International Baccalaureate -matematiikka.", en: "International Baccalaureate." },
    lang: "en",
    icon: "globe",
    courses: [],
  },
  {
    id: "artsy",
    sub: "topics",
    title: { fi: "Matikkataiteilua", en: "Artsy Math" },
    blurb: { fi: "Visualisointeja", en: "Visualizations" },
    icon: "spiral",
    courses: [
      {
        id: "fractals",
        title: { fi: "Fraktaaleja", en: "Fractals" },
        blurb: { fi: "Attraktoreita ja fraktaaleja", en: "Attractors and fractals" },
        icon: "sierpinski",
        games: [
          { id: "ifs_explorer", title: "IFS explorer", kind: "tool", icon: "sierpinski",
            blurb: { fi: "Iteroidut funktiosysteemit ja flame-algoritmi", en: "Iterated Function Systems and the Flame Algorithm" },
            game: "games/artsy_math/fractals/ifs_explorer/" },
        ],
      },
    ],
  },
];
/* ════════════════════ end of the part you edit ════════════════════════ */

/* ── language ───────────────────────────────────────────────────────────
   One site-wide choice in localStorage "lang" (the IFS explorer reads the
   same key). Default: Finnish for a Finnish browser, English otherwise. */
const UI = {
  fi: {
    home: 'Kategoriat', pick: 'Valitse kategoria', courses: n => n === 1 ? '1 kurssi' : `${n} kurssia`,
    topics: n => n === 1 ? '1 aihe' : `${n} aihetta`, noTopics: 'Täällä ei ole vielä aiheita.',
    games: n => n === 1 ? '1 peli' : `${n} peliä`, tools: n => n === 1 ? '1 työkalu' : `${n} työkalua`,
    play: 'Pelaa', open: 'Avaa', soon: 'Tulossa', noCourses: 'Täällä ei ole vielä kursseja.', noGames: 'Täällä ei ole vielä pelejä.',
    hero: 'Tervetuloa pelaamaan Vadimin matikkapelejä', footer: 'Tehty ja julkaistu GitHub Pagesissa.',
    onlyIn: { en: 'In English' }, title: 'Vadimin matikkapelit', crumb: 'Sijainti',
  },
  en: {
    home: 'Categories', pick: 'Select category', courses: n => n === 1 ? '1 course' : `${n} courses`,
    topics: n => n === 1 ? '1 topic' : `${n} topics`, noTopics: 'No topics here yet.',
    games: n => n === 1 ? '1 game' : `${n} games`, tools: n => n === 1 ? '1 tool' : `${n} tools`,
    play: 'Play', open: 'Explore', soon: 'Coming soon', noCourses: 'No courses here yet.', noGames: 'No games here yet.',
    hero: 'Math games by<br>Vadim Weinstein.', footer: 'Built and hosted on GitHub Pages.',
    onlyIn: { fi: 'In Finnish' }, title: 'Manifold Solutions — learning games', crumb: 'Breadcrumb',
  },
};
let LANG = (navigator.language || '').toLowerCase().startsWith('fi') ? 'fi' : 'en';
try { const l = localStorage.getItem('lang'); if (UI[l]) LANG = l; } catch (e) {}
const L = () => UI[LANG];
const tr = v => (v && typeof v === 'object') ? (v[LANG] ?? v.en ?? v.fi) : (v || '');   // a catalog text in the current language

const app   = document.getElementById('app');
const crumb = document.getElementById('crumb');
const catById    = id => CATALOG.find(c => c.id === id);
const courseById = (cat, id) => cat.courses.find(c => c.id === id);

// card glyphs: one family of thin neon line drawings on a 26×26 grid.
// `faint` is for helper lines (axes, grids) drawn thinner and dimmer.
const faint = d => `<path d="${d}" stroke-width="1.2" opacity=".45"/>`;
const AXES = faint("M1,13 H25 M13,1 V25");
const GLYPHS = {
  lyre:       `<path d="M10,22.5 C5.5,20.5 3,15.5 4.6,12 C5.8,9.6 7.8,8.6 7.6,6.4 C7.5,4.6 5.6,3.6 4.4,4.8 M16,22.5 C20.5,20.5 23,15.5 21.4,12 C20.2,9.6 18.2,8.6 18.4,6.4 C18.5,4.6 20.4,3.6 21.6,4.8"/>`   // the ylioppilaslakki lyre
            + `<path d="M10,22.5 Q13,24.4 16,22.5 M7.6,8.2 H18.4"/>` + `<path d="M11.2,8.2 V23.2 M13,8.2 V23.6 M14.8,8.2 V23.2" stroke-width="1.1"/>`,
  crosshair:  `<circle cx="13" cy="13" r="10"/>` + faint("M3,13 H23 M13,3 V23"),
  parabola:   faint("M1,16 H25 M13,2 V24") + `<path d="M2.5,5 Q13,31 23.5,5"/>`,
  globe:      `<circle cx="13" cy="13" r="10"/><ellipse cx="13" cy="13" rx="4.5" ry="10"/>` + faint("M3,13 H23 M4.3,8 H21.7 M4.3,18 H21.7"),
  spiral:     faint("M1.04,5.64 H24.96 V20.36 H1.04 Z M15.76,5.64 V20.36 M15.76,14.84 H24.96 M19.44,14.84 V20.36 M15.76,16.68 H19.44 M17.6,14.84 V16.68")
            + `<path d="M1.04,20.36 A14.72,14.72 0 0 1 15.76,5.64 A9.2,9.2 0 0 1 24.96,14.84 A5.52,5.52 0 0 1 19.44,20.36 A3.68,3.68 0 0 1 15.76,16.68 A1.84,1.84 0 0 1 17.6,14.84 A1.84,1.84 0 0 1 19.44,16.68"/>`,
  geometry:   `<path d="M4,22 L22,22 L4,4 Z"/><path d="M4,17 H9 V22" stroke-width="1.2"/>`,   // right isosceles, with the right-angle mark
  unitcircle: AXES + `<circle cx="13" cy="13" r="9"/><path d="M13,13 L18.8,6.1"/>`
            + `<circle cx="18.8" cy="6.1" r="1.9" fill="currentColor" stroke="none"/>`,
  sierpinski: `<path d="M2,23.5 L24,23.5 L13,4.4 Z M13,23.5 L18.5,14 L7.5,14 Z M7.5,23.5 L10.2,18.7 L4.8,18.7 Z M18.5,23.5 L21.2,18.7 L15.8,18.7 Z M13,14 L15.8,9.2 L10.2,9.2 Z"/>`,
  scale:      `<path d="M13,6 V22 M8,22 H18 M3,8 H23 M3,8 L0.8,15 M3,8 L5.2,15 M23,8 L20.8,15 M23,8 L25.2,15"/>`
            + `<path d="M0.5,15 Q3,19.5 5.5,15 Z M20.5,15 Q23,19.5 25.5,15 Z"/><circle cx="13" cy="5" r="1.3"/>`,
  boxedx:     `<rect x="3" y="3" width="20" height="20" rx="3"/><path d="M8.5,9.5 Q11.5,8 13,13 Q14.5,18 17.5,16.5 M17.5,9 Q14.5,9.5 13,13 Q11.5,16.5 8.5,17"/>`,   // a curved maths x, not ×
};
// the first icon given (game, course, category); a name from GLYPHS draws it, anything else is text
function glyph(...icons){
  const icon = icons.find(Boolean) || 'crosshair';
  if (!GLYPHS[icon]) return `<span class="glyph txt" aria-hidden="true">${esc(icon)}</span>`;
  return `<svg class="glyph" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true" fill="none"
    stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${GLYPHS[icon]}</svg>`;
}
const arrow = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2,7 h9 M7,3 l4,4 -4,4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const enc = s => encodeURIComponent(s);

function setCrumb(parts){
  crumb.innerHTML = parts.map((p, i) => {
    const tail = i < parts.length - 1 ? '<span class="sep">/</span>' : '';
    if (p.href) return `<a href="${p.href}">${esc(p.label)}</a>${tail}`;
    return `<span class="here">${esc(p.label)}</span>${tail}`;
  }).join(' ');
}

// one reusable card builder. `soon:true` → renders a disabled "coming soon" card.
function card({ href, title, blurb, meta, soon, icon, tag }){
  const inner = `${icon}${tag ? `<span class="tag">${esc(tag)}</span>` : ''}
    <span class="title">${esc(title)}</span>
    ${blurb ? `<span class="blurb">${esc(blurb)}</span>` : ''}
    <span class="meta">${meta}</span>`;
  return soon
    ? `<div class="card soon">${inner}</div>`
    : `<a class="card" href="${href}">${inner}</a>`;
}

// shown when a category has no courses, or a course has no games
function emptyState(msg){ return `<div class="empty">${esc(msg)}</div>`; }

function renderCategories(){
  setCrumb([{ label: L().home }]);
  const cards = CATALOG.map(c => card({
    href: `#/${enc(c.id)}`,
    icon: glyph(c.icon),
    title: tr(c.title),
    blurb: tr(c.blurb),
    tag: c.lang && c.lang !== LANG ? L().onlyIn[c.lang] : '',
    meta: `${L()[c.sub === 'topics' ? 'topics' : 'courses'](c.courses.length)} ${arrow}`,
  })).join('');
  app.innerHTML = `<section class="view">
    <div class="lead"><h2>${esc(L().pick)}</h2></div>
    <div class="grid">${cards}</div>
  </section>`;
}

// "2 games", "1 tool", "2 games, 1 tool"
function countItems(games){
  const tools = games.filter(g => g.kind === 'tool').length, n = games.length - tools;
  return [n || !tools ? L().games(n) : '', tools ? L().tools(tools) : ''].filter(Boolean).join(', ');
}

function renderCourses(cat){
  setCrumb([{ label: L().home, href: '#/' }, { label: tr(cat.title) }]);
  const cards = cat.courses.map(co => card({
    href: `#/${enc(cat.id)}/${enc(co.id)}`,
    icon: glyph(co.icon, cat.icon),
    title: tr(co.title),
    blurb: tr(co.blurb),
    meta: `${countItems(co.games)} ${arrow}`,
  })).join('');
  const blurb = tr(cat.blurb);
  app.innerHTML = `<section class="view">
    <div class="lead"><h2>${esc(tr(cat.title))}</h2>${blurb ? `<p>${esc(blurb)}</p>` : ''}</div>
    ${cat.courses.length ? `<div class="grid">${cards}</div>` : emptyState(cat.sub === 'topics' ? L().noTopics : L().noCourses)}
  </section>`;
}

function renderGames(cat, course){
  setCrumb([
    { label: L().home, href: '#/' },
    { label: tr(cat.title), href: `#/${enc(cat.id)}` },
    { label: tr(course.title) },
  ]);
  const cards = course.games.map(g => card({
    href: g.game ? esc(g.game) : null,
    soon: !g.game,
    icon: glyph(g.icon, course.icon, cat.icon),
    title: tr(g.title),
    blurb: tr(g.blurb),
    meta: g.game ? `${g.kind === 'tool' ? L().open : L().play} ${arrow}` : L().soon,
  })).join('');
  const blurb = tr(course.blurb);
  app.innerHTML = `<section class="view">
    <div class="lead"><h2>${esc(tr(course.title))}</h2>${blurb ? `<p>${esc(blurb)}</p>` : ''}</div>
    ${course.games.length ? `<div class="grid">${cards}</div>` : emptyState(L().noGames)}
  </section>`;
}

function route(keepScroll = false){
  const segs = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  const [catId, courseId] = segs;

  const cat = catId ? catById(catId) : null;
  if (catId && !cat){ location.replace('#/'); return; }            // unknown category → home

  const course = (cat && courseId) ? courseById(cat, courseId) : null;
  if (courseId && !course){ location.replace(`#/${enc(cat.id)}`); return; }  // unknown course → category

  if (course){ document.title = `${tr(course.title)} — ${tr(cat.title)}`; renderGames(cat, course); }
  else if (cat){ document.title = `${tr(cat.title)} — ${L().title}`; renderCourses(cat); }
  else { document.title = L().title; renderCategories(); }

  if (!keepScroll) window.scrollTo({ top: 0 });
}

// the fixed texts of the page, and the FI/EN switch
function applyLang(){
  document.documentElement.lang = LANG;
  document.getElementById('heroTitle').innerHTML = L().hero;
  document.getElementById('footText').textContent = L().footer;
  crumb.setAttribute('aria-label', L().crumb);
  document.querySelectorAll('#langsw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
}
document.querySelectorAll('#langsw button').forEach(b => b.addEventListener('click', () => {
  LANG = b.dataset.lang;
  try { localStorage.setItem('lang', LANG); } catch (e) {}
  applyLang(); route(true);
}));

window.addEventListener('hashchange', () => route());
applyLang();
route();
</script>
</body>
</html>
